/* ---------- Capability catalogue matrix (role row + people row beneath) ---------- */
function capMatrixDomains(list){ const seen=[]; list.forEach(b=>{ if(b.domain && seen.indexOf(b.domain)<0) seen.push(b.domain); }); return seen; }
/* build the wide matrix grid: header, then for each role a role-row (skills across) and a
   people-row beneath it (people who can work on each skill, "; "-joined). */
function buildCapMatrix(list){
  const domains=capMatrixDomains(list);
  const perDom=domains.map(d=>({domain:d, bricks:list.filter(b=>b.domain===d)}));
  const maxCaps=Math.max(1, perDom.reduce((m,x)=>Math.max(m,x.bricks.length),0));
  const header=['Role']; for(let i=0;i<maxCaps;i++) header.push('Capability '+(i+1));
  const grid=[header];
  perDom.forEach(x=>{
    const roleRow=[x.domain], peopleRow=[''];
    for(let i=0;i<maxCaps;i++){ const b=x.bricks[i]; roleRow.push(b?b.name:''); peopleRow.push(b?((b.people||[]).join('; ')):''); }
    grid.push(roleRow); grid.push(peopleRow);
  });
  return grid;
}
/* parse pasted TSV/CSV text into a raw 2-D grid (blank cells preserved, unlike parseImport) */
function capTextToGrid(text){
  text=(text||'').replace(/^﻿/,''); const lines=text.split(/\r?\n/);
  while(lines.length && lines[lines.length-1].trim()==='') lines.pop();
  if(!lines.length) return [];
  const delim = lines[0].indexOf('\t')>=0 ? '\t' : ',';
  return lines.map(l=>splitCSVLine(l, delim).map(c=>c.trim()));
}
/* apply an uploaded/pasted matrix: pair each role row with the (blank-A) people row beneath it,
   then update people for each listed skill (matching role + skill name, case-insensitive) or add it. */
function applyCapMatrix(grid){
  if(!Array.isArray(grid)||grid.length<2){ toast('No catalogue rows found to import'); return; }
  const norm=s=>String(s==null?'':s).trim();
  const splitPeople=s=>norm(s).split(/[;,]/).map(x=>x.trim()).filter(Boolean);
  const domainByLower={}; BRICKS.forEach(b=>{ if(b.domain) domainByLower[b.domain.toLowerCase()]=b.domain; });
  const seen={};   // key "domain||name" -> {domain, name, people}
  let roles=0, i=1;
  while(i<grid.length){
    const row=grid[i]||[]; const roleName=norm(row[0]);
    if(!roleName){ i++; continue; }
    roles++;
    const caps=[]; for(let c=1;c<row.length;c++){ const nm=norm(row[c]); if(nm) caps.push({col:c, name:nm}); }
    let peopleRow=null;
    if(i+1<grid.length && norm((grid[i+1]||[])[0])===''){ peopleRow=grid[i+1]; }
    const domain=domainByLower[roleName.toLowerCase()]||roleName; domainByLower[roleName.toLowerCase()]=domain;
    caps.forEach(({col,name})=>{
      const people=peopleRow?splitPeople(peopleRow[col]):[];
      seen[domain.toLowerCase()+'||'+name.toLowerCase()]={domain, name, people};
    });
    i += peopleRow?2:1;
  }
  const keys=Object.keys(seen);
  if(!keys.length){ toast('No skills found to import'); return; }
  // The uploaded matrix is AUTHORITATIVE: match existing skills and overwrite their people; DELETE any
  // skill no longer in the upload (a skill/role you removed in the Excel disappears — even a built-in
  // seed skill, which is tombstoned so it stays gone after reload); add skills that are new.
  let updated=0, added=0, removed=0;
  const seedByKey={}; SEED_BRICKS.forEach(b=>{ seedByKey[capKeyOf(b)]=b; });
  const kept=[];
  BRICKS.forEach(b=>{
    const key=capKeyOf(b);
    if(seen[key]){ b.people=seen[key].people; seen[key]._matched=true; updated++; kept.push(b); }
    else { removed++; }   // absent from the upload → drop from the live catalogue
  });
  BRICKS = kept;
  // add skills present in the upload but not already in the catalogue (restore a seed template if one matches)
  keys.forEach(k=>{ const s=seen[k]; if(s._matched) return;
    const seed=seedByKey[k];
    if(seed){ BRICKS.push(Object.assign(clone(seed),{people:s.people})); }
    else { BRICKS.push({id:'cap-'+capSlug(s.domain)+'-'+capSlug(s.name), domain:s.domain, name:s.name, maturity:2, capacity:0, unit:'FTE', importance:'Medium', owner:'—', reco:'—', desc:'', people:s.people}); }
    added++;
  });
  // tombstones: built-in seed skills absent from the upload are remembered as deleted (so the export/matrix
  // no longer re-injects them); any seed present again in the upload is un-deleted.
  if(!Array.isArray(state.deletedBricks)) state.deletedBricks=[];
  const stillDeleted=state.deletedBricks.filter(k=>!seen[k]);   // keep prior tombstones not contradicted by this upload
  Object.keys(seedByKey).forEach(k=>{ if(!seen[k] && stillDeleted.indexOf(k)<0) stillDeleted.push(k); });
  state.deletedBricks = stillDeleted;
  persist(); render();
  toast(updated+' updated · '+added+' added · '+removed+' removed · '+roles+' roles');
}
function _readZipEntries(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder();
  let eocd=-1; for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('not a valid .xlsx (no zip directory)');
  const count=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true); const entries={};
  for(let n=0;n<count;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), commentLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=td.decode(u8.subarray(off+46,off+46+nameLen));
    entries[name]={method,compSize,localOff}; off+=46+nameLen+extraLen+commentLen;
  }
  return {dv,u8,entries};
}
async function _readEntryData(z,name){
  const e=z.entries[name]; if(!e) return null; const dv=z.dv, u8=z.u8, lo=e.localOff;
  if(dv.getUint32(lo,true)!==0x04034b50) throw new Error('corrupt .xlsx (bad local header)');
  const nameLen=dv.getUint16(lo+26,true), extraLen=dv.getUint16(lo+28,true), dataStart=lo+30+nameLen+extraLen;
  const comp=u8.subarray(dataStart,dataStart+e.compSize);
  if(e.method===0) return comp.slice();
  if(e.method===8){
    if(typeof DecompressionStream==='undefined') throw new Error('this browser can’t unzip .xlsx (no DecompressionStream) — please update it, or paste the cells into the box below');
    const ds=new DecompressionStream('deflate-raw');
    const ab=await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(ab);
  }
  throw new Error('unsupported compression in .xlsx');
}
const _xlsxEls=(node,name)=>[...node.getElementsByTagNameNS('*',name)];
/* shared strings table (empty when the workbook has none — all our writers use inline strings) */
async function _readShared(z){
  if(!z.entries['xl/sharedStrings.xml']) return [];
  const doc=new DOMParser().parseFromString(new TextDecoder().decode(await _readEntryData(z,'xl/sharedStrings.xml')),'application/xml');
  return _xlsxEls(doc,'si').map(si=>_xlsxEls(si,'t').map(t=>t.textContent).join(''));
}
/* turn one parsed worksheet document into a raw 2-D grid (array of rows, each an array of cell strings) */
function _gridFromSheetDoc(doc, shared){
  const colIdx=ref=>{ const m=/^([A-Z]+)/.exec(ref||''); if(!m) return 0; let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64); return n-1; };
  const grid=[];
  _xlsxEls(doc,'row').forEach(row=>{ const arr=[];
    _xlsxEls(row,'c').forEach(c=>{ const idx=colIdx(c.getAttribute('r')); const t=c.getAttribute('t'); let val='';
      if(t==='inlineStr'){ val=_xlsxEls(c,'t').map(x=>x.textContent).join(''); }
      else if(t==='s'){ const v=_xlsxEls(c,'v')[0]; val=v?(shared[+v.textContent]||''):''; }
      else if(t==='str'){ const v=_xlsxEls(c,'v')[0]; val=v?v.textContent:''; }
      else { const v=_xlsxEls(c,'v')[0]; val=v?v.textContent:''; }
      arr[idx]=val; });
    grid.push(arr); });
  return grid;
}
/* Read the FIRST worksheet of an .xlsx into a raw 2-D grid. */
async function xlsxToGrid(buf){
  const z=_readZipEntries(buf), dec=new TextDecoder();
  const shared=await _readShared(z);
  const sheetName=Object.keys(z.entries).filter(n=>/^xl\/worksheets\/.*\.xml$/.test(n)).sort()[0];
  if(!sheetName) throw new Error('no worksheet found in .xlsx');
  const doc=new DOMParser().parseFromString(dec.decode(await _readEntryData(z,sheetName)),'application/xml');
  return _gridFromSheetDoc(doc, shared);
}
/* Read EVERY worksheet, in workbook order, as [{name, grid}] — used by the combined-tab importer. */
async function xlsxAllSheets(buf){
  const z=_readZipEntries(buf), dec=new TextDecoder();
  const shared=await _readShared(z);
  const relMap={};
  if(z.entries['xl/_rels/workbook.xml.rels']){
    const rdoc=new DOMParser().parseFromString(dec.decode(await _readEntryData(z,'xl/_rels/workbook.xml.rels')),'application/xml');
    _xlsxEls(rdoc,'Relationship').forEach(r=>{ relMap[r.getAttribute('Id')]=r.getAttribute('Target'); });
  }
  const out=[];
  if(z.entries['xl/workbook.xml']){
    const wdoc=new DOMParser().parseFromString(dec.decode(await _readEntryData(z,'xl/workbook.xml')),'application/xml');
    for(const sh of _xlsxEls(wdoc,'sheet')){
      const name=sh.getAttribute('name')||'';
      const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||'';
      let target=relMap[rid]; if(!target) continue;
      target=target.replace(/^\//,''); if(!/^xl\//.test(target)) target='xl/'+target;
      if(!z.entries[target]) continue;
      const doc=new DOMParser().parseFromString(dec.decode(await _readEntryData(z,target)),'application/xml');
      out.push({name, grid:_gridFromSheetDoc(doc, shared)});
    }
  }
  if(!out.length){   // fallback: no readable workbook index — take the lone worksheet
    const sheetName=Object.keys(z.entries).filter(n=>/^xl\/worksheets\/.*\.xml$/.test(n)).sort()[0];
    if(sheetName){ const doc=new DOMParser().parseFromString(dec.decode(await _readEntryData(z,sheetName)),'application/xml'); out.push({name:'Sheet1', grid:_gridFromSheetDoc(doc,shared)}); }
  }
  return out;
}
/* raw 2-D grid → array of header-keyed row objects (blank rows dropped) */
function gridToRows(grid){
  if(!grid||!grid.length) return [];
  const headers=(grid[0]||[]).map(h=>(h==null?'':String(h).trim()));
  const out=[];
  for(let i=1;i<grid.length;i++){ const g=grid[i]||[]; const o={}; let any=false;
    headers.forEach((h,ci)=>{ if(!h) return; const cell=g[ci]; o[h]=(cell==null?'':String(cell)); if(o[h]!=='') any=true; });
    if(any) out.push(o); }
  return out;
}
async function parseXlsx(buf){ return gridToRows(await xlsxToGrid(buf)); }
/* full generic capability catalogue with the live people overlaid (matches the 'current' download):

function capKeyOf(b){ return String(b&&b.domain||'').toLowerCase()+'||'+String(b&&b.name||'').toLowerCase(); }
function _capFullList(){
  const seedIds=new Set(SEED_BRICKS.map(b=>b.id));
  const del=new Set(((typeof state!=='undefined'&&Array.isArray(state.deletedBricks))?state.deletedBricks:[]).map(String));
  const liveById={}; BRICKS.forEach(b=>{ liveById[b.id]=b; });
  return SEED_BRICKS.filter(b=>!del.has(capKeyOf(b)))            // drop skills the user deleted via Excel (even built-in seeds)

/* Freeze the currently ticked candidates & DtV projects into the two frozen stores. Accumulates
   (dedupe by id), removes frozen candidates from the live CANDIDATES pool, and clears the ticks so the
   next freeze only adds what's newly ticked. Frozen items no longer appear in the live tables or math;
   they surface only in the two rightmost Excel sheets (and unfreeze by deleting a row there + re-upload). */
function freezeSelected(){
  const selC=(state.manualScenario||[]).map(String);
  const selD=(state.manualDtv||[]).map(String);
  if(!selC.length && !selD.length){ toast('Tick at least one project candidate or DtV project first'); return; }
  // ---- candidates: snapshot-clone each ticked candidate into frozenCandidates (dedupe by id) ----
  const frC=state.frozenCandidates||(state.frozenCandidates=[]);
  const haveC=new Set(frC.map(c=>String(c.id)));
  let addedC=0;
  selC.forEach(id=>{ if(haveC.has(id)) return; const c=candidate(id); if(!c) return; frC.push(clone(c)); haveC.add(id); addedC++; });
  // remove frozen candidates from the live pool
  if(haveC.size){ CANDIDATES=CANDIDATES.filter(c=>!haveC.has(String(c.id))); }
  // ---- DtV: snapshot product + manual role need + duration into frozenDtv (dedupe by id) ----
  const frD=state.frozenDtv||(state.frozenDtv=[]);
  const haveD=new Set(frD.map(d=>String(d.id)));
  let addedD=0;
  selD.forEach(id=>{ if(haveD.has(id)) return; const p=product(id); if(!p) return;
    const man=(state.dtvManual&&state.dtvManual[id])||{};
    frD.push({id:p.id, product:clone(p), roleNeed:clone(man.roleNeed||{}), durationMonths:dtvManualDur(p)});
    haveD.add(id); addedD++; });
  // ---- clear ticks + pick order for everything now frozen ----
  state.manualScenario=(state.manualScenario||[]).filter(id=>!haveC.has(String(id)));
  state.manualDtv=(state.manualDtv||[]).filter(id=>!haveD.has(String(id)));
  state.pickOrder=(state.pickOrder||[]).filter(k=>{ const m=/^(proj|dtv):(.+)$/.exec(k); if(!m) return true; return m[1]==='proj'?!haveC.has(m[2]):!haveD.has(m[2]); });
  persist(); render();
  toast('Frozen — '+addedC+' candidate'+(addedC===1?'':'s')+' + '+addedD+' DtV project'+(addedD===1?'':'s')+' moved to the Selected sheets');
}

function uploadProjectWorkbook(){
  const inp=document.createElement('input'); inp.type='file';
  inp.accept='.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f)return;
    const nm=(f.name||'').toLowerCase();
    if(!/\.xlsx$/.test(nm) && f.type!=='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'){
      toast('Please upload the Excel (.xlsx) workbook you got from Output.'); return; }
    const rd=new FileReader();
    rd.onerror=()=>toast('Could not read the file');
    rd.onload=()=>{ xlsxAllSheets(rd.result).then(applyProjectWorkbook).catch(err=>toast('Excel import failed: '+err.message)); };
    rd.readAsArrayBuffer(f); };
  inp.click();
}
/* apply an uploaded multi-sheet workbook: match each sheet to a scope by name (case-insensitive);
   if NONE of the names match, fall back to workbook order. Each sheet routes to its normal importer. */
function applyProjectWorkbook(sheets){
  if(!sheets||!sheets.length){ toast('No sheets found in the workbook'); return; }
  const byName={}; sheets.forEach(s=>{ byName[String(s.name||'').trim().toLowerCase()]=s; });
  const anyNameMatch=PROJECT_IO_SHEETS.some(def=>byName[def.name.toLowerCase()]);
  let applied=0; const did={};
  PROJECT_IO_SHEETS.forEach((def,i)=>{
    const s = byName[def.name.toLowerCase()] || (anyNameMatch?null:sheets[i]);
    if(!s || !s.grid || !s.grid.length) return;
    try{
      if(def.scope==='capability') applyCapMatrix(s.grid);
      else applyImport(def.scope, gridToRows(s.grid));
      did[def.scope]=true; applied++;
    }catch(err){ /* skip a bad sheet, keep importing the rest */ }
  });
  // Roles live in TWO sheets (Resource use = the people's role types + Free capacity). Once both have been
  // applied authoritatively, reconcile the tombstone list: a built-in seed role is "deleted" only when it
  // is absent from BOTH sheets (present in either keeps it alive). Removing a role needs it gone from both.
  if(did.resource && did.freecap){
    const liveRoleIds=new Set([...PEOPLE.map(p=>String(p.roleId)), ...FREECAP.map(f=>String(f.id))]);
    const seedRoleIds=new Set([...SEED_ROLES.map(r=>String(r.id)), ...SEED_FREECAP.map(r=>String(r.id))]);
    state.deletedRoles=[...seedRoleIds].filter(id=>!liveRoleIds.has(id));
  }
  // ---- Frozen selection round-trip (the two rightmost sheets are AUTHORITATIVE) --------------------
  // The Selected sheets rebuild the frozen stores from exactly the rows present. Deleting a row from
  // "Selected Project Candidates" returns that candidate to the live pool (unfreeze); deleting a row
  // from "Selected DtV projects" simply lets that product reappear in the live DtV table.
  let frozeCandChanged=false, frozeDtvChanged=false;
  const selCandSheet = byName['selected project candidates'];
  if(selCandSheet && selCandSheet.grid && selCandSheet.grid.length){
    try{
      const rows=gridToRows(selCandSheet.grid);
      const spec=candTableSpec(); const byLabel={}; spec.forEach(s=>{ byLabel[s.label.trim().toLowerCase()]=s; });
      const ignore=new Set(['capability gaps','scenario']); const candKnown=new Set(candColsDyn());
      const setLegacy=(c,k,raw)=>{ const ref=SEED_CANDIDATES[0][k];
        if(Array.isArray(ref)){ c[k]=String(raw).split(/[;|]/).map(s=>s.trim()).filter(s=>s!==''); }
        else if(typeof ref==='number'){ const n=cleanNum(raw); c[k]=(raw===''||raw==null)?0:(isNaN(n)?ref:n); }
        else c[k]=raw; };
      const parsed=[];
      rows.forEach(r=>{
        let idv=null; for(const k in r){ if(String(k).trim().toLowerCase()==='id'){ idv=r[k]; break; } }
        if(idv==null||String(idv).trim()==='') return; idv=String(idv).trim();
        const prev=(state.frozenCandidates||[]).find(c=>String(c.id)===idv);
        const c = prev?clone(prev):(function(){ const b=clone(SEED_CANDIDATES[0]); b.cap={}; b.missing=[]; b.deps=[]; b.locked=false; b.roleNeed={}; b.id=idv; return b; })();
        Object.keys(r).forEach(k=>{
          if(k==null) return; const kl=String(k).trim().toLowerCase(); if(kl==='id') return; if(ignore.has(kl)) return;
          const raw=r[k]; if(raw===undefined) return; const sp=byLabel[kl];
          if(sp){ if(sp.set) sp.set(c, raw===null?'':raw); return; }
          if(/^need_/i.test(k)){ const rid=k.slice(5).trim(); if(rid && String(raw).trim()!==''){ const nn=cleanNum(raw); if(!c.roleNeed)c.roleNeed={}; c.roleNeed[rid]=isNaN(nn)?0:nn; } return; }
          if(candKnown.has(k)){ setLegacy(c,k,raw); return; }
          c[k]=raw;
        });
        parsed.push(c);
      });
      const newIds=new Set(parsed.map(c=>String(c.id)));
      // unfreeze: candidates dropped from the sheet return to the live pool
      (state.frozenCandidates||[]).forEach(fc=>{ if(!newIds.has(String(fc.id)) && !candidate(fc.id)) CANDIDATES.push(clone(fc)); });
      CANDIDATES=CANDIDATES.filter(c=>!newIds.has(String(c.id)));   // frozen ids never live in the pool
      state.frozenCandidates=parsed; frozeCandChanged=true;
    }catch(err){ /* keep going */ }
  }
  const selDtvSheet = byName['selected dtv projects'];
  if(selDtvSheet && selDtvSheet.grid && selDtvSheet.grid.length){
    try{
      const rows=gridToRows(selDtvSheet.grid);
      const roleF=roleFields(); const roleByLabel={}; roleF.forEach(f=>{ roleByLabel[f.label.trim().toLowerCase()]=f.id; });
      const idLabel=prodColDesc('id').label.trim().toLowerCase(); const durLabel='duration (months)';
      const parsed=[];
      rows.forEach(r=>{
        let idv=null; for(const k in r){ if(String(k).trim().toLowerCase()===idLabel){ idv=r[k]; break; } }
        if(idv==null||String(idv).trim()==='') return; idv=String(idv).trim();
        const roleNeed={}; let dur=null;
        Object.keys(r).forEach(k=>{ const kl=String(k).trim().toLowerCase();
          if(roleByLabel[kl]!=null){ const n=cleanNum(r[k]); if(!isNaN(n)&&n) roleNeed[roleByLabel[kl]]=n; return; }
          if(kl===durLabel){ const n=cleanNum(r[k]); if(!isNaN(n)) dur=n; } });
        const prev=(state.frozenDtv||[]).find(d=>String(d.id)===idv);
        const p=product(idv)||(prev&&prev.product)||{id:idv};
        parsed.push({id:idv, product:clone(p), roleNeed, durationMonths:(dur!=null?dur:(prev&&prev.durationMonths!=null?prev.durationMonths:1))});
      });
      state.frozenDtv=parsed; frozeDtvChanged=true;
    }catch(err){ /* keep going */ }
  }
  persist(); render();
  const extra=(frozeCandChanged?' · '+state.frozenCandidates.length+' frozen candidates':'')+(frozeDtvChanged?' · '+state.frozenDtv.length+' frozen DtV':'');
  toast(applied+' of '+PROJECT_IO_SHEETS.length+' data sheets imported'+extra);
}
/* mode = 'current' (live edited data, default) or 'sample' (built-in fictive seed data) */
function downloadTemplate(scope,fmt,mode){
  mode = (mode==='sample')?'sample':'current';
  fmt = fmt||'xlsx';
  if(scope==='capability'){                       // wide role × skill matrix (people row beneath each role)
    // Always export the FULL generic catalogue (every role × every capability): 'sample' = the blank
    // seed catalogue, 'current' = the catalogue with the live people overlaid (see _capFullList).
    const grid=buildCapMatrix(mode==='sample'?SEED_BRICKS:_capFullList());
    const base='rd-capability-'+mode;
    if(fmt==='json') downloadBlob(JSON.stringify(grid,null,2), base+'.json','application/json');
    else if(fmt==='csv') downloadBlob(grid.map(r=>r.map(c=>{ c=(c==null?'':String(c)); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\n'), base+'.csv','text/csv');
    else downloadBlob(buildXlsxGrid(grid,'capability'), base+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    toast('capability · '+mode+' catalogue ('+fmt.toUpperCase()+') downloaded'); return;
  }
  let cols, rows, base;
  if(scope==='spend'){ cols=['category','item','value']; rows = mode==='sample'?SEED_SPEND_ROWS.slice():spendWhereRows(); base=`rd-spend-${mode}`; }
  else { cols=colsFor(scope); rows = mode==='sample'?seedRows(scope):sampleRows(scope); base=`rd-${scope}-${mode}`; }
  if(fmt==='json') downloadBlob(JSON.stringify(rows,null,2), base+'.json', 'application/json');
  else if(fmt==='csv') downloadBlob(toCSV(rows,cols), base+'.csv', 'text/csv');
  else downloadBlob(buildXlsx(rows,cols,scope), base+'.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast(`${scope} · ${mode} data (${fmt.toUpperCase()}) downloaded`);
}
function splitCSVLine(line, delim){ const d=delim||','; const out=[]; let cur='',q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true; else if(ch===d){out.push(cur);cur='';} else cur+=ch; } }
  out.push(cur); return out; }
function parseImport(text){
  text=(text||'').replace(/^﻿/,'').trim(); if(!text) return [];
  if(text[0]==='['||text[0]==='{'){ const j=JSON.parse(text); return Array.isArray(j)?j:[j]; }
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  // Excel copy-paste uses tabs; CSV uses commas. Detect from the header line.
  const delim = lines[0].indexOf('\t')>=0 ? '\t' : ',';
  const headers=splitCSVLine(lines[0], delim).map(h=>h.trim());
  return lines.slice(1).map(l=>{ const cells=splitCSVLine(l, delim); const o={}; headers.forEach((h,i)=>{ o[h]=cells[i]!==undefined?cells[i].trim():''; }); return o; });
}
function cleanNum(v){ if(v===''||v==null) return NaN;
  let s=String(v).trim().replace(/[€$£%\s]/g,'').replace(/,/g,''); // strip currency, %, spaces, thousands separators
  if(s==='') return NaN;
  // shorthand magnitudes: 360k -> 360 000, 2.4M -> 2 400 000, 1.2bn/1.2b -> 1 200 000 000
  const m=/^(-?\d*\.?\d+)(k|m|bn|b)$/i.exec(s);
  if(m){ const mult={k:1e3,m:1e6,b:1e9,bn:1e9}[m[2].toLowerCase()]; return (+m[1])*mult; }
  return +s; }
function coerceRow(row,sample){ const o={};
  for(const k in row){ let v=row[k]; if(v===undefined) continue; const ref=sample?sample[k]:undefined;
    if(typeof ref==='number'){ const n=cleanNum(v); o[k]=(v===''||v==null)?0:(isNaN(n)?ref:n); }
    else if(Array.isArray(ref)){ const parts=String(v).split(/[;|]/).map(s=>s.trim()).filter(s=>s!==''); o[k]=(ref.length&&typeof ref[0]==='number')? parts.map(x=>{const n=cleanNum(x);return isNaN(n)?0:n;}) : parts; }
    else o[k]=v; }
  return o; }
function applyImport(scope,rows){
  if(!Array.isArray(rows)||!rows.length){ toast('No rows found to import'); return; }
  let added=0,updated=0,removed=0;
  if(scope==='product'){
    // ---- Faithful importer (products + optional per-country child rows) --------------------
    // The uploaded header row defines the COLUMN ORDER: a new column added between two known
    // columns shows up in exactly that position. Header names map to fields by LABEL or key
    // (case-insensitive); any other header is a custom column stored & re-exported verbatim.
    // A leading "Country" column turns a row into a per-country breakdown line for the product
    // with the same id (blank Country = the product row). NO calculations — values are verbatim.
    const headers=Object.keys(rows[0]||{});
    const resolveKey=h=>{ const hl=String(h).trim().toLowerCase();
      // a header we previously learned is a renamed native column maps back to its schema key
      if(state.productColLabels){ for(const rk in state.productColLabels){ if(String(state.productColLabels[rk]).trim().toLowerCase()===hl) return rk; } }
      let d=PRODUCT_SCHEMA.find(c=>c.label.toLowerCase()===hl); if(d) return d.key;
      d=PRODUCT_SCHEMA.find(c=>c.key.toLowerCase()===hl); if(d) return d.key;
      return String(h).trim(); };
    const isCountryHdr=h=>String(h).trim().toLowerCase()===PRODUCT_COUNTRY_COL.toLowerCase();
    const countryHeader=headers.find(isCountryHdr)||null;
    // Position-based rename recovery: when the uploaded file has the SAME number of (non-Country)
    // columns as the current table and a header no longer matches any native column BY NAME, but the
    // column that used to sit in that exact position was a native field, treat it as an in-place rename.
    // This keeps the KPIs, revenue graph and drill-down mapped to the right field (e.g. "Revenue"
    // renamed to "Turnover") — the user's header text is remembered and shown as the column label.
    const prevOrder=productColOrder();
    const fileCols=headers.filter(h=>!isCountryHdr(h));
    const nameResolved=fileCols.map(h=>(/^sales_m\d+$/i.test(h))?'salesMonthly':resolveKey(h));
    const claimedByName=new Set(nameResolved.filter(k=>PROD_KEY_SET.has(k)));
    const canRecover=(prevOrder.length===fileCols.length);
    const order=[]; const seen=new Set(); const keyToHeader={}; let monthMode=null; let idHeader=null;
    fileCols.forEach((h,pi)=>{
      if(/^sales_m\d+$/i.test(h)){ if(!seen.has('salesMonthly')){ order.push('salesMonthly'); seen.add('salesMonthly'); if(!monthMode) monthMode='cols'; } return; }
      let k=resolveKey(h);
      if(!PROD_KEY_SET.has(k) && canRecover){          // unmatched header — try to recover its meaning by position
        const prevK=prevOrder[pi];
        if(prevK && PROD_KEY_SET.has(prevK) && !claimedByName.has(prevK) && !seen.has(prevK)){ k=prevK; claimedByName.add(prevK); }
      }
      if(!k) return;
      if(k==='id'&&idHeader==null) idHeader=h;
      if(!seen.has(k)){ order.push(k); seen.add(k); keyToHeader[k]=h; if(k==='salesMonthly') monthMode='series'; }
    });
    const orderChanged=order.length>0;
    if(orderChanged){
      state.productColOrder=order;
      // Remember any native column whose header text differs from its default label/key (a rename),
      // and drop overrides for columns now back to their default name or no longer present.
      const labels={};
      order.forEach(k=>{ if(!PROD_KEY_SET.has(k)) return; const h=keyToHeader[k]; if(h==null) return;
        const ht=String(h).trim(), def=(PROD_SCHEMA_BY_KEY[k].label||'');
        if(ht!=='' && ht.toLowerCase()!==def.toLowerCase() && ht.toLowerCase()!==String(k).toLowerCase()) labels[k]=ht; });
      state.productColLabels=labels;
    }
    const COST0={bom:0,conversion:0,overhead:0,transport:0,importCost:0,marketing:0,rAndD:0};
    const parseSeries=v=>String(v==null?'':v).split(/[;,|]/).map(x=>{const n=cleanNum(x);return isNaN(n)?0:n;}).slice(0,12);
    const coerceVal=(k,raw)=>{ const d=prodColDesc(k);
      if(d.type==='list'||k==='ecosystemIds'){ return String(raw==null?'':raw).split(/[;|,]/).map(s=>s.trim()).filter(Boolean); }
      if(raw==null||String(raw).trim()===''){ return ''; }
      if(PROD_NUMERIC_TYPES.has(d.type)||d.custom){ const n=cleanNum(raw); return isNaN(n)?String(raw):n; }
      return String(raw); };
    // id read is robust to ID / Id / id header casing
    const rowId=r=>{ let v=idHeader!=null?r[idHeader]:undefined; if(v==null) v=(r.id!=null?r.id:(r.ID!=null?r.ID:r.Id)); return v==null?'':String(v).trim(); };
    const seriesFromRow=r=>{
      if(monthMode==='cols'){ const a=[]; for(let i=1;i<=12;i++){ const n=cleanNum(r['sales_m'+i]); a.push(isNaN(n)?0:n);} return a; }
      const h=keyToHeader['salesMonthly']; const cell=h!=null?r[h]:'';
      if(cell!=null&&String(cell).trim()!=='') return parseSeries(cell);
      // content-based fallback: any cell holding a ";"-separated numeric series (the series column may have been renamed)
      for(const hh in r){ if(hh===countryHeader||hh===idHeader) continue; const arr=prodSeriesArray(String(r[hh]==null?'':r[hh])); if(arr) return arr; }
      return null;
    };
    const countryRowsById={}; const processedIds=new Set();
    rows.forEach(r=>{
      const idv=rowId(r); if(!idv) return;
      const cname=countryHeader!=null?String(r[countryHeader]==null?'':r[countryHeader]).trim():'';
      if(cname){                                          // ---- per-country breakdown line ----
        const c={country:cname};
        COUNTRY_FIELD_KEYS.forEach(k=>{
          if(k==='salesMonthly'){ const arr=seriesFromRow(r); if(arr&&arr.some(x=>x)) c.salesMonthly=arr; return; }
          const h=keyToHeader[k]; if(h===undefined) return; const raw=r[h];
          if(raw==null||String(raw).trim()==='') return; const n=cleanNum(raw); c[k]=isNaN(n)?String(raw):n;
        });
        (countryRowsById[idv]||(countryRowsById[idv]=[])).push(c);
        return;
      }
      // ---- product row ----
      const ex=product(idv);
      const target = ex || clone(SEED_PRODUCTS[0]);
      // A brand-new product must NOT inherit the seed's values. Otherwise any column omitted from the
      // upload (EBIT, the monthly series, etc.) would silently show Auto A1's number and never update.
      // Start every schema data field blank; the row below fills only the columns the file actually has.
      if(!ex){ target.id=idv; target.cost=Object.assign({}, COST0); delete target.countries; target.salesMonthly=[]; target.name='';
        PRODUCT_SCHEMA.forEach(c=>{ if(c.key==='id'||c.key==='name'||c.cost||c.key==='salesMonthly') return;
          if(c.type==='list'||c.key==='ecosystemIds') target[c.key]=[];
          else if(c.type==='check') target[c.key]=false;
          else target[c.key]=''; }); }
      order.forEach(k=>{
        if(k==='salesMonthly'){ const arr=seriesFromRow(r); if(arr&&arr.length) target.salesMonthly=arr; return; }
        if(k==='id') return;
        const h=keyToHeader[k]; if(h===undefined) return; const raw=r[h];
        const d=prodColDesc(k);
        if(d.cost){ if(raw!==undefined){ const s=String(raw).trim(); target.cost=target.cost||Object.assign({},COST0); if(s===''){ target.cost[k]=0; } else { const n=cleanNum(raw); if(!isNaN(n)) target.cost[k]=Math.max(0,n); } } return; }
        target[k]=coerceVal(k,raw);
      });
      if(!ex){ PRODUCTS.push(target); added++; } else updated++;
      processedIds.add(idv);
    });
    // attach per-country breakdowns. With a Country column present, the Excel is the source of truth:
    // a product with no child rows ends up with none (drill-down hidden). No Country column = untouched.
    let countryCount=0;
    if(countryHeader!=null){
      const ids=new Set([...processedIds, ...Object.keys(countryRowsById)]);
      ids.forEach(idv=>{ const p=product(idv); if(p){ p.countries=countryRowsById[idv]||[]; countryCount+=p.countries.length; } });
    }
    // keep the legacy custom-columns list (persisted) in sync — it now derives from the column order
    state.productExtraCols=extraProductCols();
    // Always reflect column-order / data / country changes — even if no product row matched an id.
    if(updated+added+countryCount>0 || orderChanged){
      persist(); render();
      toast(`${updated} updated · ${added} added${countryCount?` · ${countryCount} country rows`:''}`);
      return;
    }
  } else if(scope==='capability'){
    rows.forEach(r=>{ if(!r.id)return; const ex=brick(r.id); const c=coerceRow(r, ex||SEED_BRICKS[0]);
      if(ex){ Object.assign(ex,c); updated++; } else { BRICKS.push(Object.assign(clone(SEED_BRICKS[0]),c)); added++; } });
  } else if(scope==='resource'){
    // Per-person weekly "hours booked" format: Person | Role | Hrs booked W1 | W2 | …  (one row per
    // person). A fully-booked person = 40 h/week = 100% = 1.0 FTE; people are grouped by role for the
    // Resource-use table. Excel is authoritative — PEOPLE is rebuilt to exactly the rows uploaded.
    // Columns are detected by header name (case-insensitive) with a positional fallback.
    const headers=Object.keys(rows[0]||{}).filter(h=>String(h).trim()!=='');
    const norm=h=>String(h).trim().toLowerCase();
    let personCol=headers.find(h=>/^(person|name|people|resource|who)$/.test(norm(h))) || headers.find(h=>/person|name/.test(norm(h)));
    let roleCol=headers.find(h=>/^(role|role type|roletype|discipline|function)$/.test(norm(h))) || headers.find(h=>/role|discipline|function/.test(norm(h)));
    if(!personCol) personCol=headers[0];
    if(!roleCol) roleCol=headers.find(h=>h!==personCol) || headers[1];
    // week columns = anything mentioning hours/booked/week or a bare "W<n>", in header order (minus person/role)
    let weekCols=headers.filter(h=>h!==personCol && h!==roleCol && /(hrs|hour|booked|week|^w\s*\d)/i.test(norm(h)));
    if(!weekCols.length) weekCols=headers.filter(h=>h!==personCol && h!==roleCol);
    const labels=weekCols.map(h=>String(h).trim());
    const nextPeople=[];
    rows.forEach(r=>{
      const pn=personCol!=null?String(r[personCol]==null?'':r[personCol]).trim():'';
      const rn=roleCol!=null?String(r[roleCol]==null?'':r[roleCol]).trim():'';
      const hasHrs=weekCols.some(h=>String(r[h]==null?'':r[h]).trim()!=='');
      if(!pn && !rn && !hasHrs) return;                       // wholly blank row
      const roleName = rn || 'Unassigned';
      const hours=weekCols.map(h=>{ const n=cleanNum(r[h]); return isNaN(n)?0:Math.max(0,Math.round(n*10)/10); });
      nextPeople.push({name:(pn||'N.N.'), role:roleName, roleId:resolveRoleId(roleName), hours});
    });
    if(nextPeople.length){
      removed += Math.max(0, PEOPLE.length);                  // authoritative replace: old rows are gone
      PEOPLE = nextPeople; added += nextPeople.length;
      if(labels.length) WEEK_LABELS = labels;
    }
  } else if(scope==='freecap'){
    const next=[], seen=new Set();
    rows.forEach(r=>{ if(!r.id)return; const ex=byId(FREECAP,r.id);
      const week=[]; for(let i=0;i<FREECAP_WEEKS;i++){ const n=cleanNum(r['w'+(i+1)]); week.push(isNaN(n)?0:Math.max(0,Math.round(n))); }
      const name=(r.name!=null&&String(r.name).trim()!=='')?String(r.name).trim():(ex?ex.name:r.id);
      if(ex){ ex.name=name; ex.week=week; next.push(ex); updated++; } else { next.push({id:r.id, name:name, week:week}); added++; } seen.add(String(r.id)); });
    if(next.length){ removed += FREECAP.filter(x=>!seen.has(String(x.id))).length; FREECAP = next; }
  } else if(scope==='spend'){
    const keys0=rows[0]?Object.keys(rows[0]).map(k=>k.toLowerCase()):[];
    if(keys0.indexOf('category')>=0 || keys0.indexOf('item')>=0){
      // long format covering all four "where the spend goes" blocks
      const norm=rows.map(r=>({category:r.category||r.Category||r.CATEGORY, item:r.item||r.Item||r.ITEM, value:r.value||r.Value||r.VALUE}));
      updated += applySpendWhere(norm);
    } else {
      const c=coerceRow(rows[0], state.spendComp); Object.assign(state.spendComp, c); updated++;
    }
  } else {
    if(!Array.isArray(state.candidateExtraCols)) state.candidateExtraCols=[];
    // Preferred format = the table's own header LABELS (matches the Output download 1:1). We also still
    // accept legacy raw keys (id, name, npv, spend, ecosystemIds, bricks, concept…, need_<roleId>) and any
    // other header becomes a custom column. Tool-only columns ("Capability gaps", "Scenario") are ignored.
    const spec=candTableSpec();
    const byLabel={}; spec.forEach(s=>{ byLabel[s.label.trim().toLowerCase()]=s; });
    const ignore=new Set(['capability gaps','scenario']);
    const candKnown=new Set(candColsDyn());   // legacy raw keys still understood
    const setLegacy=(c,k,raw)=>{ const ref=SEED_CANDIDATES[0][k];
      if(Array.isArray(ref)){ c[k]=String(raw).split(/[;|]/).map(s=>s.trim()).filter(s=>s!==''); }
      else if(typeof ref==='number'){ const n=cleanNum(raw); c[k]=(raw===''||raw==null)?0:(isNaN(n)?ref:n); }
      else c[k]=raw; };
    // Excel is authoritative: rebuild CANDIDATES to exactly the rows present (a project removed from the
    // sheet is dropped) and rebuild the custom-column list to exactly the extra columns present (a column
    // removed from the sheet disappears). Guarded so an empty sheet never wipes every project.
    const next=[]; const uploadCols=[]; const usedExisting=new Set();
    rows.forEach(r=>{
      // id can arrive as "id" or the table's "ID" header
      let idv=null; for(const k in r){ if(String(k).trim().toLowerCase()==='id'){ idv=r[k]; break; } }
      if(idv==null||String(idv).trim()==='') return; idv=String(idv).trim();
      let ex=candidate(idv);
      // A second row with an id already consumed in THIS upload is a DISTINCT idea that happens to share
      // an id — keep it as its own new record (the tool flags both rows red so the user can fix the clash),
      // instead of aliasing the same object twice.
      if(ex && usedExisting.has(idv.toLowerCase())) ex=null;
      const c = ex || (function(){ const b=clone(SEED_CANDIDATES[0]); b.cap={}; b.missing=[]; b.deps=[]; b.locked=false; b.roleNeed={}; b.id=idv; return b; })();
      if(ex) usedExisting.add(idv.toLowerCase());
      Object.keys(r).forEach(k=>{
        if(k==null) return; const kl=String(k).trim().toLowerCase(); if(kl==='id') return; if(ignore.has(kl)) return;
        const raw=r[k]; if(raw===undefined) return;
        const sp=byLabel[kl];
        if(sp){ if(sp.set) sp.set(c, raw===null?'':raw); return; }   // table-label column (computed cols have no setter → ignored)
        if(/^need_/i.test(k)){ const rid=k.slice(5).trim(); if(rid && String(raw).trim()!==''){ const nn=cleanNum(raw); if(!c.roleNeed)c.roleNeed={}; c.roleNeed[rid]=isNaN(nn)?0:nn; } return; }
        if(candKnown.has(k)){ setLegacy(c,k,raw); return; }          // legacy raw key
        if(!uploadCols.includes(k)) uploadCols.push(k);              // custom column present in THIS upload
        c[k]=raw;
      });
      next.push(c);
      if(ex){ updated++; } else { added++; }
    });
    if(next.length){
      removed += CANDIDATES.filter(x=>next.indexOf(x)<0).length;
      CANDIDATES = next;
      const dropped = state.candidateExtraCols.filter(col=>uploadCols.indexOf(col)<0);
      dropped.forEach(col=>{ CANDIDATES.forEach(c=>{ if(col in c) delete c[col]; }); });   // purge removed custom-column values
      state.candidateExtraCols = uploadCols.slice();                                        // authoritative custom-column set
    }
  }
  if(updated+added===0){ toast('Nothing imported — check the file is an Excel .xlsx (or pasted CSV/JSON) with a header row that includes an "id" column.'); return; }
  toast(`${updated} updated · ${added} added${removed?` · ${removed} removed`:''}`); persist(); render();
}
function triggerUpload(scope){
  const inp=document.createElement('input'); inp.type='file';
  inp.accept='.xlsx,.csv,.tsv,.txt,.json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,application/json';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f)return;
    const nm=(f.name||'').toLowerCase();
    // Other office/binary bundles we can't read — steer the user to .xlsx, CSV export, or paste.
    if(/\.(numbers|xlsm|xlsb|xls|pages|key|ods)$/.test(nm)){
      toast('That is a '+nm.split('.').pop().toUpperCase()+' file. Save it as Excel (.xlsx), or copy the cells and paste them into the box below.'); return; }
    // Real Excel workbook → read the bytes and parse the .xlsx directly (offline).
    if(/\.xlsx$/.test(nm) || f.type==='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'){
      const rd=new FileReader();
      rd.onerror=()=>toast('Could not read the file');
      rd.onload=()=>{ if(scope==='capability'){ xlsxToGrid(rd.result).then(applyCapMatrix).catch(err=>toast('Excel import failed: '+err.message)); }
        else parseXlsx(rd.result).then(rows=>applyImport(scope,rows)).catch(err=>toast('Excel import failed: '+err.message)); };
      rd.readAsArrayBuffer(f); return; }
    // Otherwise treat it as text (CSV / TSV / JSON).
    const rd=new FileReader();
    rd.onload=()=>{
      const txt=rd.result;
      // A zip-based document (Excel/Numbers) saved with a text extension starts with the "PK" signature.
      if(typeof txt==='string' && txt.slice(0,2)==='PK'){
        toast('This looks like an Excel/Numbers document saved with the wrong extension. Save it as .xlsx and upload again, or paste the cells into the box below.'); return; }
      try{ if(scope==='capability') applyCapMatrix(capTextToGrid(txt)); else applyImport(scope, parseImport(txt)); }catch(err){ toast('Import failed: '+err.message); } };
    rd.readAsText(f); };
  inp.click();
}
function pasteData(scope){
  const ta=document.getElementById('paste-'+scope); if(!ta){ toast('Paste box not found'); return; }
  try{ if(scope==='capability'){ applyCapMatrix(capTextToGrid(ta.value)); } else { applyImport(scope, parseImport(ta.value)); } ta.value=''; }catch(err){ toast('Paste failed: '+err.message); }
}

/* ---------- small inline Input / Output buttons (used in each section that needs data) ---------- */

  return `<button class="btn ghost sm" data-action="io-input" data-scope="${scope}" title="Input — upload an Excel (.xlsx) file or paste Excel / CSV / JSON">${icon('upload','ic')} Input</button>`+
         `<button class="btn ghost sm" data-action="io-output" data-scope="${scope}" title="Output — download the current input table as Excel (.xlsx)">${icon('download','ic')} Output</button>`;
}

  importCost:'Cost breakdown — import duties / tariffs (€M)',
  rAndD:'Cost breakdown — R&D cost allocated to the SKU (€M)',
  marketing:'Cost breakdown — marketing (€M)',
  overhead:'Cost breakdown — overhead / O&H (€M)',
  scenario:'1 if included in the current DtV scenario, else 0',
  // ---- Product Portfolio fields (stored verbatim — the table performs NO calculations) ----
  sku:'SKU / article code',
  productGroup:'Product group the SKU belongs to',
  countriesSold:'Countries the product is sold in (free text)',
  ebit:'EBIT (€M) — stored value, taken straight from the file',

  ebitRev:'EBIT / Revenue % — stored value from the file (used only to colour the cell; not recomputed)',

  actionPrice:'Action flag — adjust price (1 = ticked, 0 = not)'
};
function colGuideDesc(scope,col){
  // Product export columns are LABELS (the table header text), not field keys — resolve label -> key.
  if(scope==='product'){
    if(col===PRODUCT_COUNTRY_COL) return 'Leave blank for the product row. Put a country name here to make the row a per-country breakdown line for the product with the same id — add rows to add countries.';
    const d=PRODUCT_SCHEMA.find(c=>c.label===col);
    if(!d) return 'Custom column — stored and re-exported verbatim (no calculation applied).';
    if(GUIDE_LABELS[d.key]!=null) return GUIDE_LABELS[d.key];
    return 'Stored value from the file (no calculation applied).';
  }
  if(GUIDE_LABELS[col]!=null) return GUIDE_LABELS[col];
  let m;
  if(scope==='resource' && /(hrs|hour|booked|week|^w\s*\d)/i.test(String(col).trim().toLowerCase())){ return 'Hours this person worked that week (0–'+HOURS_FULL_WEEK+'). '+HOURS_FULL_WEEK+' h = a full week = 100% = 1.0 FTE.'; }
  if(m=col.match(/^need_(.+)$/)){ const rid=m[1]; const rf=roleFields().find(f=>f.id===rid); return 'FTE needed from role “'+(rf?rf.label:rid)+'”'; }
  if(m=col.match(/^sales_m(\d+)$/)){ return 'Monthly sales — month '+m[1]+' of the trailing 12 (€M)'; }
  if(typeof CANVAS_KEYS!=='undefined' && CANVAS_KEYS.has(col)){ const f=CANVAS_FIELDS.find(x=>x.key===col); return 'Business canvas — '+(f?f.label:col); }
  return col.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase());
}
function columnGuide(scope){
  if(scope==='capability') return '';   // matrix format — explained in the panel note instead of a column table
  const cols=colsFor(scope);
  const keyCol = scope==='spend' ? '(single row — no id)' : 'id';
  const th='text-align:left;padding:6px 10px;background:rgba(0,140,153,0.06);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2)';
  const rows=cols.map(c=>`<tr><td style="padding:4px 10px;border-bottom:1px solid rgba(16,40,41,0.06);white-space:nowrap;vertical-align:top"><code style="font-size:11.5px;color:var(--accent)">${esc(c)}</code></td><td style="padding:4px 10px;border-bottom:1px solid rgba(16,40,41,0.06);font-size:12px;color:var(--body)">${esc(colGuideDesc(scope,c))}</td></tr>`).join('');
  return `<details style="margin-bottom:12px">
    <summary style="cursor:pointer;font-weight:600;font-size:12.5px;color:var(--accent);display:flex;align-items:center;gap:6px">${icon('info','ic')} Column guide — what each header means</summary>
    <div style="margin-top:8px;border:1px solid var(--cardBorder);border-radius:12px;overflow:hidden;background:var(--card)">
      <table style="width:100%;border-collapse:collapse"><thead><tr><th style="${th}">Column</th><th style="${th}">Meaning</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="hint" style="margin-top:8px">${scope==='resource'?'One row <b>per person</b>: <b>Person</b>, their <b>Role</b> type, then a column of <b>hours booked</b> for each week. A full week = <b>'+HOURS_FULL_WEEK+' h = 100% = 1.0 FTE</b>; people are grouped by role, so <b>FTE per role = headcount</b> and utilisation = booked hours ÷ (headcount × '+HOURS_FULL_WEEK+' h). The whole sheet is <b>replaced</b> by what you upload — add or remove rows to add or remove people.':'Multi-value fields (ecosystemIds, bricks) use <b>;</b> as the separator. Keep the <b>'+keyCol+'</b> column so an upload updates the right row in place; rows with a new id are added.'+(scope==='product'?' The <b>Country</b> column is blank on the product row; add extra rows with the same id and a country name to build the per-country drill-down (add as many countries as you like).':'')}</div>
  </details>`;
}

function exportBoardPack(){
  const appr=scenario(state.approvedScenario)||scenario(state.activeScenario); const S=scenarioSummary(appr);
  const totRev=PRODUCTS.reduce((a,p)=>a+p.sales,0), totEbit=PRODUCTS.reduce((a,p)=>a+p.ebit,0);
  const money=n=>cs()+Math.round(n).toLocaleString('en-US')+'M';
  const row=(a,b)=>`<tr><td style="padding:6px 12px;border-bottom:1px solid #e5eeed">${a}</td><td style="padding:6px 12px;border-bottom:1px solid #e5eeed;text-align:right;font-weight:700">${b}</td></tr>`;
  // R&D spend by type — projects grouped by bucket, groups ordered by total spend desc, projects within group by spend desc
  const byBucket={}; S.sel.forEach(c=>{ (byBucket[c.bucket]=byBucket[c.bucket]||[]).push(c); });
  const buckets=Object.keys(byBucket).sort((a,b)=>byBucket[b].reduce((s,c)=>s+c.spend,0)-byBucket[a].reduce((s,c)=>s+c.spend,0));
  let spendRows='';
  buckets.forEach(bk=>{
    const grp=byBucket[bk].slice().sort((a,b)=>b.spend-a.spend);
    const gTot=grp.reduce((s,c)=>s+c.spend,0);
    spendRows+=`<tr style="background:#f0f7f6"><td style="padding:7px 12px;font-weight:700">${esc(bk)}</td><td style="padding:7px 12px;text-align:right;font-weight:700">${money(gTot)}</td></tr>`;
    grp.forEach(c=>{ spendRows+=`<tr><td style="padding:4px 12px 4px 26px;border-bottom:1px solid #eef4f3">${esc(c.name)}</td><td style="padding:4px 12px;border-bottom:1px solid #eef4f3;text-align:right">${money(c.spend)}</td></tr>`; });
  });
  const free=S.discRemaining;
  const freeLabel=free>=0?'Free / unallocated discretionary':'Over-allocated (above discretionary pool)';
  spendRows+=`<tr style="border-top:2px solid #008C99"><td style="padding:7px 12px;font-weight:700">${freeLabel}</td><td style="padding:7px 12px;text-align:right;font-weight:700;color:${free<0?'#C4574F':'#12312f'}">${money(free)}</td></tr>`;
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>R&D Board Pack — ${esc(state.fy)} ${esc(state.quarter)}</title>
    <style>body{font-family:Georgia,serif;color:#12312f;max-width:900px;margin:32px auto;padding:0 24px;line-height:1.5}h1{font-size:26px}h2{font-size:17px;margin-top:28px;border-bottom:2px solid #008C99;padding-bottom:4px}table{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px;margin-top:8px}th{text-align:left;padding:6px 12px;background:#f0f7f6;font-size:11px;text-transform:uppercase;letter-spacing:.06em}</style></head>
    <body><h1>R&D Portfolio Board Pack</h1>
    <p><b>${esc(state.fy)} · ${esc(state.quarter)}</b> · Approved scenario: <b>${esc(appr.name)}</b> · Generated ${new Date().toISOString().slice(0,10)}</p>
    <h2>Portfolio at a glance</h2><table>
      ${row('Total product revenue',money(totRev))}${row('Total product EBIT',money(totEbit)+` (${(totEbit/totRev*100).toFixed(1)}%)`)}
      ${row('R&D envelope',money(S.env.total))}${row('Discretionary used',money(S.discretionarySpend)+' of '+money(S.env.discretionary))}
      ${row('Portfolio NPV',money(S.npv))}${row('Risk-adjusted value',money(S.riskAdj))}
      ${row('Peak capacity utilisation',S.maxUtil+'%')}${row('Overall feasibility',S.overallFeasible?'Feasible':'Not feasible')}
    </table>
    <h2>R&D spend by type (${S.sel.length} funded projects)</h2>
    <p style="font-size:12px;color:#6a8380;font-family:Arial,sans-serif;margin:6px 0 0">Projects grouped by type, groups ordered by total spend, projects ordered by spend within each group. The closing line shows free (unallocated) discretionary spend.</p>
    <table><tr><th>Project</th><th style="text-align:right">Spend</th></tr>${spendRows}</table>
    <p style="margin-top:28px;font-size:11px;color:#6a8380;font-family:Arial,sans-serif">Illustrative data — for demonstration only. Review before any client use.</p>
    </body></html>`;
  downloadBlob(html, `RD-board-pack-${state.fy}-${state.quarter}.html`, 'text/html');
  toast('Board pack exported');
}
