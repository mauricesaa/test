<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>R&D Portfolio Allocation Cockpit — v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#F4FAF6; --bg2:#E8F8F5; --bg3:#D2F3EF; --bg4:#AEECE5; --bg5:#8DDFD8; --bg6:#73D2CF;
  --ink:#102829; --body:#1B3336; --accent:#007E88; --accent2:#008C99; --muted2:#5D6D6F; --meta:#899799;
  --label:#405052;
  --card:rgba(255,255,255,0.90); --cardSolid:#FFFFFF;
  --cardBorder:rgba(255,255,255,0.68);
  --pill:rgba(255,255,255,0.72); --pillBorder:rgba(255,255,255,0.75);
  --btn:#73E6D3; --btn2:#7CEBD8;
  --track:#E5EEEE;
  --inputBorder:#D9E8E8; --focus:#6FDCCD;
  --green:#2FA98C; --greenBg:#DCF3EC;
  --yellow:#C98A2E; --yellowBg:#FBEED6;
  --red:#C4574F; --redBg:#F8E0DD;
  --shadow:0 24px 70px rgba(20,65,70,0.08);
  --pillShadow:0 10px 28px rgba(20,65,70,0.07);
  --btnShadow:0 14px 34px rgba(73,205,190,0.28);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter','Helvetica Neue',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans); color:var(--body);
  background:
    radial-gradient(1200px 800px at 8% -5%, #F6FCF8 0%, rgba(246,252,248,0) 55%),
    radial-gradient(1100px 900px at 95% 0%, #E3F7F3 0%, rgba(227,247,243,0) 50%),
    radial-gradient(1400px 1100px at 60% 30%, #D8F4F0 0%, rgba(216,244,240,0) 55%),
    radial-gradient(1300px 1200px at 20% 90%, #C6EFEA 0%, rgba(198,239,234,0) 55%),
    radial-gradient(1500px 1300px at 90% 95%, #AEE9E4 0%, rgba(174,233,228,0) 60%),
    linear-gradient(160deg, #F4FAF6 0%, #E8F8F5 30%, #D9F4EF 60%, #C8EEEA 100%);
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.5;
}
h1,h2,h3,h4{margin:0;color:var(--ink);}
button{font-family:var(--sans);cursor:pointer;}
a{color:var(--accent);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(115,210,207,0.4);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Scroll UX: progress bar · section nav · reveal-on-scroll ---------- */
#scrollProgress{position:fixed;top:0;left:0;height:3px;width:0;z-index:45;pointer-events:none;
  background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 1px 6px rgba(0,126,136,0.35);}
#sectionNav{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:45;
  display:flex;flex-direction:column;gap:9px;padding:11px 9px;max-height:82vh;overflow:auto;
  background:rgba(255,255,255,0.55);border:1px solid var(--cardBorder);border-radius:16px;
  backdrop-filter:blur(6px);box-shadow:var(--pillShadow);}
#sectionNav::-webkit-scrollbar{width:0;height:0;}
#sectionNav a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted2);
  font-size:11px;font-weight:600;white-space:nowrap;line-height:1;}
#sectionNav a .dot{width:9px;height:9px;border-radius:50%;background:var(--track);
  border:1px solid rgba(0,126,136,0.35);flex:0 0 auto;transition:background .2s ease,transform .2s ease;}
#sectionNav a .lbl{max-width:0;overflow:hidden;opacity:0;transition:max-width .25s ease,opacity .25s ease;}
#sectionNav:hover a .lbl{max-width:180px;opacity:1;}
#sectionNav a:hover{color:var(--accent2);}
#sectionNav a:hover .dot{background:var(--accent2);}
#sectionNav a.active{color:var(--accent);}
#sectionNav a.active .dot{background:var(--accent);transform:scale(1.35);box-shadow:0 0 0 3px rgba(0,126,136,0.15);}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease;}
.reveal.in{opacity:1;transform:none;}
@media (max-width:1250px){ #sectionNav{display:none!important;} }
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1!important;transform:none!important;transition:none!important;}
}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--cardBorder);border-radius:32px;box-shadow:var(--shadow);padding:26px 28px;backdrop-filter:blur(6px);}
.card.tight{padding:20px 22px;border-radius:26px;}
.card h3.card-title{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-0.01em;}
.card .card-sub{font-size:12.5px;color:var(--muted2);margin-top:5px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.grid{display:grid;gap:18px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g5{grid-template-columns:repeat(5,1fr);}
.mb{margin-bottom:18px;}
.mt{margin-top:18px;}
@media(max-width:1200px){.g4,.g5{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:820px){.g2,.g3,.g4,.g5{grid-template-columns:1fr;}}

/* ---------- KPI ---------- */
.kpi{background:var(--card);border:1px solid var(--cardBorder);border-radius:26px;padding:20px 22px;box-shadow:var(--shadow);}
.kpi .k-label{font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--label);}
.kpi .k-value{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink);margin-top:8px;letter-spacing:-0.01em;line-height:1;}
.kpi .k-sub{font-size:12px;color:var(--muted2);margin-top:9px;}
.kpi .k-value.sm{font-size:24px;}

/* ---------- Pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--pill);border:1px solid var(--pillBorder);border-radius:20px;padding:8px 13px;box-shadow:var(--pillShadow);backdrop-filter:blur(4px);}
.pill .p-main{font-size:13px;font-weight:700;color:var(--ink);}
.pill .p-sec{font-size:9.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--meta);}
.pill.col{flex-direction:column;align-items:flex-start;gap:2px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:0.02em;padding:3px 10px;border-radius:12px;white-space:nowrap;}
.badge.green{background:var(--greenBg);color:var(--green);}
.badge.yellow{background:var(--yellowBg);color:var(--yellow);}
.badge.red{background:var(--redBg);color:var(--red);}
.badge.neutral{background:rgba(0,126,136,0.10);color:var(--accent);}
.badge.soft{background:rgba(16,40,41,0.06);color:var(--body);}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.dot.green{background:var(--green);}.dot.yellow{background:var(--yellow);}.dot.red{background:var(--red);}

/* ---------- Tables ---------- */
.tablewrap{overflow-x:auto;border-radius:20px;}
/* Freeze-pane header: the table scrolls sideways in its own box (overflow-x) but the page keeps a
   single vertical scrollbar. A JS-managed clone of the header row (.frozen-hdr) is pinned to the top
   of the window while the table is in view, and kept aligned with the columns / horizontal scroll. */
.tablewrap.sticky-head{overflow-x:auto;overflow-y:visible;}
.frozen-hdr{position:fixed;overflow:hidden;z-index:40;pointer-events:none;box-shadow:0 4px 10px rgba(16,40,41,0.10);}
.frozen-hdr table{border-collapse:collapse;}
.frozen-hdr th{background:var(--cardSolid);box-shadow:inset 0 -1.5px 0 rgba(16,40,41,0.12);}
table{border-collapse:collapse;width:100%;font-size:13px;}
th{font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--label);text-align:left;padding:11px 12px;border-bottom:1.5px solid rgba(16,40,41,0.08);white-space:nowrap;cursor:default;}
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--accent);}
td{padding:11px 12px;border-bottom:1px solid rgba(16,40,41,0.055);vertical-align:middle;color:var(--body);}
tr.clickable{cursor:pointer;transition:background .12s;}
tr.clickable:hover{background:rgba(255,255,255,0.6);}
tr.clickable.expanded{background:rgba(0,126,136,0.06);}
.caret{display:inline-block;width:11px;color:#008C99;font-size:10px;}
tr.product-detail>td{background:rgba(0,140,153,0.04);border-bottom:1.5px solid rgba(0,126,136,0.14);}
tr.product-detail table{margin-top:2px;}
tr.product-detail td{padding:6px 10px;}
tr.superhead th{background:transparent;border:none;border-bottom:none;padding:0 3px 3px;}
tr.superhead th.costbar{text-align:center;background:linear-gradient(180deg,#008C99,#00707A);color:#fff;font-weight:800;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border-radius:6px 6px 0 0;padding:5px 8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,0.12);}
td.costcol,th.costcol{background:rgba(0,140,153,0.05);}
th.costcol{border-top:2px solid rgba(0,140,153,0.35);}
td.costcol .t-sub{font-size:10px;}
tr.superhead th.actbar{text-align:center;background:linear-gradient(180deg,#0E5A63,#0B3B45);color:#fff;font-weight:800;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border-radius:6px 6px 0 0;padding:5px 8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,0.12);}
td.actcol,th.actcol{text-align:center;background:rgba(14,90,99,0.06);white-space:nowrap;}
th.actcol{border-top:2px solid rgba(14,90,99,0.35);font-size:10px;}
td.actcol input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#0E5A63;margin:0;}
.note-area{width:100%;min-height:64px;resize:vertical;font-family:inherit;font-size:13px;line-height:1.5;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
table.lhead th.num{text-align:left;}   /* candidate tables: keep every column header left-aligned (numbers in the cells stay right-aligned) */
.t-strong{font-weight:700;color:var(--ink);}
.t-name{font-weight:600;color:var(--ink);}
.t-sub{font-size:11px;color:var(--meta);}

/* ---------- Inputs ---------- */
input[type=text],input[type=number],select,textarea{
  width:100%;background:#fff;border:1px solid var(--inputBorder);border-radius:15px;
  padding:11px 14px;font-size:14px;font-family:var(--sans);color:var(--body);outline:none;transition:all .15s;
}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23007E88' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px;}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 4px rgba(111,220,205,0.18);}
input::placeholder,textarea::placeholder{color:var(--meta);}
label.field-label{display:block;font-size:12px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--label);margin-bottom:7px;}
.field{margin-bottom:14px;}

/* ---------- Buttons ---------- */
.btn{background:var(--btn);color:var(--ink);border:none;border-radius:22px;padding:12px 22px;font-size:12.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;box-shadow:var(--btnShadow);transition:transform .12s,box-shadow .12s;display:inline-block;}
.btn:hover{transform:translateY(-1px);box-shadow:0 18px 40px rgba(73,205,190,0.36);}
.btn:active{transform:translateY(0);}
.btn.ghost{background:var(--pill);color:var(--accent);border:1px solid var(--pillBorder);box-shadow:var(--pillShadow);}
.btn.ghost:hover{box-shadow:var(--pillShadow);background:#fff;}
.btn.sm{padding:8px 15px;font-size:11px;border-radius:16px;}
.btn.dark{background:var(--ink);color:#EAFBF7;box-shadow:0 14px 34px rgba(16,40,41,0.22);}

/* filter row */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
.filters .fg{display:flex;flex-direction:column;gap:6px;min-width:150px;}
.filters .fg label{font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--label);}
.filters select,.filters input{padding:9px 12px;border-radius:13px;font-size:13px;}

/* progress */
.prog{height:9px;background:var(--track);border-radius:99px;overflow:hidden;}
.prog>span{display:block;height:100%;border-radius:99px;background:var(--btn);}
.prog.green>span{background:var(--green);}
.prog.yellow>span{background:var(--yellow);}
.prog.red>span{background:var(--red);}

/* stacked bar */
.stack{display:flex;height:26px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.6);}
.stack.tall{height:34px;}
.stack>span{display:flex;align-items:center;justify-content:center;height:100%;overflow:hidden;}
.bar-val{font-size:9.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;text-shadow:0 1px 1px rgba(0,0,0,0.18);}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
.legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted2);}
.legend .sw{width:11px;height:11px;border-radius:4px;}
.seg-click,.legend .li.seg-click{cursor:pointer;}
/* Column (vertical-bar) charts for the "Where the spend goes" breakdowns. All three share one y-axis
   scale so the single tallest value across the three charts reaches the top. X-axis names sit below,
   rotated -45° (diagonal) so long labels fit without overlapping. */
.colchart{width:100%;padding:0 10px 0 18px;box-sizing:border-box;}
.cc-plot{display:flex;align-items:stretch;gap:6px;padding:0 6px;height:150px;border-bottom:1.5px solid var(--cardBorder);}
.cc-col{flex:1 1 0;min-width:0;display:flex;align-items:flex-end;justify-content:center;}
.cc-bar{width:100%;max-width:26px;min-height:2px;border-radius:4px 4px 0 0;cursor:pointer;transition:filter .15s ease;}
.cc-bar:hover{filter:saturate(1.25) brightness(1.05);}
.cc-labs{display:flex;gap:6px;padding:0 6px;margin-top:2px;height:82px;overflow:visible;}
.cc-lab{flex:1 1 0;min-width:0;position:relative;}
.cc-l{position:absolute;top:3px;left:50%;transform-origin:top right;transform:translateX(-100%) rotate(-45deg);white-space:nowrap;font-size:8.5px;line-height:1.1;color:var(--muted2);cursor:pointer;}
.cc-l:hover{color:var(--accent);}
.spark{display:inline-block;vertical-align:middle;overflow:visible;}
.spark:hover{filter:saturate(1.3);}
.spend-reveal{position:fixed;z-index:9999;background:var(--ink);color:#fff;padding:6px 12px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(16,40,41,0.28);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s ease,transform .18s ease;white-space:nowrap;}
.spend-reveal.show{opacity:1;transform:translateY(0);}

/* insight card */
.insight{display:flex;gap:12px;padding:15px 16px;border-radius:18px;background:rgba(255,255,255,0.62);border:1px solid var(--pillBorder);box-shadow:var(--pillShadow);}
.insight .ic-badge{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
.insight .ic-badge svg{width:18px;height:18px;stroke-width:1.8;fill:none;}
.insight .it-title{font-weight:700;color:var(--ink);font-size:13px;}
.insight .it-body{font-size:12px;color:var(--muted2);margin-top:3px;line-height:1.45;}
.insight.warn .ic-badge{background:var(--yellowBg);}.insight.warn .ic-badge svg{stroke:var(--yellow);}
.insight.crit .ic-badge{background:var(--redBg);}.insight.crit .ic-badge svg{stroke:var(--red);}
.insight.ok .ic-badge{background:var(--greenBg);}.insight.ok .ic-badge svg{stroke:var(--green);}
.insight.info .ic-badge{background:rgba(0,126,136,0.10);}.insight.info .ic-badge svg{stroke:var(--accent);}

/* heatmap */
.heat td,.heat th{text-align:center;padding:0;}
.heat .cell{margin:3px;border-radius:11px;padding:11px 6px;font-weight:700;font-size:12.5px;color:var(--ink);cursor:pointer;transition:transform .1s;}
.heat .cell:hover{transform:scale(1.05);}
.heat .rowlabel{text-align:left;font-weight:600;color:var(--ink);font-size:12.5px;padding-right:12px;white-space:nowrap;}

/* side panel */
.overlay{position:fixed;inset:0;background:rgba(16,40,41,0.28);backdrop-filter:blur(3px);z-index:50;display:none;}
.overlay.show{display:block;}
.panel{position:fixed;top:0;right:0;height:100vh;width:min(640px,96vw);background:linear-gradient(160deg,#FBFEFD,#EFF9F7);box-shadow:-30px 0 80px rgba(20,65,70,0.18);z-index:60;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:30px 30px 60px;}
.panel.show{transform:translateX(0);}
.panel .close{position:absolute;top:22px;right:22px;width:38px;height:38px;border-radius:50%;background:var(--pill);border:1px solid var(--pillBorder);display:flex;align-items:center;justify-content:center;box-shadow:var(--pillShadow);cursor:pointer;}
.panel .close svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none;}

/* misc */
.metaline{font-size:11px;color:var(--meta);display:flex;gap:14px;flex-wrap:wrap;}
.metaline b{color:var(--label);font-weight:700;}
.divider{height:1px;background:rgba(16,40,41,0.08);margin:18px 0;}
.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:8px 14px;font-size:13px;}
.kv .k{color:var(--label);font-weight:600;font-size:11.5px;letter-spacing:0.03em;text-transform:uppercase;}
.kv .v{color:var(--body);}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;}
.checkline{display:flex;align-items:center;gap:9px;font-size:13px;padding:6px 0;}
.checkline input{width:auto;}
.scorebar{display:flex;align-items:center;gap:8px;}
.scorebar .track{flex:1;height:7px;background:var(--track);border-radius:99px;overflow:hidden;}
.scorebar .track>span{display:block;height:100%;background:var(--accent2);border-radius:99px;}
.scorebar .val{font-size:11px;font-weight:700;color:var(--ink);width:26px;text-align:right;}
.hint{font-size:11.5px;color:var(--meta);font-style:italic;}
.rec{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;}
.bubble-label{font-size:9px;fill:var(--muted2);font-family:var(--sans);}
.axis-label{font-size:11px;fill:var(--label);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;font-family:var(--sans);}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.tab{padding:9px 16px;border-radius:16px;font-size:12.5px;font-weight:600;background:var(--pill);border:1px solid var(--pillBorder);color:var(--muted2);box-shadow:var(--pillShadow);cursor:pointer;}
.tab.active{background:var(--ink);color:#EAFBF7;}
.empty{padding:40px;text-align:center;color:var(--meta);font-size:13px;}
.mini-kpi{display:flex;flex-direction:column;gap:3px;}
.mini-kpi .mv{font-size:19px;font-weight:700;color:var(--ink);font-family:var(--serif);}
.mini-kpi .ml{font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--label);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#EAFBF7;padding:13px 22px;border-radius:18px;font-size:13px;font-weight:600;box-shadow:0 18px 44px rgba(16,40,41,0.3);opacity:0;transition:all .3s;z-index:100;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ v2 additions ============ */
.appwrap{max-width:1680px;margin:0 auto;padding:0 30px 64px;}
.appheader{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:15px 22px;margin:0 -12px 4px;border-radius:0 0 26px 26px;
  background:rgba(255,255,255,0.78);backdrop-filter:blur(12px);border:1px solid var(--cardBorder);border-top:none;box-shadow:var(--pillShadow);}
.appheader .hbrand{display:flex;flex-direction:column;min-width:196px;margin-right:auto;}
.appheader .hbrand .eyebrow{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);}
.appheader .hbrand h1{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-0.01em;line-height:1.08;margin-top:3px;}
.appheader .hbrand .sub{font-size:10.5px;color:var(--muted2);margin-top:3px;}
.hctrl{display:flex;flex-direction:column;gap:4px;}
.hctrl label{font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--label);}
.hctrl select,.hctrl input{padding:8px 11px;border-radius:12px;font-size:12.5px;min-width:118px;}
.hctrl.search input{min-width:186px;}

function capSlug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
/* Merge the generic catalogue into the seed as EMPTY (no-people) skills, reusing an existing role
   name when it matches case-insensitively, and skipping any skill already present in that role. This
   runs once against SEED_BRICKS so it becomes part of the default seed; persisted user data is left
   untouched on reload. */
(function mergeCatalogueIntoSeed(){
  const domainByLower={}; SEED_BRICKS.forEach(b=>{ if(b.domain) domainByLower[b.domain.toLowerCase()]=b.domain; });
  Object.keys(CAP_CATALOGUE).forEach(role=>{
    const rl=role.toLowerCase();
    const domain=domainByLower[rl]||role; domainByLower[rl]=domain;
    const have=new Set(SEED_BRICKS.filter(b=>b.domain===domain).map(b=>String(b.name).toLowerCase()));
    CAP_CATALOGUE[role].forEach(cap=>{
      if(have.has(cap.toLowerCase())) return; have.add(cap.toLowerCase());
      SEED_BRICKS.push({id:'cap-'+capSlug(domain)+'-'+capSlug(cap), domain:domain, name:cap, maturity:2, capacity:0, unit:'FTE', importance:'Medium', owner:'—', reco:'—', desc:'', people:[]});
    });
  });
})();
let BRICKS = clone(SEED_BRICKS);
/* legacy brick topics → resource-heatmap role names (for migrating previously-saved state).
   Note: seeded bricks always take their canonical role from SEED_BRICKS in hydrate(); this map
   only covers any custom (non-seed) bricks a user may have added under the old topic names. */
const DOMAIN_MIGRATE={
  'Software development':'Software developers', 'Electrical engineering':'Electrical engineers',
  'Mechanical engineering':'Mech engineers', 'Aero engineering':'Aero engineers',

/* ---------- Resource roles — 24-month capacity outlook (total / planned / free) ----------
   total = headcount capacity (FTE), planned = committed to current work, free = total − planned. */
const RESOURCE_MONTHS = 24;
const SEED_ROLES = (function(){
  const defs=[
    {id:'pm',   name:'Project managers',     start:24, growth:0.35, plan:0.74, phase:0},
    {id:'swd',  name:'Software developers',  start:42, growth:0.85, plan:0.82, phase:1},
    {id:'aero', name:'Aero engineers',       start:14, growth:0.20, plan:0.66, phase:2},
    {id:'mech', name:'Mech engineers',       start:32, growth:0.28, plan:0.77, phase:3},
    {id:'ee',   name:'Electrical engineers', start:20, growth:0.30, plan:0.70, phase:4}
  ];
  return defs.map(d=>{
    const total=[], planned=[];
    for(let m=0;m<RESOURCE_MONTHS;m++){
      const t=Math.round((d.start + d.growth*m)*10)/10;
      const wave=1 + 0.12*Math.sin((m+d.phase)/3.2);   // planned demand ebbs and flows
      const p=Math.round(Math.min(t, t*d.plan*wave)*10)/10;
      total.push(t); planned.push(p);
    }
    return {id:d.id, name:d.name, total, planned};
  });
})();
let ROLES = clone(SEED_ROLES);
function roleFree(r){ return r.total.map((t,i)=>Math.max(0, Math.round((t-(r.planned[i]||0))*10)/10)); }

/* ---------- Per-person weekly "hours booked" — the input behind the Resource-use table ----------
   One ROW PER PERSON: {name, role (display), roleId (resolved to the tool-wide role id), hours:[weekly]}.
   A fully-booked person = 40 h/week = 100% = 1.0 FTE. FTE per role = number of people booked to that
   role; utilisation = booked hours ÷ (headcount × 40 h). WEEK_LABELS are the weekly column headers so
   an uploaded sheet round-trips its own week labels. All figures are illustrative / fictional. */
const HOURS_FULL_WEEK = 40;
const RESOURCE_WEEKS = 13;
const defaultWeekLabels = () => Array.from({length:RESOURCE_WEEKS}, (_,i)=>'Hrs booked W'+(i+1));
let WEEK_LABELS = defaultWeekLabels();
const SEED_PEOPLE = (function(){
  const defs=[
    {id:'pm',   name:'Project managers',     head:3,  util:0.74},
    {id:'swd',  name:'Software developers',  head:8,  util:0.82},
    {id:'aero', name:'Aero engineers',       head:6,  util:0.66},
    {id:'mech', name:'Mech engineers',       head:6,  util:0.77},
    {id:'ee',   name:'Electrical engineers', head:4,  util:0.70}
  ];
  const out=[];
  defs.forEach((d,ri)=>{
    for(let k=0;k<d.head;k++){
      const hours=[];
      for(let w=0;w<RESOURCE_WEEKS;w++){
        const wave=1 + 0.18*Math.sin((w + k*1.7 + ri*2.3)/2.6);
        let h=Math.round((d.util*HOURS_FULL_WEEK*wave)/5)*5;   // clean multiples of 5, like a real timesheet
        hours.push(Math.max(0, Math.min(HOURS_FULL_WEEK, h)));
      }
      out.push({name:'N.N.', role:d.name, roleId:d.id, hours});
    }
  });
  return out;
})();
let PEOPLE = clone(SEED_PEOPLE);
/* slug a free-text role name into a stable id (for a brand-new role type introduced via upload) */
function slugRoleId(name){ return String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'role'; }
/* map a role NAME (from the per-person hours sheet) to a canonical role id — matching an existing role
   by label (case-insensitive) so the Resource-use table lines up with the Free Capacity heatmap; a name
   with no match gets a slug id so a brand-new role type still surfaces everywhere via roleDict(). */
function resolveRoleId(name){
  const nl=String(name||'').trim().toLowerCase(); if(!nl) return '';
  const sources=[SEED_ROLES, SEED_FREECAP, (typeof ROLES!=='undefined'?ROLES:[]), (typeof FREECAP!=='undefined'?FREECAP:[])];
  for(const src of sources){ for(const r of (src||[])){ if(r&&String(r.name||'').trim().toLowerCase()===nl) return r.id; } }
  if(typeof PEOPLE!=='undefined'&&PEOPLE){ for(const p of PEOPLE){ if(p&&p.roleId&&String(p.role||'').trim().toLowerCase()===nl) return p.roleId; } }
  return slugRoleId(name);
}

/* pale → accent-teal colour ramp for the free-capacity heatmap cells (t in 0..1) */
function fcHeatColor(t){
  t=Math.max(0,Math.min(1,t));
  const c0=[233,242,242], c1=[0,140,153];
  const r=Math.round(c0[0]+(c1[0]-c0[0])*t), g=Math.round(c0[1]+(c1[1]-c0[1])*t), b=Math.round(c0[2]+(c1[2]-c0[2])*t);

}

  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{ try{
      const d=JSON.parse(rd.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.products)){ toast('Not a valid cockpit backup file'); return; }
      if(!confirm('Restore this backup? It replaces the current project with the saved state.')) return;

function envelopeCalc(env){
  const total = env.revenue * (env.intensity/100);
  const discretionary = total - env.committedCarryover - env.mandatory - env.mgmtReserve;
  return { total, discretionary,
    committed:env.committedCarryover, mandatory:env.mandatory, reserve:env.mgmtReserve };
}
/* 10% existing-product improvement pool (editable %) */

/* Avg price and EBIT/Rev are STORED verbatim columns (read from the uploaded Excel — no calculation).
   These helpers return the stored value; they fall back to a computed value only when the field is
   absent (e.g. older data), so sorting/scoring elsewhere never breaks. */
function avgPrice(p){ if(p && p.avgPrice!=null && p.avgPrice!=='') return +p.avgPrice||0; return (p&&p.volume>0) ? Math.round(p.sales*1e6/p.volume) : 0; }

/* ---- 12-month sales: relative columns sales_m1 (oldest) … sales_m12 (latest = current month) ----
   monthLabels() maps each m-index to the real calendar month, computed dynamically from today, so
   the trailing 12-month window rolls forward automatically (e.g. Aug'25 … Jul'26 if today is July). */
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabels(){ const out=[]; const now=new Date(); for(let k=1;k<=12;k++){ const dt=new Date(now.getFullYear(), now.getMonth()-(12-k), 1); out.push({key:'sales_m'+k, idx:k, mon:dt.getMonth(), yr:dt.getFullYear(), label:String(dt.getFullYear()).slice(2)+"'"+String(dt.getMonth()+1).padStart(2,'0'), short:MON3[dt.getMonth()]}); } return out; }
const _pad12=a=>{ const b=a.slice(0,12).map(x=>+x||0); while(b.length<12) b.push(0); return b; };
/* rawSalesMonthly: the VERBATIM 12-month series exactly as it sits in the data — whatever column
   currently holds a ";"-separated numeric series (renamed or not), else a stored salesMonthly array
   with at least one non-zero value. Returns null when the product carries no real monthly series.
   Used by the table sparklines so nothing is fabricated or rescaled there. */
function rawSalesMonthly(p){
  if(!p) return null;
  if(typeof productColOrder==='function' && typeof prodSeriesArray==='function' && typeof prodRawVal==='function'){
    const order=productColOrder();
    for(const k of order){ const arr=prodSeriesArray(prodRawVal(p,k)); if(arr) return _pad12(arr); }
  }
  if(Array.isArray(p.salesMonthly)&&p.salesMonthly.some(x=>+x)) return _pad12(p.salesMonthly);
  return null;
}
/* salesMonthlyOf: the monthly series used for the KPI revenue-trend graph. Uses the verbatim series
   when the product has one; otherwise it spreads the Revenue column evenly across 12 months, so a
   product with only an annual Revenue figure still contributes its revenue to the portfolio trend and
   the graph tracks the Revenue column (no stale seed data). */
function salesMonthlyOf(p){
  if(!p) return Array(12).fill(0);
  const raw=rawSalesMonthly(p);
  if(raw) return raw;
  const s=+p.sales||0; return Array.from({length:12},()=>s/12);
}
function sales12Total(p){ return salesMonthlyOf(p).reduce((a,b)=>a+b,0); }
function sales12Growth(p){ const a=salesMonthlyOf(p); const first=a[0], last=a[11]; return first>0 ? (last/first-1)*100 : 0; }
/* portfolio revenue per month (sum across a product list of each month's sales) */
function portfolioMonthly(list){ const out=Array(12).fill(0); (list||PRODUCTS).forEach(p=>{ const a=salesMonthlyOf(p); for(let i=0;i<12;i++) out[i]+=a[i]; }); return out; }

function bomStats(p){

}

function candidateWeights(type){
  const base={strategicFit:.20,productImpact:.15,customerValue:.15,financialValue:.20,differentiation:.10,capabilityValue:.05,risk:.05,timing:.05,complexity:.05};
  if(type==='Mandatory') return {strategicFit:.10,productImpact:.10,customerValue:.05,financialValue:.10,differentiation:.02,capabilityValue:.03,risk:.45,timing:.10,complexity:.05};
  if(type==='DtV') return {strategicFit:.10,productImpact:.12,customerValue:.10,financialValue:.28,differentiation:.05,capabilityValue:.05,risk:.10,timing:.05,complexity:.15};
  if(type==='Platform / tech'||type==='platform'||type==='Tech') return {strategicFit:.22,productImpact:.10,customerValue:.08,financialValue:.15,differentiation:.10,capabilityValue:.20,risk:.05,timing:.05,complexity:.05};
  if(type==='NPD') return {strategicFit:.20,productImpact:.12,customerValue:.15,financialValue:.15,differentiation:.15,capabilityValue:.08,risk:.05,timing:.05,complexity:.05};
  if(type==='Existing product update') return {strategicFit:.10,productImpact:.18,customerValue:.15,financialValue:.24,differentiation:.08,capabilityValue:.05,risk:.05,timing:.05,complexity:.10};

function candidateScore(c){

  for(const k in w){ total += w[k]*(map[k]??0); wsum+=w[k]; }

}

function scarceUnits(c){

function eligibility(c){
  const issues=[];
  if(!c.problem) issues.push('No clear problem statement');
  if(c.bucket!=='Platform / tech' && c.bucket!=='platform' && c.bucket!=='Tech' && !c.ecosystemIds.length) issues.push('No ecosystem link');
  if(c.confidence==='Low' && c.bucket==='NPD' && c.spend>25) issues.push('Low confidence on large NPD spend');
  const status = issues.length? (c.bucket==='NPD'&&c.confidence==='Low'?'Needs clarification':'Eligible with notes') : 'Eligible';
  return {status, issues};
}
function decisionRec(c){
  const score=candidateScore(c); const scarce=scarceUnits(c);
  if(c.bucket==='Mandatory') return {label:'Fund (minimum robust)', tone:'green', why:'Mandatory / risk-avoidance work.'};
  if(c.bucket==='NPD' && c.confidence==='Low') return {label:'Explore only', tone:'yellow', why:'Low evidence — stage-fund learning.'};
  if(c.productRole==='Exit' && c.bucket==='NPD' && c.spend>20) return {label:'Stop / Challenge', tone:'red', why:'Large NPD spend on an Exit-role product.'};
  if(score>=70 && scarce>18) return {label:'Stage-fund / Rephase', tone:'yellow', why:'Attractive but heavy scarce-capacity load.'};
  if(score>=70 && c.missing.length) return {label:'Fund + build capability', tone:'yellow', why:'Attractive but missing capability brick(s).'};
  if(score>=68) return {label:'Fund / Accelerate', tone:'green', why:'High attractiveness and feasible.'};
  if(score<50 && scarce>12) return {label:'Stop / Defer', tone:'red', why:'Low attractiveness, high capacity burden.'};
  if(score<55) return {label:'Defer', tone:'yellow', why:'Below the funding bar this cycle.'};
  return {label:'Prepare', tone:'yellow', why:'Moderate — refine before committing.'};
}

  const mandatorySpend=sel.filter(c=>c.bucket==='Mandatory').reduce((a,c)=>a+c.spend,0);
  const usedEnvelope=env.committed + mandatorySpend + discretionarySpend;
  const overUnder=env.total-usedEnvelope;
  const discRemaining=env.discretionary-discretionarySpend;
  const npv=sel.reduce((a,c)=>a+c.npv,0);
  const revenue=sel.reduce((a,c)=>a+c.revenue,0);
  const costSaving=sel.reduce((a,c)=>a+c.costSaving,0);
  const riskAdj=sel.reduce((a,c)=>a+riskAdjValue(c),0);
  const strategicFit=sel.length?Math.round(sel.reduce((a,c)=>a+c.s.strategicFit,0)/sel.length):0;
  const {util}=scenarioCapacity(sc);
  let maxUtil=0, overloadPools=0, worst={pool:null,q:null,val:0};
  POOLS.forEach(p=>{ util[p.id].forEach((v,i)=>{ if(v>100)overloadPools++; if(v>worst.val)worst={pool:p,q:QUARTERS[i],val:v}; maxUtil=Math.max(maxUtil,v); }); });

  const overallFeasible = financialFeasible && capacityFeasible && capabilityFeasible;
  const byEco={}, byRole={}, byBucket={};
  sel.forEach(c=>{ (c.ecosystemIds[0]?c.ecosystemIds:['(none)']).forEach(e=>byEco[e]=(byEco[e]||0)+c.spend/(c.ecosystemIds.length||1));
    byRole[c.productRole]=(byRole[c.productRole]||0)+c.spend;
    byBucket[c.bucket]=(byBucket[c.bucket]||0)+c.spend; });
  const stopped=allIds().filter(id=>!sc.sel.includes(id)).map(candidate);

/* ---------- Freeze-pane header (Excel-style) ----------
   For every .sticky-head table wrapper, clone the header row into a fixed overlay pinned to the top
   of the window while the table body is in view. The clone tracks the wrapper's horizontal scroll
   and column widths so it stays perfectly aligned; a single page scrollbar drives everything. */
let _frozenHdrInit=false;
function initFrozenHeaders(){
  if(_frozenHdrInit) return; _frozenHdrInit=true;
  // Plain scroll only needs to reposition the clone (cheap). Resize can change column widths, so it
  // forces a re-measure. Both go through the rAF-throttled scheduler to avoid layout thrash on every event.
  window.addEventListener('scroll', ()=>scheduleFrozenSync(false), {passive:true});
  window.addEventListener('resize', ()=>scheduleFrozenSync(true));
}
// rAF throttle: coalesce a burst of scroll events into at most one sync per animation frame. `force`
// (from resize / re-render) requests a full column-width re-measure on the next run.
let _fhRaf=0, _fhForceMeasure=false;
function scheduleFrozenSync(force){
  if(force) _fhForceMeasure=true;
  if(_fhRaf) return;
  // One rAF per frame drives ALL scroll-linked UI: freeze-pane headers, the top progress bar and the
  // section-nav highlight — so a burst of scroll events never does more than one layout pass.
  _fhRaf=requestAnimationFrame(()=>{ _fhRaf=0; const m=_fhForceMeasure; _fhForceMeasure=false;
    syncFrozenHeaders(m); updateScrollProgress(); updateScrollSpy(); });
}
/* Top progress bar: fill = how far down the page we are. Cheap (one style write, no layout read beyond
   the document height which the browser already has cached between scrolls). */
function updateScrollProgress(){
  const bar=document.getElementById('scrollProgress'); if(!bar) return;
  const max=document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width=(max>0 ? Math.min(100,(window.scrollY/max)*100) : 0).toFixed(2)+'%';
}
/* Section-nav scroll-spy: highlight the section whose top has most recently passed under the header. */
function updateScrollSpy(){
  const nav=document.getElementById('sectionNav'); if(!nav) return;
  const links=nav.querySelectorAll('a[data-sec]'); if(!links.length) return;
  const host=document.getElementById('content'); if(!host) return;
  const cards=host.querySelectorAll(':scope > .card[data-sec]'); if(!cards.length) return;
  let active=0; for(let i=0;i<cards.length;i++){ if(cards[i].getBoundingClientRect().top<=90) active=i; }
  links.forEach((l,i)=>l.classList.toggle('active', i===active));
}
/* Build the floating section-nav from the current tab's top-level section cards. Only shown when there
   are at least 3 sections (short pages don't need it). Re-run on every render so it always matches. */
function buildSectionNav(host){
  host=host||document.getElementById('content'); const nav=document.getElementById('sectionNav');
  if(!nav||!host) return;
  const cards=Array.prototype.filter.call(host.children, el=>el.classList&&el.classList.contains('card')&&el.querySelector(':scope > .section-head'));
  if(cards.length<3){ nav.innerHTML=''; nav.style.display='none'; return; }
  nav.style.display='';
  let html='';
  cards.forEach((c,i)=>{
    c.setAttribute('data-sec', i);
    const head=c.querySelector(':scope > .section-head');
    const titleEl = head && (head.querySelector('.card-title')||head.querySelector('.page-eyebrow'));
    let title=(titleEl?titleEl.textContent:'')||('Section '+(i+1));
    title=title.trim().replace(/\s+/g,' ').slice(0,36);
    html+='<a data-sec="'+i+'" href="#"><span class="dot"></span><span class="lbl">'+esc(title)+'</span></a>';
  });
  nav.innerHTML=html;
  nav.querySelectorAll('a[data-sec]').forEach(a=>{
    a.addEventListener('click', e=>{ e.preventDefault();
      const target=host.querySelector(':scope > .card[data-sec="'+a.getAttribute('data-sec')+'"]');
      if(target){ const y=window.scrollY + target.getBoundingClientRect().top - 16; window.scrollTo({top:Math.max(0,y), behavior:'smooth'}); }
    });
  });
  updateScrollSpy();
}
/* Reveal-on-scroll: each top-level card fades + slides up as it enters the viewport. Applied only on a
   full render() (tab switch / first load), NOT on inline-edit renderContent()s — so editing a cell never
   re-animates the whole page. Respects reduced-motion and degrades to plain visible if IO is unavailable. */
let _revealIO=null, _revealFallback=0;
function applyScrollReveal(host){
  host=host||document.getElementById('content'); if(!host) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(!('IntersectionObserver' in window)) return;   // no IO → leave cards fully visible (no reveal class)
  const cards=Array.prototype.filter.call(host.children, el=>el.classList&&el.classList.contains('card'));
  if(!_revealIO){ _revealIO=new IntersectionObserver((ents,obs)=>{
    ents.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); obs.unobserve(en.target); } });
  }, {rootMargin:'0px 0px -6% 0px', threshold:0.04}); }
  cards.forEach(el=>{ el.classList.add('reveal'); _revealIO.observe(el); });
  // Safety net for a data tool: never let a card get stuck invisible. (a) On the next frame, immediately
  // reveal anything already on screen instead of waiting for the first IO tick. (b) A hard fallback reveals
  // everything within 1.4s even if IO is throttled/paused (e.g. a backgrounded tab).
  requestAnimationFrame(()=>{ const vh=window.innerHeight||document.documentElement.clientHeight;
    cards.forEach(el=>{ const r=el.getBoundingClientRect(); if(r.top<vh && r.bottom>0){ el.classList.add('in'); if(_revealIO) _revealIO.unobserve(el); } }); });
  clearTimeout(_revealFallback); _revealFallback=setTimeout(()=>{ cards.forEach(el=>el.classList.add('in')); }, 1400);
}
function syncFrozenHeaders(measure){
  document.querySelectorAll('.tablewrap.sticky-head').forEach(wrap=>{
    const table=wrap.querySelector('table'); if(!table){ if(wrap._frozen){wrap._frozen.style.display='none';} return; }
    const headRow=table.querySelector('tr'); if(!headRow) return;
    const wrapRect=wrap.getBoundingClientRect();
    const headH=headRow.getBoundingClientRect().height;
    const active = wrapRect.top < 0 && wrapRect.bottom > headH + 4;   // table top scrolled past the window top, body still visible
    let clone=wrap._frozen;
    if(!active){ if(clone) clone.style.display='none'; return; }
    let needMeasure = !!measure;
    if(!clone){
      clone=document.createElement('div'); clone.className='frozen-hdr';
      const t=document.createElement('table'); t.className=table.className;
      t.appendChild(headRow.cloneNode(true));
      clone.appendChild(t);
      // Append to <body>, NOT the wrap: an ancestor .card uses backdrop-filter, which makes it the
      // containing block for position:fixed, so a clone inside the wrap would pin to the card, not the window.
      document.body.appendChild(clone);
      wrap._frozen=clone; needMeasure=true;
    }
    const cloneTable=clone.firstChild;
    // Detect a real header change by comparing the LIVE header to a cached copy of the clean live header
    // — NOT to the clone, whose cells carry the width styles we inject below (that comparison would always
    // differ and force a re-measure on every scroll tick).
    const liveHdrHTML=headRow.innerHTML;
    if(liveHdrHTML!==wrap._fhHdrHTML){ cloneTable.firstChild.innerHTML=liveHdrHTML; needMeasure=true; }
    const tableW=table.getBoundingClientRect().width;
    if(tableW!==wrap._fhTableW) needMeasure=true;   // widths changed (column resize / layout shift)
    // Per-column width matching is the expensive part (a forced reflow per column) — only redo it when
    // something actually changed, NOT on every scroll tick. Plain scrolling skips this loop entirely.
    if(needMeasure){
      const src=headRow.children, dst=cloneTable.firstChild.children;
      for(let i=0;i<src.length;i++){ if(dst[i]){ const w=src[i].getBoundingClientRect().width; dst[i].style.width=w+'px'; dst[i].style.minWidth=w+'px'; dst[i].style.maxWidth=w+'px'; } }
      cloneTable.style.width=tableW+'px';
      wrap._fhTableW=tableW;
      wrap._fhHdrHTML=liveHdrHTML;   // cache the clean live header for next-time change detection
    }
    clone.style.display='block';
    clone.style.top='0px';
    clone.style.left=wrapRect.left+'px';
    clone.style.width=wrap.clientWidth+'px';
    clone.style.height=headH+'px';
    cloneTable.style.transform='translateX('+(-wrap.scrollLeft)+'px)';
  });
}
function renderContent(){
  const host=document.getElementById('content'); if(!host)return;

  document.querySelectorAll('.frozen-hdr').forEach(el=>el.remove());
  // Preserve horizontal scroll of any table wrappers so expanding a row (etc.) doesn't jump back to the left.
  const prevScroll=Array.prototype.map.call(host.querySelectorAll('.tablewrap'), el=>el.scrollLeft);

  host.querySelectorAll('.tablewrap.sticky-head').forEach(w=>{ if(!w._fhScroll){ w._fhScroll=true; w.addEventListener('scroll', ()=>scheduleFrozenSync(false), {passive:true}); } });

/* Make every top-level section (a .card with a .section-head) collapsible via a small down-arrow

let wkDrag=null;
let moveModePid=null;   // project strip currently in move mode (double-clicked)
let moveDrag=null;      // active whole-project move gesture
function wkClearHighlight(){ if(wkDrag&&wkDrag.hl&&wkDrag.hl.parentNode){ wkDrag.hl.parentNode.removeChild(wkDrag.hl); } if(wkDrag) wkDrag.hl=null; }
function wkDrawHighlight(){
  if(!wkDrag) return;
  if(!wkDrag.hl){ const r=document.createElementNS('http://www.w3.org/2000/svg','rect'); r.setAttribute('y','0'); r.setAttribute('height', wkDrag.svg.getAttribute('height')||'54'); r.setAttribute('fill', roleColor(wkDrag.role)||'#2F80ED'); r.setAttribute('opacity','0.28'); r.setAttribute('pointer-events','none'); wkDrag.svg.appendChild(r); wkDrag.hl=r; }
  const a=Math.min(wkDrag.startWeek,wkDrag.curWeek), b=Math.max(wkDrag.startWeek,wkDrag.curWeek);
  wkDrag.hl.setAttribute('x', a*wkDrag.colw); wkDrag.hl.setAttribute('width', (b-a+1)*wkDrag.colw);
}
function wkCloseEditor(){ const ex=document.getElementById('wk-week-editor'); if(ex) ex.remove(); }
function wkOpenEditor(info, clientX, clientY){
  wkCloseEditor();
  const inp=document.createElement('input');
  inp.type='number'; inp.min='0'; inp.step='1'; inp.value=info.val; inp.id='wk-week-editor';
  inp.style.cssText='position:fixed;z-index:9999;width:56px;padding:3px 6px;border:1.5px solid var(--accent);border-radius:6px;font-size:12px;text-align:right;background:var(--card);color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.20)';
  inp.style.left=Math.max(6, Math.min(window.innerWidth-72, clientX-12))+'px';
  inp.style.top=Math.max(6, clientY-16)+'px';
  document.body.appendChild(inp); inp.focus(); inp.select();
  const commit=()=>{ const n=Math.max(0,Math.round(parseFloat(inp.value)||0)); if(!state.weeklyProfile[info.pid]) state.weeklyProfile[info.pid]={}; if(!state.weeklyProfile[info.pid][info.role]) state.weeklyProfile[info.pid][info.role]={}; state.weeklyProfile[info.pid][info.role][info.startWeek]=n; wkCloseEditor(); persist(); renderContent(); };
  inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); commit(); } else if(ev.key==='Escape'){ ev.preventDefault(); wkCloseEditor(); } });
  inp.addEventListener('blur', commit);
}
document.addEventListener('pointerdown', e=>{
  // whole-project move: if a strip is in move mode and it was pressed, start a move gesture
  if(moveModePid){
    const svgM=e.target.closest && e.target.closest('svg[data-pid]');
    if(svgM && svgM.getAttribute('data-pid')===moveModePid){
      wkCloseEditor();
      moveDrag={ svg:svgM, pid:moveModePid, colw:+svgM.getAttribute('data-colw')||6,
        origStart:+svgM.getAttribute('data-start')||0, dur:+svgM.getAttribute('data-dur')||1,
        downX:e.clientX, curStart:+svgM.getAttribute('data-start')||0, moved:false };
      svgM.style.cursor='grabbing';
      e.preventDefault(); return;
    }
  }
  const seg=e.target.closest && e.target.closest('.wk-seg'); if(!seg) return;
  const svg=seg.closest('svg'); if(!svg) return;
  wkCloseEditor();
  wkDrag={ svg, pid:svg.getAttribute('data-pid'), colw:+svg.getAttribute('data-colw')||6,
    startW:+svg.getAttribute('data-start')||0, endW:+svg.getAttribute('data-end')||PLAN_WEEKS,
    role:seg.getAttribute('data-role'), val:+seg.getAttribute('data-val')||0,
    startWeek:+seg.getAttribute('data-week')||0, curWeek:+seg.getAttribute('data-week')||0,
    rect:svg.getBoundingClientRect(), moved:false, hl:null, downX:e.clientX, downY:e.clientY };
  e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if(moveDrag){
    const delta=Math.round((e.clientX-moveDrag.downX)/moveDrag.colw);
    if(delta!==0) moveDrag.moved=true;
    let ns=moveDrag.origStart+delta;
    ns=Math.max(0, Math.min(PLAN_WEEKS-1, ns));
    moveDrag.curStart=ns;
    // live preview: shift the strip's rendered bars by the pixel delta from its original position
    moveDrag.svg.style.transform='translateX('+((ns-moveDrag.origStart)*moveDrag.colw)+'px)';
    return;
  }
  if(!wkDrag) return;
  let w=Math.floor((e.clientX-wkDrag.rect.left)/wkDrag.colw);
  w=Math.max(wkDrag.startW, Math.min(wkDrag.endW-1, w));
  if(Math.abs(e.clientX-wkDrag.downX)>3) wkDrag.moved=true;
  if(w!==wkDrag.curWeek){ wkDrag.curWeek=w; wkDrag.moved=true; }
  if(wkDrag.moved) wkDrawHighlight();
});
document.addEventListener('pointerup', e=>{
  if(moveDrag){
    const m=moveDrag; moveDrag=null;
    if(m.moved){
      if(!state.planStart) state.planStart={};
      state.planStart[m.pid]=m.curStart;
      moveModePid=null;              // moving commits and exits move mode
      persist(); renderContent();
    } else {
      m.svg.style.transform=''; m.svg.style.cursor='grab';
    }
    return;
  }
  if(!wkDrag) return;
  const d=wkDrag; wkClearHighlight(); wkDrag=null;
  if(d.moved){
    const a=Math.min(d.startWeek,d.curWeek), b=Math.max(d.startWeek,d.curWeek);
    if(!state.weeklyProfile[d.pid]) state.weeklyProfile[d.pid]={};
    if(!state.weeklyProfile[d.pid][d.role]) state.weeklyProfile[d.pid][d.role]={};
    for(let w=a; w<=b; w++){ state.weeklyProfile[d.pid][d.role][w]=d.val; }
    persist(); renderContent();
  } else {
    wkOpenEditor({pid:d.pid, role:d.role, startWeek:d.startWeek, val:d.val}, e.clientX, e.clientY);
  }
});
/* double-click a project strip to toggle whole-project move mode */
document.addEventListener('dblclick', e=>{
  const svg=e.target.closest && e.target.closest('svg[data-pid]'); if(!svg) return;
  const pid=svg.getAttribute('data-pid'); if(!pid) return;
  wkCloseEditor();
  moveModePid=(moveModePid===pid)?null:pid;
  renderContent();
});
/* Esc leaves move mode */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && moveModePid){ moveModePid=null; renderContent(); }
});

function bomTree(items){
  const sys={}; items.forEach(i=>{ sys[i.system]=sys[i.system]||{}; sys[i.system][i.module]=sys[i.system][i.module]||[]; sys[i.system][i.module].push(i); });
  let h='';
  Object.entries(sys).forEach(([sname,mods])=>{
    const sysCost=Object.values(mods).flat().reduce((a,i)=>a+i.cost,0);
    const key='sys_'+sname;
    h+=`<tr class="clickable" data-action="toggle-bom" data-val="${esc(key)}"><td colspan="4" class="t-strong">${state.bomExpanded[key]?'▾':'▸'} ${esc(sname)}</td><td class="num t-strong">${fmtM(sysCost)}</td><td colspan="4"></td></tr>`;
    if(state.bomExpanded[key]){
      Object.entries(mods).forEach(([mname,parts])=>{
        parts.forEach(i=>{
          h+=`<tr><td style="padding-left:28px">${esc(mname)} · <span class="t-name">${esc(i.part)}</span></td><td>${esc(i.material)}</td><td class="num">${i.weight}</td><td class="t-sub">${esc(i.supplier)}</td><td class="num t-strong">${fmtM(i.cost)}</td><td>${ragBadge(i.driver==='High'?'red':i.driver==='Medium'?'yellow':'green',i.driver)}</td><td class="t-sub">${esc(i.substitution||'—')}</td><td>${i.unique?'<span class="badge yellow">Unique</span>':'<span class="badge green">Common</span>'}</td><td>${ragBadge(i.supplyRisk==='High'?'red':i.supplyRisk==='Medium'?'yellow':'green',i.supplyRisk)}</td></tr>`;
        });
      });

  });
  return h||'<tr><td colspan="9" class="t-sub" style="padding:12px">No BOM lines loaded for this product.</td></tr>';

function dtvRecos(p){
  const items=bomFor(p.id); const c=p.cost; const totalCost=totalCostStack(p);
  const unique=items.filter(i=>i.unique).length, common=items.filter(i=>i.common).length;
  const dtv=[];
  if(unique>common && ebitMarginOf(p)<12) dtv.push(['Commonality program','High unique-part share with low margin → increase common parts.','crit']);
  if(items.some(i=>i.substitution&&i.driver==='High')) dtv.push(['Material substitution','High-cost parts have substitution options.','warn']);
  if(p.features.lowValue.length && ebitMarginOf(p)<12) dtv.push(['Feature simplification','Low-value features add cost → simplify.','warn']);
  if(items.some(i=>i.supplyRisk==='High')) dtv.push(['Sourcing action','Supplier concentration / high supply risk detected.','crit']);
  if(c.transport+c.importCost > totalCost*0.08) dtv.push(['Footprint / packaging review','Logistics & import costs are elevated.','warn']);
  return dtv;
}

const PROD_SCHEMA_BY_KEY=(()=>{ const m={}; PRODUCT_SCHEMA.forEach(c=>m[c.key]=c); return m; })();
const PROD_KEY_SET=new Set(PRODUCT_SCHEMA.map(c=>c.key));
const PROD_COST_KEYS=new Set(PRODUCT_SCHEMA.filter(c=>c.cost).map(c=>c.key));
const PROD_NUMERIC_TYPES=new Set(['num','int','money','price','pct','pctsigned','ebitpct','cost']);
/* Per-country drill-down lives in the SAME product Excel as child rows: a leading "Country" column is
   blank on the product row and carries the country name on each breakdown row (same id links them).
   Country rows reuse these product columns verbatim — no calculations. Add rows to add countries. */
const PRODUCT_COUNTRY_COL='Country';
const COUNTRY_FIELD_KEYS=['ebit','sales','ebitRev','volume','avgPrice','nps','salesMonthly'];
/* current display / export column order (rebuilt from an uploaded file's header row); default = schema order */
function productColOrder(){ return (Array.isArray(state.productColOrder)&&state.productColOrder.length)?state.productColOrder:PRODUCT_SCHEMA.map(c=>c.key); }
/* column descriptor for a key — native from the schema, otherwise a custom text column.
   If the file renamed a native column (tracked in state.productColLabels), show the user's header
   text as the label while keeping the schema key/type — so KPIs, the graph and the drill-down stay
   mapped to the right field even though the header was renamed. */
function prodColDesc(key){ const base = PROD_SCHEMA_BY_KEY[key] || {key:key, label:key, type:'text', custom:true};
  const ov = state.productColLabels && state.productColLabels[key];
  return (ov && PROD_SCHEMA_BY_KEY[key]) ? Object.assign({}, base, {label:ov}) : base; }
/* custom (uploaded) columns = any column in the current order that isn't a native schema key */
function extraProductCols(){ return productColOrder().filter(k=>!PROD_KEY_SET.has(k)); }
function extraCandCols(){ return Array.isArray(state.candidateExtraCols)?state.candidateExtraCols:[]; }
function prodColspan(){ return productColOrder().length; }
function filteredProducts(){
  const f=state.filters; const q=(state.search||'').trim().toLowerCase();
  return PRODUCTS.filter(p=>{
    const eids=Array.isArray(p.ecosystemIds)?p.ecosystemIds:[];

    if(f.pgroup!=='all' && p.productGroup!==f.pgroup) return false;
    if(q){ const hay=((p.name||'')+' '+(p.sku||'')+' '+(p.productGroup||'')+' '+(p.targetSegment||'')+' '+eids.map(ecoName).join(' ')).toLowerCase(); if(!hay.includes(q)) return false; }

function productValue(p,key){
  return {name:(p.name||'').toLowerCase(),ebit:+p.ebit||0,rev:+p.sales||0,margin:ebitMarginOf(p),units:+p.volume||0,price:avgPrice(p),cagr:+p.cagrSales||0,complexity:+p.complexityScore||0}[key];
}
function productSortCmp(a,b){
  const s=state.sort.health; const av=productValue(a,s.key), bv=productValue(b,s.key);
  let d=(av>bv?1:av<bv?-1:0)*s.dir; if(d!==0) return d;
  return ((+b.ebit||0)-(+a.ebit||0))||((+b.sales||0)-(+a.sales||0))||(ebitMarginOf(b)-ebitMarginOf(a))||((+b.volume||0)-(+a.volume||0))||(avgPrice(b)-avgPrice(a));
}
/* does this product carry real per-country data? (drill-down only shows then) */
function productHasCountries(p){ return Array.isArray(p.countries) && p.countries.length>0; }
/* raw stored value for a key (cost columns live under p.cost) */
function prodRawVal(p,key){ const d=prodColDesc(key); return d.cost ? ((p.cost||{})[key]) : p[key]; }
/* Detect a ";"-separated numeric series (e.g. a renamed monthly-sales column) so it still renders as a
   sparkline by CONTENT, not by column name. Needs several numeric points so plain numbers/text don't match. */
function prodSeriesArray(v){
  if(typeof v!=='string') return null;
  if(v.indexOf(';')<0) return null;
  const parts=v.split(';').map(s=>s.trim()).filter(s=>s!=='');
  if(parts.length<6) return null;                 // a real series (monthly ≈ 12); short lists stay as text
  const nums=[]; for(const s of parts){
    const c=s.replace(/[€$£%\s]/g,'').replace(/,/g,'');   // tolerate currency, %, spaces and thousands separators
    if(!/^-?\d+(?:\.\d+)?$/.test(c)) return null; nums.push(parseFloat(c)); }
  return nums;
}
/* render one <td> for product p / column key — verbatim value, formatted by type */
function prodCellHtml(p,key){
  const d=prodColDesc(key); const raw=prodRawVal(p,key);
  const blank=(raw==null||raw==='');
  // Auto-sparkline: any non-spark, non-list column whose value is a ";"-separated numeric series
  // is drawn as a graph (so renaming the "Sales (12mo)" column still shows the sparkline).
  if(!blank && d.type!=='spark' && d.type!=='list'){
    const ser=prodSeriesArray(raw);
    if(ser) return `<td class="num" style="text-align:center">${sparkline(ser,{name:(p.name||'')+' · '+(d.label||'')})}</td>`;
  }
  const numStr=v=>{ const s=String(v).trim(); const n=parseFloat(s.replace(/[^0-9.\-]/g,'')); return {s,n:isNaN(n)?0:n,hasPct:/%$/.test(s)}; };
  switch(d.type){
    case 'name': {
      const canExp=productHasCountries(p);
      const exp=!!state.productExpanded[p.id];
      const caret=canExp?`<span class="caret">${exp?'▾':'▸'}</span> `:'';
      return `<td>${caret}<span class="t-name">${esc(p.name||'')}</span></td>`;
    }
    case 'id':   return `<td class="t-sub mono">${esc(p.id||'')}</td>`;
    case 'list': { const arr=Array.isArray(raw)?raw:(blank?[]:String(raw).split(/[;|,]/).map(x=>x.trim()).filter(Boolean)); return `<td class="t-sub">${arr.length?esc(arr.map(ecoName).join(', ')):'—'}</td>`; }
    case 'long': return `<td class="t-sub" style="max-width:240px;white-space:normal;line-height:1.35">${blank?'—':esc(String(raw))}</td>`;
    case 'text': return `<td class="t-sub">${blank?'—':esc(String(raw))}</td>`;
    case 'num':  return `<td class="num">${blank?'—':esc(String(raw))}</td>`;
    case 'int':  return `<td class="num mono">${blank?'—':fmtInt(+String(raw).replace(/[^0-9.\-]/g,'')||0)}</td>`;
    case 'money':return `<td class="num${key==='ebit'?' t-strong':''}">${blank?'—':fmtM(numStr(raw).n)}</td>`;
    case 'price':return `<td class="num mono">${blank?'—':fmtPrice(numStr(raw).n)}</td>`;
    case 'pct':  { if(blank) return '<td class="num">—</td>'; const x=numStr(raw); return `<td class="num">${x.hasPct?esc(x.s):esc(x.s)+'%'}</td>`; }
    case 'pctsigned': { if(blank) return '<td class="num">—</td>'; const x=numStr(raw); return `<td class="num">${(x.n>0?'+':'')+esc(String(x.n))}%</td>`; }
    case 'ebitpct': { if(blank) return '<td class="num">—</td>'; const x=numStr(raw); return `<td class="num">${rampPill(x.n, x.hasPct?x.s:x.s+'%')}</td>`; }
    case 'spark':{ return `<td class="num" style="text-align:center">${sparkline(salesMonthlyOf(p),{name:p.name})}</td>`; }
    case 'cost': return `<td class="num costcol">${blank?fmtM(0):fmtM(numStr(raw).n)}</td>`;
    case 'check':return `<td class="actcol"><input type="checkbox" data-action="toggle-paction" data-pid="${p.id}" data-flag="${d.flag}" ${p[key]?'checked':''} title="${esc(d.label)}"></td>`;
    default:     return `<td class="t-sub">${blank?'—':esc(String(raw))}</td>`;
  }
}
function productRowHtml(p){

/* build the two header rows (grouping banner + column labels) from the current column order */
function productHeaderHtml(){
  const order=productColOrder(); const s=state.sort.health;
  const sortKeyMap={name:'name',ebit:'ebit',sales:'rev',ebitRev:'margin',avgPrice:'price',volume:'units',complexityScore:'complexity'};
  // grouping banner — runs of consecutive columns sharing a group label
  let sup=''; let i=0;
  while(i<order.length){ const g=(prodColDesc(order[i]).group)||''; let j=i+1; while(j<order.length && ((prodColDesc(order[j]).group)||'')===g) j++;
    const span=j-i; sup += g ? `<th colspan="${span}" class="${g==='Actions'?'actbar':'costbar'}">${esc(g)}</th>` : `<th colspan="${span}"></th>`;
    i=j; }
  const textTypes=new Set(['name','text','list','long','id']);
  const heads=order.map(key=>{ const d=prodColDesc(key); const cls=textTypes.has(d.type)?'':'num'; const extra=d.type==='cost'?' costcol':(d.type==='check'?' actcol':''); const sk=sortKeyMap[key];
    if(sk){ const arrow=s.key===sk?(s.dir<0?' ▾':' ▴'):''; return `<th class="sortable ${cls}" data-action="sort-health" data-val="${sk}">${esc(d.label)}${arrow}</th>`; }
    return `<th class="${cls}${extra}">${esc(d.label)}</th>`;
  }).join('');
  return `<tr class="superhead">${sup}</tr><tr>${heads}</tr>`;
}
/* Country drill-down — ONLY shown when the product carries real per-country rows (p.countries),

  return `<tr class="product-detail"><td colspan="${prodColspan()}" style="background:rgba(0,140,153,0.04);padding:0 14px 14px 34px">

/* ============================================================
   MERGED PROJECT PORTFOLIO VIEW (v2.1)
   ============================================================ */
const ROLE_LINE_COLORS={pm:'#008C99',swd:'#C98A2E',aero:'#3E7C8C',mech:'#2FA98C',ee:'#8E6FB0'};

/* --- profitability-weighted value & TTM/complexity --- */
// Default profit margin used when a candidate has no manual marginPct override.
const DEFAULT_CAND_MARGIN=0.12;
// helper: is a manual override value present (not null / not blank / numeric)?
function hasOverride(v){ return v!=null && v!=='' && !isNaN(+v); }
// Profit margin used for the NPV × Margin score. A per-candidate marginPct override (edited inline)
// wins; otherwise it falls back to the default candidate margin.
function candProfitability(c){ if(c && hasOverride(c.marginPct)) return (+c.marginPct)/100; return DEFAULT_CAND_MARGIN; }
function candMarginPct(c){ return hasOverride(c&&c.marginPct)? Math.round(+c.marginPct) : Math.round(candProfitability(c)*100); }
// NPV × Margin. A manual npvMargin override (edited inline) wins; otherwise NPV × margin%.
function npvProfit(c){ if(c && hasOverride(c.npvMargin)) return Math.round(+c.npvMargin); return Math.round((+c.npv||0)*candProfitability(c)); }
function ttmComplexity(c){ return Math.round((((c.s&&c.s.timing)||0)+((c.s&&c.s.complexity)||0))/2); }
/* Rough duration (months): derived inversely from the TTM & complexity score — a higher score
   means faster & more feasible, so fewer months. Illustrative range ~6–36 months. */
function roughDurationMonths(score){ score=Math.max(0,Math.min(100,+score||0)); return Math.round(6 + (100-score)/100*30); }
/* role-need helpers: total FTE across the 5 roles, and the FTE × (TTM & Cmplx) score */
function candFteTotal(c){ const rn=c.roleNeed||{}; return Object.keys(rn).reduce((a,k)=>a+(+rn[k]||0),0); }
function candFteScore(c){ return candFteTotal(c)*ttmComplexity(c); }
function candCapGaps(c){
  const gaps=new Set(c.missing||[]);
  (c.bricks||[]).forEach(id=>{ const b=brick(id); if(b && (b.maturity<2 || (b.importance==='High'&&b.maturity<3))) gaps.add(id); });
  return [...gaps];
}
/* Capability gaps (computed, col 14): compares the capability bricks on top with the bricks a
   candidate needs. A needed brick is RED if it is not in place (unknown, no FTE, or flagged
   missing) and YELLOW if fewer than 3 FTE hold that skill. Bricks with ≥3 FTE are fine. */
function candBrickGaps(c){
  const out=[]; const missing=new Set(c.missing||[]);
  (c.bricks||[]).forEach(id=>{
    const b=brick(id); const fte=b?fteCount(b):0;
    if(!b || fte===0 || missing.has(id)) out.push({id,name:b?b.name:id,level:'red'});
    else if(fte<3) out.push({id,name:b.name,level:'yellow'});
  });
  return out;
}

/* --- spend composition & scenario budgets --- */
/* "Consumed by" is a DYNAMIC set of €M categories. Four built-ins ship by default, but any number
   of extra categories (e.g. "Assets") can be added by uploading Consumed-by rows. directInvestment
   stays the reserved key that feeds the scenario money base. */
const SPEND_BUILTIN_LABELS={salaries:'Salaries', digitalTools:'Digital tools', otherFixed:'Other fixed', directInvestment:'Direct investment'};
const SPEND_BUILTIN_COLORS={salaries:'#3E7C8C', digitalTools:'#C98A2E', otherFixed:'#B7C6C6', directInvestment:'#008C99'};
const SPEND_EXTRA_PALETTE=['#6B8E9E','#D4A15E','#8FB0B0','#A88C4A','#5AA9B3','#C2B280','#7E9AA6','#B08D57'];
function spendKeys(){
  const comp=state.spendComp||{};
  const order=(Array.isArray(state.spendOrder)?state.spendOrder:[]).filter(k=>Object.prototype.hasOwnProperty.call(comp,k));
  Object.keys(comp).forEach(k=>{ if(order.indexOf(k)<0) order.push(k); });
  return order;
}
function spendLabelOf(key){ const ov=state.spendLabels&&state.spendLabels[key]; return ov||SPEND_BUILTIN_LABELS[key]||key; }
function spendColorOf(key){
  if(SPEND_BUILTIN_COLORS[key]) return SPEND_BUILTIN_COLORS[key];
  const extras=spendKeys().filter(k=>!SPEND_BUILTIN_COLORS[k]); const i=extras.indexOf(key);
  return SPEND_EXTRA_PALETTE[(i<0?0:i)%SPEND_EXTRA_PALETTE.length];
}
/* Normalise an uploaded Consumed-by item name to a stable key: known names map to built-in keys,
   anything else becomes a slug so it round-trips (e.g. "Assets" → "assets"). */
function spendKeyForItem(item){
  const norm=String(item||'').trim().toLowerCase(); if(!norm) return null;
  const alias={'salaries':'salaries','salary':'salaries','digital tools':'digitalTools','digitaltools':'digitalTools','other fixed':'otherFixed','otherfixed':'otherFixed','direct investment':'directInvestment','directinvestment':'directInvestment'};
  if(alias[norm]) return alias[norm];
  const slug=norm.replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  return slug||null;
}
function consumedTotal(){ const sc=state.spendComp||{}; return Object.keys(sc).reduce((a,k)=>a+(+sc[k]||0),0); }
function directInvestEuro(){ const sc=state.spendComp||{}; if(sc.directInvestment!=null) return Math.max(0, +sc.directInvestment||0); return spendUnallocEuro(); }
/* The "Unallocated" figure from the "Where the spend goes" table — the money base the manual
   scenario builder and the bubble-pick fit check spend against. Uses the manual override if the
   user set one, otherwise the computed remainder (envelope − total candidate spend). */
function spendUnallocEuro(){
  const ov=state.spendOv||{};
  if(ov.unalloc!=null) return Math.max(0, +ov.unalloc||0);
  const envTotal=envelopeCalc(state.envelope).total;
  const totCandSpend=CANDIDATES.reduce((a,c)=>a+(+c.spend||0),0);
  return Math.max(0, Math.round(envTotal-totCandSpend));
}
function directInvestPct(){ const t=consumedTotal(); return t>0? Math.round(directInvestEuro()/t*100):0; }
function totalFreeCapacity(){ return POOLS.reduce((a,p)=>a+p.avail.reduce((s,v,i)=>s+Math.max(0,v-(p.base[i]||0)),0),0); }

/* --- where the spend goes (blank = still investable) --- */
const PROJECT_TYPES=['NPD','Existing product update','platform','Tech','Mandatory','DtV','Other'];
function projectTypeOf(bucket){
  // legacy label maps onto the new split
  if(bucket==='Platform / tech') return 'platform';
  return PROJECT_TYPES.indexOf(bucket)>=0 ? bucket : 'Other';
}
/* Long-format rows (category,item,value €M) for the single "where the spend goes" upload/export.
   Covers all four blocks: unallocated money, by project type, by ecosystem, consumed by. */
function spendWhereRows(){
  const envTotal=envelopeCalc(state.envelope).total;
  const totCandSpend=CANDIDATES.reduce((a,c)=>a+(+c.spend||0),0);
  const ov=state.spendOv||{unalloc:null,byType:{},byEco:{}};
  const remComp=Math.max(0, Math.round(envTotal-totCandSpend));
  const byTypeComp={}; CANDIDATES.forEach(c=>{ const k=projectTypeOf(c.bucket); byTypeComp[k]=(byTypeComp[k]||0)+(+c.spend||0); });
  const byEcoComp={}; CANDIDATES.forEach(c=>{ const ids=(c.ecosystemIds&&c.ecosystemIds.length)?c.ecosystemIds:['(none)']; const k=ids.length; ids.forEach(id=>{ const nm=ecoName(id); byEcoComp[nm]=(byEcoComp[nm]||0)+(+c.spend||0)/k; }); });
  const byType=(ov.byType&&Object.keys(ov.byType).length)?ov.byType:byTypeComp;
  const byEco=(ov.byEco&&Object.keys(ov.byEco).length)?ov.byEco:byEcoComp;
  const sc=state.spendComp||{};
  const fin=x=>{ const n=+x; return Number.isFinite(n)?n:0; };   // never let NaN/Infinity reach the export
  const rows=[{category:'Unallocated', item:'Unallocated', value:fin(ov.unalloc!=null?ov.unalloc:remComp)}];
  Object.entries(byType).forEach(([k,v])=>rows.push({category:'By project type', item:k, value:Math.round(fin(v))}));
  Object.entries(byEco).forEach(([k,v])=>rows.push({category:'By ecosystem', item:k, value:Math.round(fin(v))}));
  spendKeys().forEach(k=>rows.push({category:'Consumed by', item:spendLabelOf(k), value:fin(sc[k])}));
  return rows;
}
/* Route a parsed long-format "where the spend goes" upload into the state overrides + consumed-by. */
function applySpendWhere(rows){
  const ov = state.spendOv || (state.spendOv={unalloc:null,byType:{},byEco:{}});
  let n=0;
  const newType={}, newEco={};
  // Consumed-by rows in the upload define the FULL new category set (so extra categories such as
  // "Assets" can be added and unwanted ones dropped — everything comes from the upload).
  const newComp={}, newOrder=[], newLabels={}; let anyConsumed=false;
  rows.forEach(r=>{
    const cat=String(r.category||'').trim().toLowerCase();
    const item=String(r.item||'').trim();
    const val=cleanNum(r.value);
    if(isNaN(val)||!cat) return;
    if(cat.indexOf('unalloc')>=0){ ov.unalloc=val; n++; }
    else if(cat.indexOf('project type')>=0||cat.indexOf('by type')>=0||cat==='type'){ if(item){ newType[item]=val; n++; } }
    else if(cat.indexOf('eco')>=0){ if(item){ newEco[item]=val; n++; } }
    else if(cat.indexOf('consum')>=0){
      const key=spendKeyForItem(item); if(!key) return;
      if(!(key in newComp)) newOrder.push(key);
      newComp[key]=val; newLabels[key]=item||spendLabelOf(key); anyConsumed=true; n++;
    }
  });
  if(Object.keys(newType).length) ov.byType=newType;
  if(Object.keys(newEco).length) ov.byEco=newEco;
  if(anyConsumed){ state.spendComp=newComp; state.spendOrder=newOrder; state.spendLabels=newLabels; }
  return n;
}
function spendWhereBlock(){
  const envTotal=envelopeCalc(state.envelope).total;
  const totCandSpend=CANDIDATES.reduce((a,c)=>a+(+c.spend||0),0);
  const ov=state.spendOv||{unalloc:null,byType:{},byEco:{}};
  // by project type — mapped to the fixed types (anything else → Other); unallocated excluded
  const byTypeComp={}; CANDIDATES.forEach(c=>{ const k=projectTypeOf(c.bucket); byTypeComp[k]=(byTypeComp[k]||0)+(+c.spend||0); });
  const typeOv = !!(ov.byType&&Object.keys(ov.byType).length);
  const byType = typeOv ? ov.byType : byTypeComp;
  const typeColors=Object.assign({}, BUCKET_COLORS, {'Other':'#9AA9A9'});
  // by ecosystem — unallocated excluded
  const byEcoComp={}, ecoCol={};
  CANDIDATES.forEach(c=>{ const ids=(c.ecosystemIds&&c.ecosystemIds.length)?c.ecosystemIds:['(none)']; const k=ids.length; ids.forEach(id=>{ const nm=ecoName(id); byEcoComp[nm]=(byEcoComp[nm]||0)+(+c.spend||0)/k; ecoCol[nm]=ecoColor(id); }); });
  const ecoOv = !!(ov.byEco&&Object.keys(ov.byEco).length);
  const byEco = ecoOv ? ov.byEco : byEcoComp;
  Object.keys(byEco).forEach(nm=>{ if(!ecoCol[nm]) ecoCol[nm]='#9AA9A9'; });
  const typeTot=Object.values(byType).reduce((a,b)=>a+(+b||0),0)||1;
  const ecoTot=Object.values(byEco).reduce((a,b)=>a+(+b||0),0)||1;
  const anyOv = (ov.unalloc!=null)||typeOv||ecoOv;
  // what the spend is consumed by — dynamic €M categories (imported via the "where the spend goes" input file)
  const sc=state.spendComp||{}; const compTot=consumedTotal();
  const comp={}, compColors={};
  spendKeys().forEach(k=>{ const lbl=spendLabelOf(k); comp[lbl]=+sc[k]||0; compColors[lbl]=spendColorOf(k); });
  // shared y-axis across all three column charts: the single tallest bar (any chart) tops the axis
  const yMaxAll=Math.max(1,
    ...Object.values(byType).map(v=>+v||0),
    ...Object.values(byEco).map(v=>+v||0),
    ...Object.values(comp).map(v=>+v||0));
  // THE spend total = the highest sum among the three breakdown graphs (by project type / by ecosystem /
  // consumed by). The consumed-by categories can exceed the envelope, so the reference figure shown for
  // the whole section always tracks the largest of the three so it never contradicts a breakdown.
  const rawType=Object.values(byType).reduce((a,b)=>a+(+b||0),0);
  const rawEco=Object.values(byEco).reduce((a,b)=>a+(+b||0),0);
  const spendTotal=Math.max(rawType,rawEco,compTot)||envTotal;
  const remComp=Math.max(0, Math.round(spendTotal-totCandSpend));
  const rem = ov.unalloc!=null ? ov.unalloc : remComp;
  const unallocPct = spendTotal>0 ? Math.round(rem/spendTotal*100) : 0;
  return `<div class="card mb">
    <div class="section-head"><h3 class="card-title">Where the spend goes</h3><div class="chip-row">${anyOv?'<button class="btn ghost sm" data-action="clear-spendov">Reset to computed</button>':''}</div></div>
    <div class="grid g4" style="align-items:start">
      <div style="border:1px solid var(--cardBorder);border-radius:14px;padding:16px;text-align:center;background:rgba(0,140,153,0.05)">
        <div class="k-label" style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)">Unallocated</div>
        <div style="font-size:32px;font-weight:800;color:var(--accent);margin:8px 0">${unallocPct}%</div>
        <div class="t-sub">${fmtM(rem)} of ${fmtM(spendTotal)}<br>not yet allocated to projects</div>
      </div>
      <div><div class="k-label" style="margin-bottom:8px;font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:-0.01em;text-align:center;color:var(--ink)">By project type</div>${spendColumns(byType,'#0E7C86',yMaxAll)}</div>
      <div><div class="k-label" style="margin-bottom:8px;font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:-0.01em;text-align:center;color:var(--ink)">By ecosystem</div>${spendColumns(byEco,'#C98A2E',yMaxAll)}</div>
      <div><div class="k-label" style="margin-bottom:8px;font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:-0.01em;text-align:center;color:var(--ink)">Consumed by</div>${spendColumns(comp,'#2E8B57',yMaxAll)}</div>
      </div>
    </div>
  </div>`;
}
