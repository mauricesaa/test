/* --- 24-month resource line charts --- */
function lineChart(series,n,title,badge,showLabels,opts){
  opts=opts||{};
  const interactive=!!opts.interactive; const revealId=opts.revealId||null; const scope=opts.scope||'';
  const anyLabels = showLabels || interactive;   // reserve headroom for point labels
  const W=900,H=anyLabels?232:200,pad={l:40,r:14,t:anyLabels?22:14,b:26}; const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const maxV=Math.max(1,...series.flatMap(s=>s.values));
  const X=i=> pad.l+(n<=1?0:(i/(n-1))*iw);
  const Y=v=> pad.t+(1-v/maxV)*ih;
  const grid=[0,.25,.5,.75,1].map(f=>{const y=pad.t+ih*(1-f);return `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${pad.l+iw}" y2="${y.toFixed(1)}" stroke="var(--cardBorder)" stroke-dasharray="3 3"/><text x="${pad.l-6}" y="${(y+3).toFixed(1)}" text-anchor="end" style="font-size:9px;fill:var(--muted2)">${Math.round(maxV*f)}</text>`;}).join('');
  let months=''; for(let i=0;i<n;i+=3){ months+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" style="font-size:9px;fill:var(--muted2)">M${i+1}</text>`; }
  const ptsOf=s=>s.values.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const lines=series.map(s=>{
    const revealed=interactive&&revealId===s.id; const dim=interactive&&revealId&&!revealed;
    return `<polyline points="${ptsOf(s)}" fill="none" stroke="${s.color}" stroke-width="${revealed?3:2}" stroke-linejoin="round" stroke-linecap="round" opacity="${dim?0.3:1}"/>`;
  }).join('');
  // wide transparent hit-lines drawn on top so a click anywhere near a line registers
  const hits = interactive ? series.map(s=>`<polyline points="${ptsOf(s)}" fill="none" stroke="transparent" stroke-width="16" data-action="reveal-free-line" data-scope="${scope}" data-val="${esc(s.id||'')}" style="cursor:pointer"><title>${esc(s.name)} — click to ${revealId===s.id?'hide':'show'} FTE per month</title></polyline>`).join('') : '';
  let pts='';
  const labelSeries = showLabels ? series : (interactive && revealId ? series.filter(s=>s.id===revealId) : []);
  labelSeries.forEach(s=>{ (s.values||[]).forEach((v,i)=>{ if(i%3!==0 && i!==n-1) return; const x=X(i), y=Y(v); pts+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="${s.color}"/><text x="${x.toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" style="font-size:7px;fill:${s.color};font-weight:600">${esc((s.labels&&s.labels[i])||v)}</text>`; }); });
  const legend=series.map(s=>{ const revealed=interactive&&revealId===s.id; const attr=interactive?` data-action="reveal-free-line" data-scope="${scope}" data-val="${esc(s.id||'')}" style="cursor:pointer${revealed?';box-shadow:0 0 0 2px '+s.color:''}"`:''; return `<span class="badge soft"${attr}><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span>`; }).join('');
  return `<div class="card mb"><div class="section-head"><h3 class="card-title">${esc(title)}</h3>${badge?`<span class="badge soft">${esc(badge)}</span>`:''}</div>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto">${grid}${months}${lines}${pts}${hits}</svg></div>
    <div class="chip-row" style="margin-top:8px">${legend}</div></div>`;
}
/* Pipeline demand per resource role = Σ over ALL project candidates (the full candidates table) of
   roleNeed[role] × (TTM & Complexity). This decomposes the "FTE × (TTM & Cmplx)" score by role and
   updates live whenever the project-candidates table is edited or imported. */
function pipelineRoleDemand(){
  const out={}; const rf=roleFields(); rf.forEach(f=>out[f.id]=0);
  CANDIDATES.forEach(c=>{ const tc=ttmComplexity(c); const rn=c.roleNeed||{}; rf.forEach(f=>{ out[f.id]+=(+rn[f.id]||0)*tc; }); });
  return {demand:out, count:CANDIDATES.length};
}
function resourceGraphs(){
  // Iterate the central role dictionary so every tool-wide role appears here — even roles that
  // only exist in the free-capacity heatmap (they show "no people" until people are uploaded).
  // This keeps the Resource Use and Free Capacity sections on the same role set.
  // Input = one row per PERSON with their weekly "hours booked" (see PEOPLE / WEEK_LABELS): a
  // fully-booked person = 40 h/week = 100% = 1.0 FTE. FTE per role = headcount (# of people rows);
  // utilisation = booked hours ÷ (headcount × 40 h), shown averaged over all weeks and the last week.
  const roster=roleFields();
  const allPeople=(typeof PEOPLE!=='undefined'&&PEOPLE)?PEOPLE:[];
  const rows=roster.map(f=>{
    const ppl=allPeople.filter(p=>p.roleId===f.id);
    const head=ppl.length; const empty = head===0;
    const W=ppl.reduce((m,p)=>Math.max(m,(p.hours||[]).length),0);
    let sumU=0,cntU=0;
    for(let w=0;w<W;w++){
      const booked=ppl.reduce((s,p)=>{ const h=+(p.hours&&p.hours[w]); return s+(isFinite(h)?h:0); },0);
      const cap=head*HOURS_FULL_WEEK;
      if(cap>0){ const u=booked/cap; sumU+=u; cntU++; }
    }
    const avgPct = cntU? Math.round((sumU/cntU)*100) : 0;
    // # of people in this role whose AVERAGE weekly utilisation is under 50%
    // (each person: mean of their booked hours across weeks ÷ 40 h).
    const lowCount = ppl.reduce((n,p)=>{
      const hrs=(p.hours||[]).map(h=>{ const x=+h; return isFinite(x)?x:0; });
      if(!hrs.length) return n;
      const meanH=hrs.reduce((a,b)=>a+b,0)/hrs.length;
      return n + (meanH < HOURS_FULL_WEEK*0.5 ? 1 : 0);
    },0);
    const fte = head;
    const pctClass = p => p>=90 ? 'red' : (p>=75 ? 'yellow' : 'green');
    const lowClass = (empty||head===0) ? 'soft' : (lowCount===0 ? 'green' : (lowCount>=Math.ceil(head/2) ? 'red' : 'yellow'));
    return `<tr>
      <td class="t-name"><span class="dot" style="background:${ROLE_LINE_COLORS[f.id]||roleColor(f.id)};display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px"></span>${esc(f.label)}${empty?' <span class="badge soft" title="No people booked to this role yet — add rows in the Resource use sheet to fill it" style="text-transform:none;letter-spacing:0">no people</span>':''}</td>
      <td class="num t-strong">${empty?'—':fte}</td>
      <td class="num">${empty?'<span class="t-sub">—</span>':`<span class="badge ${pctClass(avgPct)}">${avgPct}%</span>`}</td>
      <td class="num">${empty?'<span class="t-sub">—</span>':`<span class="badge ${lowClass}">${lowCount} of ${head}</span>`}</td>
    </tr>`;
  }).join('');
  const totalPeople=allPeople.length;
  return `<div class="card mb">
    <div class="section-head"><h3 class="card-title">Resource use — capacity by role</h3>
      <div class="chip-row"><span class="badge soft">${roster.length} roles · ${totalPeople} people</span></div>
    </div>
    <div class="tablewrap"><table>
      <tr><th>Role</th><th class="num">FTE per role</th><th class="num">Avg staffing — all weeks</th><th class="num">People under 50% per role</th></tr>
      ${rows}
    </table></div>
    <div class="hint" style="margin-top:10px"><b>FTE per role</b> = number of people booked to that role (one row per person; a fully-booked person = ${HOURS_FULL_WEEK} h/week = 100% = 1.0 FTE). <b>Avg staffing</b> = booked hours ÷ (headcount × ${HOURS_FULL_WEEK} h), averaged across <b>all weeks</b> (green &lt;75%, amber 75–89%, red ≥90%). <b>People under 50%</b> = how many people in the role have an <b>average</b> weekly booking below 50% (i.e. under ${HOURS_FULL_WEEK*0.5} h/week on average), shown as <i>count of headcount</i> (green = none under-booked, red = at least half). Upload people and their weekly <b>hours booked</b> via the <b>Resource use</b> sheet. Roles come from the tool-wide role dictionary, so this shows the <b>same role set as the Free Capacity heatmap</b> — a role with no people yet appears as "no people". All figures are illustrative.</div>
  </div>`;
}
/* Free-capacity heatmap: Y = roles, X = next 200 weeks, cell = free resources that week. */
function freeCapHeatmap(){
  // Iterate the central role dictionary (same roster as Resource Use). Week values are read from
  // the FREECAP data by id; a role with no heatmap row yet shows a row of zeros, so any role added
  // via a resource-capacity or candidate upload is automatically included here too.
  const weeks=FREECAP_WEEKS, roles=roleFields();
  const wkOf=id=>{ const r=byId(FREECAP, id); return (r&&Array.isArray(r.week))?r.week:[]; };
  const maxV=Math.max(1,...roles.flatMap(f=>wkOf(f.id)));
  const cell=v=>{ v=+v||0; const t=v/maxV; return `<td class="fc-cell" style="background:${fcHeatColor(t)};color:${t>0.62?'#fff':'var(--text)'}" title="${v} free">${v}</td>`; };
  let headCols=''; for(let w=0;w<weeks;w++){ headCols+=`<th class="fc-wk" title="${planWeekTitle(w)}">${planWeekLabel(w)}</th>`; }
  const body=roles.map(f=>{ const wk=wkOf(f.id); let cells=''; for(let w=0;w<weeks;w++){ cells+=cell(wk[w]); } return `<tr><th class="fc-role">${esc(f.label)}</th>${cells}</tr>`; }).join('');
  return `<div class="card mb">
    <style>
      .fc-table{border-collapse:separate;border-spacing:0;font-size:10px}
      .fc-table th,.fc-table td{padding:0;text-align:center;box-sizing:border-box}
      .fc-table .fc-wk{position:sticky;top:0;z-index:2;background:var(--card);min-width:28px;width:28px;height:26px;font-size:9px;font-weight:600;color:var(--muted2);border-bottom:1px solid var(--cardBorder)}
      .fc-table .fc-role{position:sticky;left:0;z-index:3;background:var(--card);text-align:left;padding:0 10px;min-width:150px;white-space:nowrap;font-weight:600;border-right:1px solid var(--cardBorder)}
      .fc-table .fc-corner{position:sticky;top:0;left:0;z-index:4;background:var(--card);border-bottom:1px solid var(--cardBorder)}
      .fc-table .fc-cell{min-width:28px;width:28px;height:26px;font-weight:600;border-right:1px solid rgba(255,255,255,0.45);border-bottom:1px solid rgba(255,255,255,0.45)}
    </style>
    <div class="section-head"><h3 class="card-title">Resource free capacity — heatmap</h3>
      <div class="chip-row"><span class="badge soft">${roles.length} roles × ${weeks} weeks</span></div>
    </div>
    <div class="hint" style="margin-bottom:10px">Each quadrant shows the number of <b>free resources</b> for that role in that week — ${roles.length} illustrative roles × the next ${weeks} weeks (${(roles.length*weeks).toLocaleString()} quadrants). Darker = more spare capacity. Scroll right to see all ${weeks} weeks; roles and values update when you upload an input file.</div>
    <div style="overflow:auto;max-height:520px;border:1px solid var(--cardBorder);border-radius:12px">
      <table class="fc-table"><thead><tr><th class="fc-role fc-corner" title="Week columns are labelled YY'WW — e.g. 26'20 = year 2026, ISO week 20">Role \\ Week</th>${headCols}</tr></thead><tbody>${body}</tbody></table>
    </div>
  </div>`;
}

function trunc(s,n){ s=(s==null?'':String(s)); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function canvasCell(v, full){

/* value a candidate contributes to a given sortable (numeric) column — used for click-to-sort */
function candSortVal(c, key){
  switch(key){
    case 'npv': return +c.npv||0;
    case 'marginPct': return candMarginPct(c);
    case 'npvMargin': return npvProfit(c);
    case 'duration': return roughDurationMonths(ttmComplexity(c));
    case 'ttm': return ttmComplexity(c);
    case 'spend': return +c.spend||0;
    case 'fteScore': return candFteScore(c);
    default:
      if(key.indexOf('role:')===0){ const rid=key.slice(5); return (c.roleNeed&&c.roleNeed[rid])||0; }
      if(key.indexOf('extra:')===0){ const col=key.slice(6); const n=parseFloat(c[col]); return Number.isFinite(n)?n:-Infinity; }
      return 0;
  }
}
function candidatesTableHead(withPick){
  const s = withPick ? (state.candSort||{}) : {};

    if(!withPick) return `<th class="num">${label}</th>`;

    return `<th class="num sortable" data-action="sort-cand" data-sortkey="${key}" style="cursor:pointer;user-select:none;white-space:nowrap" title="Click to sort by ${label.replace(/&amp;/g,'&')} (numeric)">${label}<span class="t-sub" style="font-weight:400">${arrow}</span></th>`;
  };
  return `<tr>`+
    `${withPick?'<th class="num" title="Tick to add to the manual scenario builder">Scenario</th>':''}`+

    numTh('NPV','npv')+numTh('Margin %','marginPct')+numTh('NPV × Margin','npvMargin')+numTh('Rough duration','duration')+numTh('TTM &amp; Cmplx','ttm')+numTh('Investment','spend')+
    roleFields().map(f=>numTh(esc(f.label),'role:'+f.id)).join('')+

/* TTM & complexity score for a product's DtV candidate — the product's own complexity score

function dtvManualRole(pid, rid){ const m=state.dtvManual&&state.dtvManual[pid]; return (m&&m.roleNeed&&m.roleNeed[rid]!=null)?(+m.roleNeed[rid]||0):0; }
function dtvManualTotal(pid){ const m=state.dtvManual&&state.dtvManual[pid]; if(!m||!m.roleNeed) return 0; return Object.keys(m.roleNeed).reduce((a,k)=>a+(+m.roleNeed[k]||0),0); }
function dtvManualDur(p){ const m=state.dtvManual&&state.dtvManual[p.id]; return (m&&m.durationMonths!=null)?(+m.durationMonths||1):roughDurationMonths(dtvTtmCmplx(p)); }

function dtvFteScore(p){ return dtvFte(p)*dtvTtmCmplx(p); }

/* --- scenario builder: 4 levers × 5 ranked combinations --- */
const SCEN_COLS=[
  {key:'base', title:'Top combinations — current resources & investment', resMul:1,    moneyMul:1},
  {key:'both', title:'+15% resources & +15% money investment',           resMul:1.15, moneyMul:1.15},
  {key:'res',  title:'+15% resources',                                    resMul:1.15, moneyMul:1},
  {key:'money',title:'+15% money investment',                             resMul:1,    moneyMul:1.15}
];
const SCEN_HEURISTICS=[
  c=>valuePerEuro(c),
  c=>totalCap(c)>0? c.npv/totalCap(c) : c.npv,
  c=>c.npv,
  c=>candidateScore(c),
  c=>(c.s&&c.s.strategicFit)||0,
  c=>riskAdjValue(c),
  c=>(c.s&&c.s.financialValue)||0,
  c=>(c.s&&c.s.customerValue)||0,
  c=>-totalCap(c)
];
function greedySet(resBudget,moneyBudget,priorityFn){
  const locked=CANDIDATES.filter(c=>c.locked);
  const sel=new Set(locked.map(c=>c.id));
  let res=locked.reduce((a,c)=>a+totalCap(c),0), money=locked.reduce((a,c)=>a+(+c.spend||0),0);
  CANDIDATES.filter(c=>!c.locked).slice().sort((a,b)=>priorityFn(b)-priorityFn(a)).forEach(c=>{
    const e=totalCap(c), m=(+c.spend||0);
    if(res+e<=resBudget && money+m<=moneyBudget){ sel.add(c.id); res+=e; money+=m; }
  });
  return [...sel];
}
function scenarioMetrics(ids){
  const sel=ids.map(candidate).filter(Boolean);
  const value=sel.reduce((a,c)=>a+(+c.npv||0),0);
  const effort=sel.reduce((a,c)=>a+totalCap(c),0);
  const money=sel.reduce((a,c)=>a+(+c.spend||0),0);
  return {sel, value, effort, money, ratio: effort>0? value/effort : value};
}
function buildScenarioColumn(col){
  const resB=totalFreeCapacity()*col.resMul, moneyB=directInvestEuro()*col.moneyMul;
  const seen=new Set(), scens=[];
  for(const h of SCEN_HEURISTICS){ const ids=greedySet(resB,moneyB,h); const sig=ids.slice().sort().join(','); if(seen.has(sig))continue; seen.add(sig); scens.push(scenarioMetrics(ids)); }
  scens.sort((a,b)=>b.ratio-a.ratio);
  return scens.slice(0,5);
}
function miniOppMap(m){

  }).join('');

    ${bubbles}

}
function scenarioColumnHtml(col){

/* ============================================================
   RESOURCE & CAPITAL IMPACT — weekly planner (new section)
   Horizon: PLAN_WEEKS weeks starting from the CURRENT ISO week. Roles reuse the five
   resource roles. Ongoing (in-flight) projects are illustrative; selected project
   candidates are added automatically with a duration derived from "Rough duration".
   Per-role weekly FTE is editable (state.weeklyFte) and refreshable to the proposed
   values. Remaining free capacity per week is shown with a traffic-light indicator.
   All figures are illustrative / fictional.
   ============================================================ */
const PLAN_WEEKS=200;
/* NOTE: weekly capacity now comes live from the free-capacity heatmap (FREECAP) via
   roleCapWeek(roleId, week) — see the dynamic role helpers near the candidate seed data.
   There is no longer a separate hardcoded capacity constant. */
/* ISO-8601 week number + year for a date */
function isoWeekOf(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const fday=(firstThu.getUTCDay()+6)%7; firstThu.setUTCDate(firstThu.getUTCDate()-fday+3);
  const week=1+Math.round((t-firstThu)/6048e5);
  return {week, year:t.getUTCFullYear()};
}
/* Monday of the week that contains d */
function mondayOf(d){ const t=new Date(d); const day=(t.getDay()+6)%7; t.setDate(t.getDate()-day); t.setHours(0,0,0,0); return t; }
/* label for week index i (0 = current calendar week). Format YY'WW — e.g. 26'20 = year 2026, ISO week 20. */
function planWeekLabel(i){ const base=mondayOf(new Date()); const dt=new Date(base); dt.setDate(dt.getDate()+i*7); const iw=isoWeekOf(dt); return String(iw.year).slice(2)+"'"+String(iw.week).padStart(2,'0'); }
/* verbose tooltip for a week index — e.g. "ISO week 20 · 2026" */
function planWeekTitle(i){ const base=mondayOf(new Date()); const dt=new Date(base); dt.setDate(dt.getDate()+i*7); const iw=isoWeekOf(dt); return 'ISO week '+iw.week+' · '+iw.year; }
/* timeline projects = ONLY the project candidates ticked in the manual scenario builder above.
   No ongoing/in-flight projects — this view is purely for slotting NEW projects into the
   free resource capacity and budget. Each project's start week can be shifted (state.planStart)
   by double-clicking it on the chart and dragging it left/right. */
function planProjects(){
  const cands=(state.manualScenario||[]).map(candidate).filter(Boolean).map(c=>{
    const dur=Math.max(1,Math.round(roughDurationMonths(ttmComplexity(c))*(52/12)));
    const sB=(state.planStart&&state.planStart[c.id]!=null)?state.planStart[c.id]:0;
    const start=Math.max(0,Math.min(PLAN_WEEKS-1,sB));
    return { id:c.id, name:c.name, kind:'cand', start, end:Math.min(PLAN_WEEKS,start+dur), dur, base:c.roleNeed||{} };
  });
  // DtV products ticked in the DtV table (state.manualDtv) — use their manual per-role FTE + duration.
  // Keyed 'dtvp-'+id so planStart / weeklyFte never collide with a 'dtv-'+id candidate of the same product.
  const dtvs=(state.manualDtv||[]).map(pid=>{
    const p=product(pid); if(!p) return null;
    const key='dtvp-'+pid;
    const dur=Math.max(1,Math.round((+dtvManualDur(p)||1)*(52/12)));
    const sB=(state.planStart&&state.planStart[key]!=null)?state.planStart[key]:0;
    const start=Math.max(0,Math.min(PLAN_WEEKS-1,sB));
    const man=(state.dtvManual&&state.dtvManual[pid])||{};
    return { id:key, name:p.name+' · DtV', kind:'dtv', start, end:Math.min(PLAN_WEEKS,start+dur), dur, base:(man.roleNeed||{}) };
  }).filter(Boolean);
  return [...cands, ...dtvs];
}
/* effective uniform per-role weekly FTE for a project — override (state.weeklyFte) else proposed base.
   Used for the editable left-panel inputs (the "apply to every week" value). */
function planEffNeed(p){
  const ov=(state.weeklyFte||{})[p.id]||{}; const out={};
  roleFields().forEach(f=>{ const b=(p.base&&+p.base[f.id])||0; out[f.id]=(ov[f.id]!=null)?ov[f.id]:b; });
  return out;
}
/* effective FTE for ONE role in ONE week — precedence: per-week override → uniform override → base.
   This is what the stacked bars render and what drag-to-fill / click-edit write to. */
function planWeekVal(p, roleId, w){
  const prof=((state.weeklyProfile||{})[p.id]||{})[roleId];
  if(prof && prof[w]!=null) return prof[w];
  const ov=(state.weeklyFte||{})[p.id]||{};
  if(ov[roleId]!=null) return ov[roleId];
  return (p.base&&+p.base[roleId])||0;
}
/* per-role FTE for a project in a given week */
function planEffNeedWeek(p, w){ const out={}; roleFields().forEach(f=>{ out[f.id]=planWeekVal(p,f.id,w); }); return out; }
/* whether a project has any per-week overrides still in effect */
function planHasProfile(pid){ const wp=(state.weeklyProfile||{})[pid]; return !!(wp && Object.keys(wp).some(r=>wp[r]&&Object.keys(wp[r]).length)); }
/* per-week per-role demand across all projects on the timeline */
function planDemandByWeek(projects){
  const dem=[];
  const rf=roleFields();
  for(let w=0;w<PLAN_WEEKS;w++){ const o={}; rf.forEach(f=>o[f.id]=0);
    projects.forEach(p=>{ if(w>=p.start&&w<p.end){ rf.forEach(f=>o[f.id]+=planWeekVal(p,f.id,w)); } });
    dem.push(o); }
  return dem;
}
function resourceCapitalImpact(){
  const projects=planProjects();
  const demand=planDemandByWeek(projects);
  const rf=roleFields();                              // dynamic roster: heatmap roles ∪ orphan candidate roles
  const colorMap={}; rf.forEach(f=>colorMap[f.id]=roleColor(f.id));
  let capNow=0; rf.forEach(f=>capNow+=roleCapWeek(f.id,0));   // ≈ total capacity this week (from heatmap)
  // ---- capital view (exact euros) ----
  const availM=spendUnallocEuro();
  const selCands=(state.manualScenario||[]).map(candidate).filter(Boolean);
  const allocM=selCands.reduce((a,c)=>a+(+c.spend||0),0);
  const freeCapM=availM-allocM;
  // ---- per-role remaining capacity per week = roleCapWeek(role,w) − demand(role,w). Rendered as a STACKED
  //      chart in the bottom band: positive = spare (stacked up in the role colour), negative = shortage
  //      (dips below the baseline in the role colour). A role a candidate needs that is absent from the
  //      heatmap has capacity 0 → its bar always sits below the line. Fixed-height band; no traffic light. ----
  const remainAt=(fid,w)=>roleCapWeek(fid,w)-(demand[w][fid]||0);
  const spanStart=projects.length?Math.min.apply(null,projects.map(p=>p.start)):0;
  const spanEnd  =projects.length?Math.max.apply(null,projects.map(p=>p.end)):0;
  const spanLen=Math.max(0,spanEnd-spanStart);
  // Scale + shortage stats span the FULL horizon so the free-capacity band is always visible
  // for every week, not only where a project sits.
  let maxSpare=1, maxShort=1, shortWeeks=0;
  for(let w=0;w<PLAN_WEEKS;w++){ let up=0,dn=0,short=false;
    rf.forEach(f=>{ const r=remainAt(f.id,w); if(r>0) up+=r; else if(r<0){ dn+=-r; short=true; } });
    if(up>maxSpare)maxSpare=up; if(dn>maxShort)maxShort=dn; if(short)shortWeeks++;
  }
  // ---- per-role gap detection across the horizon (worst shortfall + weeks short); missing heatmap role flagged ----
  const roleGaps=[];
  rf.forEach(f=>{ let worst=0, wks=0, hasDemand=false;
    for(let w=0;w<PLAN_WEEKS;w++){ const dem=demand[w][f.id]||0; if(dem>0){ hasDemand=true; const spare=roleCapWeek(f.id,w)-dem; if(spare<0){ wks++; if(spare<worst) worst=spare; } } }
    if(hasDemand && wks>0) roleGaps.push({id:f.id, label:f.label, gap:-worst, weeks:wks, missing:!byId(FREECAP,f.id)});
  });
  roleGaps.sort((a,b)=>b.gap-a.gap);
  const gapNote=roleGaps.length? roleGaps.map(g=>`${esc(g.label)}${g.missing?' (not in heatmap)':''} −${g.gap} FTE · ${g.weeks} wk`).join(' · ') : '';
  // global stack max for comparable project bars (across every week, since values can now vary weekly)
  let maxStack=1; projects.forEach(p=>{ for(let w=p.start;w<p.end;w++){ let tot=0; rf.forEach(f=>tot+=planWeekVal(p,f.id,w)); if(tot>maxStack)maxStack=tot; } });
  // ---- geometry ----
  const COLW=6, ROWH=40, AXH=26, FREEH=98, DIVH=15, W=PLAN_WEEKS*COLW, LW=210;
  const DIVSTYLE=`border-top:2px solid var(--text);border-bottom:1px solid var(--cardBorder);background:rgba(0,140,153,0.06)`;
  // ---- left panel (project name only) ----
  let leftRows=`<div style="height:${AXH}px;display:flex;align-items:center;font-size:11px;font-weight:700;color:var(--muted2);padding:0 12px">Project</div>`;
  projects.forEach(p=>{
    const edited=!!(state.weeklyFte||{})[p.id] || planHasProfile(p.id);
    const moving=(moveModePid===p.id);
    leftRows+=`<div style="height:${ROWH}px;border-top:1px solid var(--cardBorder);padding:0 12px;display:flex;align-items:center;gap:6px${moving?';background:rgba(45,128,237,.08)':''}">
      <span class="t-strong" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span>
      ${moving?'<span class="badge" style="text-transform:none;letter-spacing:0;background:var(--accent);color:#fff">moving</span>':''}
      ${edited?'<span class="badge yellow" style="text-transform:none;letter-spacing:0">edited</span>':''}
      <button class="btn ghost sm" data-action="refresh-weekly-fte" data-pid="${p.id}" title="Reset this project's weekly FTE and timeline position to its proposed values" style="margin-left:auto;padding:1px 8px;font-size:11px">Refresh</button>
    </div>`;
  });
  leftRows+=`<div style="height:${DIVH}px;${DIVSTYLE};display:flex;align-items:center;padding:0 12px"><span style="font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted2)">Free capacity lane</span></div>`;
  leftRows+=`<div style="min-height:${FREEH}px;padding:8px 12px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px">
    <span class="t-strong" style="font-size:12px">Free capacity / week · per role</span>
    <span class="t-sub" style="font-size:11px">Remaining heatmap capacity after the selected demand, stacked by role (≈${capNow} FTE/wk now). Below the line = shortage.</span>
    <span class="t-sub" style="font-size:11px">${spanLen?`${shortWeeks} of ${spanLen} weeks have a role in shortage.`:'No project candidates selected yet.'}</span>
    ${roleGaps.length?`<span class="t-sub" title="Gaps: ${gapNote}" style="font-size:11px;color:var(--red);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">Gaps: ${gapNote}</span>`:''}
  </div>`;
  // ---- right panel (scrollable): axis + stacked bars per project + free-capacity bars ----
  let ticks=''; for(let w=0;w<PLAN_WEEKS;w+=8){ ticks+=`<line x1="${w*COLW}" y1="${AXH-6}" x2="${w*COLW}" y2="${AXH}" stroke="#c9d3dd"/><text x="${w*COLW+2}" y="${AXH-9}" font-size="9" fill="#8895a7">${planWeekLabel(w)}</text>`; }
  const axisSvg=`<svg width="${W}" height="${AXH}" style="display:block">${ticks}</svg>`;
  const barH=ROWH-14;
  let stripSvgs='';
  projects.forEach(p=>{
    let rects='';
    for(let w=p.start;w<p.end;w++){
      let yb=ROWH-5;
      rf.forEach(f=>{ const val=planWeekVal(p,f.id,w); if(val<=0)return; const h=(val/maxStack)*barH; yb-=h; rects+=`<rect class="wk-seg" data-role="${f.id}" data-week="${w}" data-val="${val}" x="${w*COLW}" y="${yb.toFixed(1)}" width="${COLW-1}" height="${h.toFixed(1)}" fill="${colorMap[f.id]}"><title>${esc(p.name)} · ${planWeekLabel(w)} · ${esc(f.label)} ${val} FTE — click to edit, drag to fill</title></rect>`; });
    }
    const moving=(moveModePid===p.id);
    stripSvgs+=`<svg data-pid="${p.id}" data-colw="${COLW}" data-start="${p.start}" data-end="${p.end}" data-dur="${p.dur}" width="${W}" height="${ROWH}" style="display:block;border-top:1px solid var(--cardBorder);cursor:${moving?'grab':'ew-resize'};touch-action:none${moving?';background:rgba(45,128,237,.10);outline:1.5px dashed var(--accent);outline-offset:-2px':''}"><title>${esc(p.name)} — double-click to ${moving?'exit move mode':'move this project'}${moving?', then drag left/right':''}</title>${rects}</svg>`;
  });

  const spareH=2*barH, baseY=6+spareH, shortH=FREEH-baseY-6;

    });
  }
  const freeSvg=`<svg width="${W}" height="${FREEH}" style="display:block">${freeRects}</svg>`;
  const dividerSpacer=`<div style="height:${DIVH}px;${DIVSTYLE}"></div>`;
  const rightInner=`<div style="width:${W}px">${axisSvg}${stripSvgs}${dividerSpacer}${freeSvg}</div>`;
  // ---- legends ----
  const roleLegend=rf.map(f=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px"><span style="width:11px;height:11px;border-radius:2px;background:${colorMap[f.id]};display:inline-block"></span>${esc(f.label)}</span>`).join('');
  return `<div class="card mb">
    <div class="section-head"><h3 class="card-title">Resource &amp; capital impact</h3>
      <span class="badge soft">${PLAN_WEEKS} weeks · from ${planWeekLabel(0)}</span></div>
    <div class="hint" style="margin-bottom:12px">This view is purely for slotting <b>new</b> project candidates into your free resource capacity and budget — only candidates you tick in the <b>Scenario</b> column above appear here (no ongoing projects). Capital is shown as an exact figure; each selected candidate's required investment is deducted automatically. Tune the weekly load on the chart: <b>click a coloured block</b> to edit that single week, or <b>drag it left/right</b> to paint the same FTE across a range of weeks. To reschedule a whole project, <b>double-click it</b> to enter move mode, then <b>drag it left/right</b> to move it earlier or later (Esc or double-click again to exit). Press <b>Refresh</b> to restore a project's proposed values and position. The bottom band shows <b>free capacity per role per week</b>, stacked and coloured by role: it takes the <b>live per-week capacity from the free-capacity heatmap above</b> and subtracts demand, so spare capacity stacks up and any shortage dips below the line. Roles are read dynamically, so a role a candidate needs that isn't in the heatmap shows up as a shortage. All figures are illustrative.</div>
    <div class="k-label" style="margin-bottom:6px">Weekly resource overview · ${projects.length} selected project candidate${projects.length===1?'':'s'}</div>
    ${projects.length===0?`<div class="hint" style="margin:0 0 8px;padding:10px 14px;border:1px dashed var(--cardBorder);border-radius:10px;background:var(--card)">No project candidates selected yet — tick candidates in the <b>Scenario</b> column above to slot them into the free capacity and budget below.</div>`:''}
    <div style="display:flex;border:1px solid var(--cardBorder);border-radius:12px;overflow:hidden;background:var(--card)">
      <div style="flex:0 0 ${LW}px;border-right:1px solid var(--cardBorder)">${leftRows}</div>

/* ---------- Pipeline: opportunity map + candidates ---------- */
/* ---- Bubble pick + scenario fit (shared by BOTH opportunity maps) ----
   Clicking a bubble toggles it into the manual scenario selection (same set the tables tick).
   Selected bubbles get a coloured ring: GREEN while the cumulative selection still fits the
   available direct-investment budget AND the free resource pool; ORANGE (amber) once a pick
   tips either constraint over. Order of selection lives in state.pickOrder so the pick that
   causes the overflow is the one that turns orange. Fit is evaluated across BOTH charts. */
/* reconcile the click-order list with the current selection sets (handles picks made via the
   table checkboxes too, and drops anything no longer selected), then return it. */
function pickOrderList(){
  if(!Array.isArray(state.pickOrder)) state.pickOrder=[];
  (state.manualScenario||[]).forEach(id=>{ const k='proj:'+id; if(!state.pickOrder.includes(k)) state.pickOrder.push(k); });
  (state.manualDtv||[]).forEach(id=>{ const k='dtv:'+id; if(!state.pickOrder.includes(k)) state.pickOrder.push(k); });
  state.pickOrder=state.pickOrder.filter(k=>{ const i=k.indexOf(':'); const t=k.slice(0,i), id=k.slice(i+1); return t==='proj'?(state.manualScenario||[]).includes(id):(state.manualDtv||[]).includes(id); });
  return state.pickOrder;
}
/* map of pick key -> 'ok' | 'over', walking the selection in click order and accumulating spend.
   Fit is judged on the direct-investment BUDGET only. (DtV picks carry no separate spend figure.) */
function scenarioFit(){
  const budget=spendUnallocEuro();
  let usedMoney=0; const out={};
  pickOrderList().forEach(k=>{
    const i=k.indexOf(':'); const type=k.slice(0,i), id=k.slice(i+1);
    // DtV picks require no investment, so they never push the scenario over budget — always green.
    if(type==='dtv'){ out[k]='ok'; return; }
    const c=candidate(id); if(!c) return; usedMoney+=(+c.spend||0);
    out[k]=(usedMoney<=budget)?'ok':'over';
  });
  return out;
}
/* ring colour for a selected bubble (empty string = not selected, no ring) */
function bubbleFitColor(sel,status){ return !sel?'':(status==='over'?'var(--yellow)':'var(--green)'); }
function oppMatrix(){
  const W=680,H=396,pad={l:66,r:24,t:18,b:60};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const cands=[...CANDIDATES];
  const maxSpend=Math.max(...cands.map(c=>+c.spend||0),1);
  const maxScore=Math.max(...cands.map(candFteScore),1);            // FTE × (TTM & Cmplx) — matches the table column
  const maxVal=Math.max(...cands.map(c=>npvProfit(c)),1);
  const X=f=>pad.l+(Math.max(0,Math.min(100,f))/100)*iw;            // TTM & Cmplx 0–100 (right is high)
  const Y=v=>pad.t+(1-Math.max(0,Math.min(1,(+v||0)/maxVal)))*ih;   // NPV × margin, top = highest NPV
  const invR=s=>7+Math.sqrt((+s||0)/maxSpend)*20;                   // investment needed
  const resR=e=>5+Math.sqrt((+e||0)/maxScore)*20;                   // resource needs = FTE × (TTM & Cmplx)
  const tick='style="font-size:10px;fill:var(--muted2);font-family:var(--sans)"';
  // 9-quadrant grid: split both axes into thirds
  const vy1=pad.t+ih/3, vy2=pad.t+2*ih/3, vx1=X(100/3), vx2=X(200/3);
  const gridLines=
    `<line x1="${vx1.toFixed(1)}" y1="${pad.t}" x2="${vx1.toFixed(1)}" y2="${pad.t+ih}" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>`+
    `<line x1="${vx2.toFixed(1)}" y1="${pad.t}" x2="${vx2.toFixed(1)}" y2="${pad.t+ih}" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>`+
    `<line x1="${pad.l}" y1="${vy1.toFixed(1)}" x2="${pad.l+iw}" y2="${vy1.toFixed(1)}" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>`+
    `<line x1="${pad.l}" y1="${vy2.toFixed(1)}" x2="${pad.l+iw}" y2="${vy2.toFixed(1)}" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>`;
  // Quadrant shading: turquoise builds toward the top-right (high value × high feasibility),
  // fades through lighter turquoise around it, and the bottom-left cell is left unfilled.
  const cellW=iw/3, cellH=ih/3;
  const quadFill=(col,row)=>{ const d=col+(2-row);   // 0 = bottom-left … 4 = top-right
    return d>=4?'rgba(64,196,180,0.30)':d===3?'rgba(64,196,180,0.18)':d===2?'rgba(64,196,180,0.10)':d===1?'rgba(64,196,180,0.045)':'none'; };
  let quadRects='';
  for(let row=0;row<3;row++){ for(let col=0;col<3;col++){ const f=quadFill(col,row); if(f==='none')continue;
    quadRects+=`<rect x="${(pad.l+col*cellW).toFixed(1)}" y="${(pad.t+row*cellH).toFixed(1)}" width="${cellW.toFixed(1)}" height="${cellH.toFixed(1)}" fill="${f}"/>`; } }
  // Y ticks: 0, ⅓·max, ⅔·max, max (axis always anchored at 0 at the bottom)
  const yTicks=[{v:maxVal,y:pad.t},{v:Math.round(maxVal*2/3),y:vy1},{v:Math.round(maxVal/3),y:vy2},{v:0,y:pad.t+ih}]
    .map(t=>`<text ${tick} x="${(pad.l-8).toFixed(1)}" y="${(t.y+3).toFixed(1)}" text-anchor="end">${esc(fmtM(t.v))}</text>`).join('');
  // X ticks: 0, 33, 66, 100 (axis always anchored at 0 on the left)
  const xTicks=[{v:0,x:pad.l},{v:33,x:vx1},{v:66,x:vx2},{v:100,x:pad.l+iw}]
    .map(t=>`<text ${tick} x="${t.x.toFixed(1)}" y="${(pad.t+ih+16).toFixed(1)}" text-anchor="middle">${t.v}</text>`).join('');
  const fit=scenarioFit();
  const bubbles=cands.sort((a,b)=>(+b.spend||0)-(+a.spend||0)).map(c=>{
    const x=X(ttmComplexity(c)), y=Y(npvProfit(c));
    const sel=(state.manualScenario||[]).includes(c.id);
    const ringC=bubbleFitColor(sel,fit['proj:'+c.id]);
    const rMax=Math.max(invR(c.spend),resR(candFteScore(c)))+5;
    const selRing=sel?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rMax.toFixed(1)}" fill="${ringC}" fill-opacity="0.10" stroke="${ringC}" stroke-width="3"/>`:'';
    return `<g data-action="pick-bubble-proj" data-val="${c.id}" style="cursor:pointer">
      ${selRing}
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${invR(c.spend).toFixed(1)}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${resR(candFteScore(c)).toFixed(1)}" fill="none" stroke="var(--muted2)" stroke-width="1.4" stroke-dasharray="3 2"/>
      <text class="bubble-label" x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" style="font-weight:700">${esc(c.id.toUpperCase())}</text></g>`;
  }).join('');
  return `<div class="card mb"><div class="section-head"><h3 class="card-title">Opportunity map</h3><span class="badge soft">${cands.length} candidates · 9 quadrants</span></div>
  <div style="max-width:820px;margin:0 auto"><svg class="matrix-svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${quadRects}
    ${gridLines}
    <line x1="${pad.l}" y1="${pad.t+ih}" x2="${pad.l+iw}" y2="${pad.t+ih}" stroke="var(--muted2)"/>
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ih}" stroke="var(--muted2)"/>
    ${yTicks}${xTicks}
    <text class="axis-label" x="${pad.l+iw/2}" y="${H-26}" text-anchor="middle" style="text-transform:none;letter-spacing:normal">Feasibility</text>
    <text ${tick} x="${(pad.l+iw).toFixed(1)}" y="${H-8}" text-anchor="end">100 means highly feasible and fast</text>
    <text class="axis-label" x="${-(pad.t+ih/2)}" y="16" text-anchor="middle" transform="rotate(-90)" style="text-transform:none;letter-spacing:normal">NPV × Margin (€M)</text>
    ${bubbles}
  </svg></div>
  <div class="chip-row" style="margin-top:10px"><span class="badge soft"><span class="dot" style="background:var(--accent)"></span> Solid ring = investment needed</span><span class="badge soft"><span class="dot" style="background:var(--muted2)"></span> Dashed ring = resource needs (FTE × TTM &amp; Cmplx)</span><span class="badge soft"><span class="dot" style="background:var(--green)"></span> Picked · within budget</span><span class="badge soft"><span class="dot" style="background:var(--yellow)"></span> Picked · over budget</span><span class="hint" style="margin-left:auto">Click a bubble to add it to the manual scenario builder (click again to remove).</span></div>
  </div>`;
}

/* DtV opportunity map — one bubble per product, fed by the DtV candidates table.
   X = BOM cost, Y = Revenue. Bubble size = DtV cost-out target (Revenue × 5%). */
function dtvOppMatrix(){
  const W=680,H=396,pad={l:72,r:24,t:18,b:60};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const fzD=new Set((state.frozenDtv||[]).map(d=>String(d.id)));
  const items=PRODUCTS.filter(p=>!fzD.has(String(p.id))).map(p=>({p, bomConv:((p.cost&&+p.cost.bom)||0)+((p.cost&&+p.cost.conversion)||0), dur:dtvManualDur(p)}));
  const maxCost=Math.max(...items.map(i=>i.bomConv),1);
  const maxDur=Math.max(...items.map(i=>i.dur),1);
  const X=v=>pad.l+Math.max(0,Math.min(1,(+v||0)/maxDur))*iw;        // Duration (right = longer)
  const Y=v=>pad.t+(1-Math.max(0,Math.min(1,(+v||0)/maxCost)))*ih;   // BOM + Conv cost (top = higher)
  const PT=6;                                                        // fixed point radius (no size encoding)
  const tick='style="font-size:10px;fill:var(--muted2);font-family:var(--sans)"';
  const gx1=pad.l+iw/3, gx2=pad.l+2*iw/3, gy1=pad.t+ih/3, gy2=pad.t+2*ih/3;
  const gridLines=
    `<line x1="${gx1.toFixed(1)}" y1="${pad.t}" x2="${gx1.toFixed(1)}" y2="${pad.t+ih}" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>`+
    `<line x1="${gx2.toFixed(1)}" y1="${pad.t}" x2="${gx2.toFixed(1)}" y2="${pad.t+ih}" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>`+
    `<line x1="${pad.l}" y1="${gy1.toFixed(1)}" x2="${pad.l+iw}" y2="${gy1.toFixed(1)}" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>`+
    `<line x1="${pad.l}" y1="${gy2.toFixed(1)}" x2="${pad.l+iw}" y2="${gy2.toFixed(1)}" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>`;
  // Quadrant shading — identical scheme to the main Opportunity map: turquoise builds toward the
  // top-right (high revenue × high BOM cost), fades outward, bottom-left cell unfilled.
  const cellW=iw/3, cellH=ih/3;
  const quadFill=(col,row)=>{ const d=col+(2-row);   // 0 = bottom-left … 4 = top-right
    return d>=4?'rgba(64,196,180,0.30)':d===3?'rgba(64,196,180,0.18)':d===2?'rgba(64,196,180,0.10)':d===1?'rgba(64,196,180,0.045)':'none'; };
  let quadRects='';
  for(let row=0;row<3;row++){ for(let col=0;col<3;col++){ const f=quadFill(col,row); if(f==='none')continue;
    quadRects+=`<rect x="${(pad.l+col*cellW).toFixed(1)}" y="${(pad.t+row*cellH).toFixed(1)}" width="${cellW.toFixed(1)}" height="${cellH.toFixed(1)}" fill="${f}"/>`; } }
  const yTicks=[{v:maxCost,y:pad.t},{v:maxCost*2/3,y:gy1},{v:maxCost/3,y:gy2},{v:0,y:pad.t+ih}]
    .map(t=>`<text ${tick} x="${(pad.l-8).toFixed(1)}" y="${(t.y+3).toFixed(1)}" text-anchor="end">${esc(fmtM(t.v))}</text>`).join('');
  const xTicks=[{v:0,x:pad.l},{v:maxDur/3,x:gx1},{v:maxDur*2/3,x:gx2},{v:maxDur,x:pad.l+iw}]
    .map(t=>`<text ${tick} x="${t.x.toFixed(1)}" y="${(pad.t+ih+16).toFixed(1)}" text-anchor="middle">${Math.round(t.v)}</text>`).join('');
  const fit=scenarioFit();
  const bubbles=items.map(i=>{
    const x=X(i.dur), y=Y(i.bomConv);
    const sel=(state.manualDtv||[]).includes(i.p.id);
    const ringC=bubbleFitColor(sel,fit['dtv:'+i.p.id]);
    const selRing=sel?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(PT+5).toFixed(1)}" fill="none" stroke="${ringC}" stroke-width="3"/>`:'';
    return `<g data-action="pick-bubble-dtv" data-val="${i.p.id}" style="cursor:pointer">
      ${selRing}
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${PT}" fill="${sel?ringC:'var(--accent)'}" stroke="#fff" stroke-width="1.5"/>
      <text class="bubble-label" x="${x.toFixed(1)}" y="${(y-PT-4).toFixed(1)}" text-anchor="middle" style="font-weight:700">${esc(String(i.p.sku||i.p.id||'').slice(0,7))}</text></g>`;
  }).join('');
  return `<div class="card mb"><div class="section-head"><h3 class="card-title">DtV opportunity map</h3><span class="badge soft">${items.length} products</span></div>
  <div style="max-width:820px;margin:0 auto"><svg class="matrix-svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${quadRects}
    ${gridLines}
    <line x1="${pad.l}" y1="${pad.t+ih}" x2="${pad.l+iw}" y2="${pad.t+ih}" stroke="var(--muted2)"/>
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ih}" stroke="var(--muted2)"/>
    ${yTicks}${xTicks}
    <text class="axis-label" x="${pad.l+iw/2}" y="${H-26}" text-anchor="middle" style="text-transform:none;letter-spacing:normal">Duration (months)</text>
    <text class="axis-label" x="${-(pad.t+ih/2)}" y="16" text-anchor="middle" transform="rotate(-90)" style="text-transform:none;letter-spacing:normal">BOM + Conv cost</text>
    ${bubbles}
  </svg></div>
  <div class="chip-row" style="margin-top:10px"><span class="badge soft"><span class="dot" style="background:var(--accent)"></span> One point per product</span><span class="badge soft"><span class="dot" style="background:var(--green)"></span> Picked · within budget</span><span class="badge soft"><span class="dot" style="background:var(--yellow)"></span> Picked · over budget</span><span class="hint" style="margin-left:auto">One point per product · X = Duration (months) · Y = BOM + Conv cost · click a point to add it to the manual scenario builder (click again to remove).</span></div>
  </div>`;
}

function filteredCandidates(){
  const q=(state.search||'').toLowerCase();
  let list=CANDIDATES.filter(c=>{
    if(state.filters.bucket!=='all'&&c.bucket!==state.filters.bucket)return false;
    if(state.filters.source!=='all'&&c.source!==state.filters.source)return false;
    const fs=state.fundingOverride[c.id]||c.fundingStatus;
    if(state.filters.funding!=='all'&&fs!==state.filters.funding)return false;
    if(q&&!(c.name+' '+c.bucket+' '+(c.problem||'')+' '+c.ecosystemIds.map(ecoName).join(' ')).toLowerCase().includes(q))return false;
    return true;
  });
  const sk=state.sort.cand;
  const val=(c)=> sk.key==='spend'?c.spend : sk.key==='npv'?c.npv : sk.key==='vpe'?valuePerEuro(c) : sk.key==='scarce'?scarceUnits(c) : candidateScore(c);
  list.sort((a,b)=>(val(a)-val(b))*sk.dir);
  return list;
}

const heatBg=u=>u>110?'#C4574F':u>100?'#D67C54':u>85?'#C98A2E':u>70?'#5AB6A6':'#2FA98C';
function scenarioInterpretation(S){
  const parts=[];
  parts.push(S.financialFeasible?`Fits the envelope with ${fmtM(S.discRemaining)} discretionary headroom.`:`Over the discretionary pool by ${fmtM(-S.discRemaining)}.`);
  parts.push(S.capacityFeasible?'All capacity pools within limits.':`Capacity overloaded — ${S.worst.pool?esc(S.worst.pool.name):''} hits ${S.worst.val}% in ${S.worst.q}.`);
  if(!S.capabilityFeasible) parts.push(`Missing high-importance capability: ${S.capGaps.map(brickName).join(', ')}.`);
  return parts.join(' ');
}
function capabilityDecision(b){
  if(b.importance==='High'&&b.maturity<=1) return {label:'Partner / explore first',tone:'red'};
  if(b.importance==='High'&&b.maturity<3) return {label:'Build — strategic',tone:'yellow'};
  if(b.importance==='Low') return {label:'Buy / partner',tone:'soft'};
  if(b.maturity>=3) return {label:'Do internally',tone:'green'};
  return {label:'Upskill internally',tone:'yellow'};
}

/* --- clustered, editable capability bricks: topic → capability → people --- */
function fteCount(b){ return (b.people&&b.people.length)||0; }
/* how many of the top-N project candidates (ranked by attractiveness) require a given capability / role */
const TOP_CAND_N=30;
function safeCandScore(c){ try{ return candidateScore(c); }catch(e){ return 0; } }
function topCandidates(n){ return CANDIDATES.slice().sort((a,b)=>safeCandScore(b)-safeCandScore(a)).slice(0,n); }
function brickProjCount(bid, top){ return top.filter(c=>Array.isArray(c.bricks)&&c.bricks.includes(bid)).length; }
function domainProjCount(dom, top){ const ids=BRICKS.filter(b=>b.domain===dom).map(b=>b.id); return top.filter(c=>Array.isArray(c.bricks)&&c.bricks.some(bid=>ids.includes(bid))).length; }
/* the first-level capability-brick topics are the roles from the resource free-capacity heatmap
   (always shown, in heatmap order), followed by any legacy/custom domains still in use. */
function capTopics(){
  const doms=FREECAP.map(r=>r.name);                                              // every heatmap role is a topic
  BRICKS.forEach(b=>{ if(b.domain && !doms.includes(b.domain)) doms.push(b.domain); }); // legacy / custom domains
  (state.extraTopics||[]).forEach(t=>{ if(!doms.includes(t)) doms.push(t); });
  return doms;
}
/* is this topic one of the heatmap roles (i.e. a linked role, not a free-form custom topic)? */
function isRoleTopic(name){ return FREECAP.some(r=>String(r.name)===String(name)); }
/* free-capacity summary for a heatmap role, matched by name — links bricks ↔ heatmap */
function freecapForRole(name){
  const r=FREECAP.find(x=>String(x.name)===String(name));
  if(!r||!Array.isArray(r.week)||!r.week.length) return null;
  const vals=r.week.map(v=>+v||0); const sum=vals.reduce((a,v)=>a+v,0);
  return { avg:Math.round(sum/vals.length), cur:vals[0], min:Math.min(...vals), max:Math.max(...vals), weeks:vals.length };
}
function addTopic(){ const name=(prompt('New capability topic (e.g. Electrical engineering):')||'').trim(); if(!name) return; if(!state.extraTopics) state.extraTopics=[]; if(!capTopics().includes(name)) state.extraTopics.push(name); state.capExpanded[name]=true; persist(); renderContent(); toast('Topic added'); }
function addCapability(dom){ const name=(prompt('New capability under "'+dom+'":')||'').trim(); if(!name) return; const id='b-'+Date.now().toString(36); BRICKS.push({id, domain:dom, name, maturity:2, capacity:0, unit:'FTE', importance:'Medium', owner:'—', reco:'—', desc:'', people:[]}); state.extraTopics=(state.extraTopics||[]).filter(t=>t!==dom); state.capExpanded[dom]=true; state.brickExpanded[id]=true; persist(); renderContent(); toast('Capability added'); }
function removeCapability(id){ const b=byId(BRICKS,id); if(!b) return; if(!confirm('Remove capability "'+b.name+'"?')) return; const i=BRICKS.indexOf(b); if(i>=0) BRICKS.splice(i,1); persist(); renderContent(); toast('Capability removed'); }
function removeTopic(dom){ const list=BRICKS.filter(b=>b.domain===dom); if(!confirm('Remove topic "'+dom+'"'+(list.length?(' and its '+list.length+' capabilit'+(list.length===1?'y':'ies')):'')+'?')) return; BRICKS=BRICKS.filter(b=>b.domain!==dom); state.extraTopics=(state.extraTopics||[]).filter(t=>t!==dom); delete state.capExpanded[dom]; persist(); renderContent(); toast('Topic removed'); }
function addPerson(id){ const b=byId(BRICKS,id); if(!b) return; const inp=document.getElementById('np-'+id); const name=inp?inp.value.trim():''; if(!name){ toast('Enter a name first'); return; } if(!Array.isArray(b.people)) b.people=[]; b.people.push(name); persist(); renderContent(); }
function removePerson(id,idx){ const b=byId(BRICKS,id); if(!b||!Array.isArray(b.people)) return; if(idx>=0&&idx<b.people.length){ b.people.splice(idx,1); persist(); renderContent(); } }
/* Projects-per-FTE ratio label (proj ÷ FTE). "—" when there are no projects; "∞" when projects
   exist but no FTE possess the capability (a pure gap). */
function projPerFteTxt(proj, fte){
  proj=+proj||0; fte=+fte||0;
  if(proj===0) return '0';
  if(fte<=0) return '∞';
  return String(Math.round(proj/fte*100)/100);
}

}
function capabilityBricks(){
  // On-screen we only surface skills that have at least one person assigned; the full generic
  // catalogue (incl. empty skills) lives in the Excel template you download / upload here.
  const hasPeople=b=>(b.people||[]).length>0;

        <div class="chip-row" style="margin-top:2px"><button class="btn ghost sm" data-action="add-capability" data-domain="${esc(dom)}">+ Add capability</button></div>

    return `<div style="margin-bottom:10px">
      <div class="topic-head" data-action="toggle-topic" data-domain="${esc(dom)}">
        ${caret(open)}
        <div style="flex:1;min-width:0"><span class="t-name">${esc(dom)}</span> <span class="t-sub">· ${list.length} ${list.length===1?'capability':'capabilities'}</span></div>
        <span class="badge soft" title="Total people (FTE) across this role">${topicFte} FTE</span>
        <span class="badge neutral" title="Top-${TOP_CAND_N} project candidates that require any capability in this role">${topicProj} proj</span>
        <span class="badge ${topicProj&&topicFte<=0?'red':'soft'}" title="Projects per FTE — top-${TOP_CAND_N} candidates needing this role ÷ people in it">${projPerFteTxt(topicProj,topicFte)} proj/FTE</span>
      </div>
      ${inner}
    </div>`;
  }).join('');
  return `<div class="card mb">
    <div class="section-head"><h3 class="card-title">Capability bricks — clustered by role</h3><div class="chip-row"><span class="badge soft">${shownBricks.length} skills with people · ${totalFte} FTE</span></div></div>
    <p class="card-sub" style="margin:-6px 0 14px">The first level clusters capabilities by <b>role</b>. On the right, <b>FTE</b> is how many people possess that capability and <b>proj</b> is how many of the top-${TOP_CAND_N} project candidates require it. Only skills with <b>at least one person</b> appear here — use <b>Output</b> at the top of the tab to download the full generic catalogue of roles &amp; skills (the <b>Capability bricks</b> sheet), add the people who can work on each, then re-upload with <b>Input</b>. Click a role to expand its capabilities and see who is assigned.</p>
    ${blocks || '<div class="empty">No skills have people assigned yet — use Input above to download the catalogue, add people, and upload it back.</div>'}
    <div class="chip-row" style="margin-top:4px"><button class="btn ghost sm" data-action="add-topic">+ Add topic</button></div>
  </div>`;
}

/* Product export: the file's header row = the table's column LABELS in the current order, and each
   value is read verbatim (the salesMonthly series is joined with ";" so it re-imports as a sparkline). */
function productExportValue(p,key){
  const d=prodColDesc(key);
  if(d.type==='spark'||key==='salesMonthly'){ return salesMonthlyOf(p).join(';'); }
  let v=d.cost?((p.cost||{})[key]):p[key];
  if(typeof v==='boolean') return v?1:0;
  if(Array.isArray(v)) return v.join(';');
  return v==null?'':v;
}
function productExportCols(){
  const cols=productColOrder().map(k=>prodColDesc(k).label);
  const i=cols.indexOf(prodColDesc('id').label);   // put "Country" right after the id column
  cols.splice(i<0?0:i+1, 0, PRODUCT_COUNTRY_COL);
  return cols;
}
/* one export row for a per-country breakdown line: blank product-only cells, id repeated to link,
   Country = the country name, and the country's own values in the reused product columns. */
function countryExportRow(p, c, order){
  const r={}; order.forEach(k=>{ r[prodColDesc(k).label]=''; });
  r[prodColDesc('id').label]=p.id;
  r[PRODUCT_COUNTRY_COL]=c.country||c.name||'';
  COUNTRY_FIELD_KEYS.forEach(k=>{ const lbl=prodColDesc(k).label;
    if(k==='salesMonthly'){ r[lbl]=Array.isArray(c.salesMonthly)?c.salesMonthly.join(';'):''; }
    else { const v=c[k]; r[lbl]=(v==null?'':v); } });
  return r;
}
/* Ordered spec for the Project-candidates export/import so the downloaded Excel mirrors the on-screen
   table EXACTLY (same headers, same order). The two tool-only columns are intentionally omitted:
   "Capability gaps" (computed in the tool) and "Scenario" (the tick you set in the tool). Columns
   flagged computed:true are shown for reading but ignored on re-import (they cannot be edited). */
function candTableSpec(){
  const num=v=>{ const n=cleanNum(v); return isNaN(n)?null:n; };
  const spec=[
    {label:'ID', id:true, get:c=>c.id},
    {label:'Candidate', get:c=>c.name||'', set:(c,v)=>{ c.name=String(v); }},
    {label:'Ecosystem', get:c=>(c.ecosystemIds||[]).map(ecoName).join('; '), set:(c,v)=>{ c.ecosystemIds=parseEcoTokens(String(v)); }},
    {label:'NPV', get:c=>(+c.npv||0), set:(c,v)=>{ const n=num(v); if(n!=null) c.npv=n; }},
    {label:'Margin %', get:c=>candMarginPct(c), set:(c,v)=>{ const n=num(v); if(n!=null) c.marginPct=n; }},
    {label:'NPV × Margin', get:c=>npvProfit(c), set:(c,v)=>{ const n=num(v); if(n!=null) c.npvMargin=n; }},
    {label:'Rough duration', computed:true, get:c=>roughDurationMonths(ttmComplexity(c))},
    {label:'TTM & Cmplx', computed:true, get:c=>ttmComplexity(c)},
    {label:'Investment', get:c=>(+c.spend||0), set:(c,v)=>{ const n=num(v); if(n!=null) c.spend=Math.max(0,n); }}
  ];
  roleFields().forEach(f=>spec.push({label:f.label, get:c=>(c.roleNeed&&c.roleNeed[f.id])||0, set:(c,v)=>{ if(!c.roleNeed)c.roleNeed={}; const n=num(v); c.roleNeed[f.id]=(n==null?0:Math.max(0,n)); }}));
  spec.push({label:'FTE × (TTM & Cmplx)', computed:true, get:c=>candFteScore(c)});
  CANVAS_FIELDS.forEach(f=>spec.push({label:f.label, get:c=>(c[f.key]==null?'':String(c[f.key])), set:(c,v)=>{ c[f.key]=String(v); }}));
  spec.push({label:'Capability bricks needed', get:c=>(c.bricks||[]).map(brickName).join('; '), set:(c,v)=>{ c.bricks=parseBrickTokens(String(v)); }});
  return spec;
}
function candExportLabels(){ return candTableSpec().map(s=>s.label).concat(extraCandCols()); }
/* Resource-use sheet columns = Person | Role | one column per week (the live WEEK_LABELS) */
function resourceExportCols(){ return ['Person','Role', ...WEEK_LABELS]; }
function colsFor(scope){ return scope==='product'?productExportCols() : scope==='capability'?CAP_COLS : scope==='resource'?resourceExportCols() : scope==='spend'?SPEND_COLS : scope==='freecap'?FREECAP_COLS : candExportLabels(); }
function dataForScope(scope){ return scope==='product'?PRODUCTS : scope==='capability'?BRICKS : scope==='resource'?PEOPLE : scope==='spend'?[{...state.spendComp}] : scope==='freecap'?FREECAP : CANDIDATES; }
/* built-in (fictive) seed data source for the "sample data" downloads */
function seedDataForScope(scope){ return scope==='product'?SEED_PRODUCTS : scope==='capability'?SEED_BRICKS : scope==='resource'?SEED_PEOPLE : scope==='freecap'?SEED_FREECAP : SEED_CANDIDATES; }

function pick(o,cols){ const r={}; cols.forEach(k=>{ let v=o[k]; if(Array.isArray(v))v=v.join(';'); r[k]=v===undefined||v===null?'':v; }); return r; }
/* build export rows for a scope from an arbitrary data list (used for both current & sample data) */
function rowsFromData(scope, list){
  // Product: one row per product, keyed by the table's column LABELS (in the current order),
  // values verbatim — so the downloaded file's headers/order match the table exactly and map 1:1 on upload.
  if(scope==='product'){
    const order=productColOrder(); const out=[];
    list.forEach(p=>{
      const r={}; r[PRODUCT_COUNTRY_COL]=''; order.forEach(k=>{ r[prodColDesc(k).label]=productExportValue(p,k); }); out.push(r);
      if(Array.isArray(p.countries)) p.countries.forEach(c=>{ out.push(countryExportRow(p,c,order)); });
    });
    return out;
  }
  // Project candidates: one row per candidate keyed by the table's HEADER LABELS in the table's order,
  // values exactly as shown on screen — so the download mirrors the table (minus Capability gaps and Scenario).
  if(scope==='project'){
    const spec=candTableSpec(); const extra=extraCandCols();
    return list.map(c=>{ const r={}; spec.forEach(s=>{ r[s.label]=s.get(c); }); extra.forEach(col=>{ r[col]=(c[col]!=null?c[col]:''); }); return r; });
  }
  // Resource use: one row per PERSON — Person | Role | weekly hours booked (one column per WEEK_LABEL).
  if(scope==='resource'){ return list.map(p=>{ const r={Person:(p.name!=null?p.name:''), Role:(p.role!=null?p.role:'')}; WEEK_LABELS.forEach((lab,i)=>{ r[lab]=(p.hours&&p.hours[i]!=null)?p.hours[i]:0; }); return r; }); }
  const cols=colsFor(scope);
  if(scope==='freecap'){ return list.map(o=>{ const r={id:o.id,name:o.name}; for(let i=0;i<FREECAP_WEEKS;i++){ r['w'+(i+1)]=(o.week&&o.week[i]!=null)?o.week[i]:0; } return r; }); }
  return list.map(o=>{
    const r=pick(o,cols);
    if(scope==='project'){ roleFields().forEach(f=>{ r['need_'+f.id]=(o.roleNeed&&o.roleNeed[f.id])||0; }); }
    return r;
  });
}
function sampleRows(scope){ return rowsFromData(scope, dataForScope(scope)); }   // "current" (live) data
function seedRows(scope){ return rowsFromData(scope, seedDataForScope(scope)); }   // "sample" (fictive) data
function toCSV(rows,cols){ const cq=v=>{v=(v==null||(typeof v==='number'&&!Number.isFinite(v)))?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}; return [cols.join(','),...rows.map(r=>cols.map(c=>cq(r[c])).join(','))].join('\n'); }
function downloadBlob(content,name,type){ const blob=new Blob([content],{type}); const a=document.createElement('a'); const url=URL.createObjectURL(blob); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); }

/* ============================================================================
   Minimal, dependency-free Excel (.xlsx) read + write — 100% offline.
   Uses only built-in browser APIs (TextEncoder/DataView/DOMParser and, for
   reading zipped sheets, DecompressionStream). No libraries, no network.
   The written file is a valid OOXML spreadsheet: a stored (uncompressed) ZIP
   holding the minimal parts Excel/Numbers/LibreOffice need. Strings are written
   inline (no shared-strings table) to keep the writer tiny; numbers are written
   as numeric cells so they open as numbers, not text.
   ============================================================================ */
function _crc32(bytes){
  if(!_crc32.t){ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } t[n]=c>>>0; } _crc32.t=t; }
  const t=_crc32.t; let crc=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++){ crc=(crc>>>8)^t[(crc^bytes[i])&0xFF]; }
  return (crc^0xFFFFFFFF)>>>0;
}
function _zipStore(files){ // files: [{name, data:Uint8Array}] — stored, no compression
  const enc=new TextEncoder(); const chunks=[]; const central=[]; let offset=0;
  const u16=n=>Uint8Array.of(n&0xFF,(n>>>8)&0xFF);
  const u32=n=>Uint8Array.of(n&0xFF,(n>>>8)&0xFF,(n>>>16)&0xFF,(n>>>24)&0xFF);
  const push=a=>{ chunks.push(a); offset+=a.length; };
  // A fixed, VALID DOS date/time (2021-01-01 00:00). A zero date (month 0, day 0) is technically
  // invalid and some strict OPC readers (Excel) flag the package, so we emit a real timestamp.
  const dosT=0, dosD=((2021-1980)<<9)|(1<<5)|1;
  files.forEach(f=>{
    const nameBytes=enc.encode(f.name), data=f.data, crc=_crc32(data), localStart=offset;
    push(u32(0x04034b50)); push(u16(20)); push(u16(0)); push(u16(0)); push(u16(dosT)); push(u16(dosD));
    push(u32(crc)); push(u32(data.length)); push(u32(data.length)); push(u16(nameBytes.length)); push(u16(0));
    push(nameBytes); push(data);
    const cd=[]; let clen=0; const cp=a=>{ cd.push(a); clen+=a.length; };
    cp(u32(0x02014b50)); cp(u16(20)); cp(u16(20)); cp(u16(0)); cp(u16(0)); cp(u16(dosT)); cp(u16(dosD));
    cp(u32(crc)); cp(u32(data.length)); cp(u32(data.length)); cp(u16(nameBytes.length)); cp(u16(0)); cp(u16(0));
    cp(u16(0)); cp(u16(0)); cp(u32(0)); cp(u32(localStart)); cp(nameBytes);
    central.push({cd,clen});
  });
  const centralStart=offset;
  central.forEach(c=>c.cd.forEach(push));
  const centralSize=offset-centralStart;
  push(u32(0x06054b50)); push(u16(0)); push(u16(0)); push(u16(files.length)); push(u16(files.length));
  push(u32(centralSize)); push(u32(centralStart)); push(u16(0));
  let total=0; chunks.forEach(c=>total+=c.length);
  const out=new Uint8Array(total); let p=0; chunks.forEach(c=>{ out.set(c,p); p+=c.length; });
  return out;
}
function _colLetter(n){ let s=''; n=n+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function _xmlEsc(v){ return String(v).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function _sheetXml(rows,cols,style){
  // style (optional): { header:Set(colIdx), data:Set(colIdx) } — those cells get the red-bold font
  // (cell style s="1", defined in styles.xml) so renamed roles stand out in the exported workbook.
  const hdrRed = style&&style.header ? style.header : null;
  const dataRed = style&&style.data ? style.data : null;
  const numRe=/^-?\d+(\.\d+)?$/;
  const cell=(ci,ri,val,forceText,red)=>{ const ref=_colLetter(ci)+(ri+1); const sAttr=red?' s="1"':'';
    // Empty, or a non-finite number (NaN/Infinity) — write a blank cell. Emitting <v>NaN</v> or
    // <v>Infinity</v> is NOT valid OOXML and makes Excel refuse to open the whole file.
    if(val==null||val===''||(typeof val==='number'&&!Number.isFinite(val))){ return '<c r="'+ref+'"'+sAttr+'/>'; }
    if(!forceText && (typeof val==='number' || (typeof val==='string' && numRe.test(val.trim())))){
      return '<c r="'+ref+'"'+sAttr+'><v>'+_xmlEsc(typeof val==='number'?val:val.trim())+'</v></c>'; }
    return '<c r="'+ref+'"'+sAttr+' t="inlineStr"><is><t xml:space="preserve">'+_xmlEsc(val)+'</t></is></c>'; };
  const lastRef=_colLetter(Math.max(0,cols.length-1))+(rows.length+1);
  const out=['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:'+lastRef+'"/><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetData>'];
  out.push('<row r="1">'+cols.map((c,ci)=>cell(ci,0,c,true, hdrRed&&hdrRed.has(ci))).join('')+'</row>');
  rows.forEach((r,ri)=>{ out.push('<row r="'+(ri+2)+'">'+cols.map((c,ci)=>cell(ci,ri+1,r[c], false, dataRed&&dataRed.has(ci))).join('')+'</row>'); });
  out.push('</sheetData></worksheet>'); return out.join('');
}
/* one matrix cell — always inline text (the capability catalogue is all strings) */
function _sheetXmlGrid(grid, styleFn){
  // styleFn (optional): (ci,ri) -> truthy to give that cell the red-bold font (s="1").
  const ncol=grid.reduce((m,r)=>Math.max(m,(r||[]).length),1);
  const cell=(ci,ri,val)=>{ const ref=_colLetter(ci)+(ri+1); const sAttr=(styleFn&&styleFn(ci,ri))?' s="1"':'';
    if(val==null||val===''){ return '<c r="'+ref+'"'+sAttr+'/>'; }
    return '<c r="'+ref+'"'+sAttr+' t="inlineStr"><is><t xml:space="preserve">'+_xmlEsc(val)+'</t></is></c>'; };
  const lastRef=_colLetter(Math.max(0,ncol-1))+(grid.length||1);
  const out=['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:'+lastRef+'"/><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetData>'];
  grid.forEach((r,ri)=>{ let cells=''; for(let ci=0;ci<ncol;ci++) cells+=cell(ci,ri,(r||[])[ci]); out.push('<row r="'+(ri+1)+'">'+cells+'</row>'); });
  out.push('</sheetData></worksheet>'); return out.join('');
}
/* The "Where the spend goes" export sheet — styled, with a helper column D.
   Columns: A Category | B Item | C Value | D Category total.
   The rows are exactly what spendWhereRows() emits — no synthetic rows are added. The user's data
   already carries an "Unallocated" line WITHIN each breakdown block (the balancing figure that makes
   every block reconcile to the same envelope total), plus one overall "Unallocated" row at the top.
   Styling:
     • Column A (Category) only is colour-coded, all bold: "By project type" green (s=2),
       "By ecosystem" dark-turquoise (s=3), "Consumed by" black (s=4). The top "Unallocated"
       category and column B (Item) stay default.
     • The value cell (column C) is bold black (s=4) for every "Unallocated" line (4 in total).
     • Column D (Category total) carries each breakdown block's total — the sum of ALL its values,
       including its own Unallocated line — placed on that block's Unallocated row (fallback: the
       block's last row). The top overall Unallocated row leaves D blank, per request.
   Round-trips cleanly: the importer reads only Category/Item/Value, so column D is ignored. */
function _spendSheetXml(){
  const R=spendWhereRows();                              // canonical rows, used exactly as-is
  const isUn=s=>/unalloc/i.test(String(s||''));
  const breakdownCats=['By project type','By ecosystem','Consumed by'];
  const catStyle=cat=>{ const c=String(cat||'').toLowerCase();
    if(c.indexOf('project type')>=0||c.indexOf('by type')>=0||c==='type') return 2;  // green
    if(c.indexOf('eco')>=0) return 3;                                                 // turquoise
    if(c.indexOf('consum')>=0) return 4;                                              // black bold
    return 0; };                                                                      // top Unallocated / other
  // Block totals = sum of every value in the block (incl. its own Unallocated line).
  const catTotal={};
  R.forEach(r=>{ if(breakdownCats.indexOf(r.category)>=0) catTotal[r.category]=(catTotal[r.category]||0)+(+r.value||0); });
  // Row that carries the block total in column D: the block's Unallocated line, else its last row.
  const unallocIdx={}, lastIdx={};
  R.forEach((r,i)=>{ if(breakdownCats.indexOf(r.category)<0) return; lastIdx[r.category]=i;
    if(isUn(r.item)&&unallocIdx[r.category]===undefined) unallocIdx[r.category]=i; });
  const dValueAt={};
  breakdownCats.forEach(cat=>{ if(catTotal[cat]===undefined) return;
    const idx=(unallocIdx[cat]!==undefined)?unallocIdx[cat]:lastIdx[cat];
    dValueAt[idx]=Math.round(catTotal[cat]); });
  const cols=['Category','Item','Value','Category total'];
  const numRe=/^-?\d+(\.\d+)?$/;
  const cell=(ci,ri,val,forceText,styleIdx)=>{ const ref=_colLetter(ci)+(ri+1); const sAttr=styleIdx?(' s="'+styleIdx+'"'):'';
    if(val==null||val===''||(typeof val==='number'&&!Number.isFinite(val))) return '<c r="'+ref+'"'+sAttr+'/>';
    if(!forceText && (typeof val==='number' || (typeof val==='string' && numRe.test(String(val).trim()))))
      return '<c r="'+ref+'"'+sAttr+'><v>'+_xmlEsc(typeof val==='number'?val:String(val).trim())+'</v></c>';
    return '<c r="'+ref+'"'+sAttr+' t="inlineStr"><is><t xml:space="preserve">'+_xmlEsc(val)+'</t></is></c>'; };
  const lastRef=_colLetter(cols.length-1)+(R.length+1);
  const out=['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:'+lastRef+'"/><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetData>'];
  out.push('<row r="1">'+cols.map((c,ci)=>cell(ci,0,c,true,4)).join('')+'</row>');  // header — black bold
  R.forEach((r,i)=>{
    const ri=i+1;
    const cA=cell(0,ri,r.category,true,catStyle(r.category));           // category colour (col A only)
    const cB=cell(1,ri,r.item,true,0);                                  // item — default
    const cC=cell(2,ri,r.value,false,(isUn(r.item)||isUn(r.category))?4:0);  // Unallocated values bold
    const cD=cell(3,ri,(dValueAt[i]!==undefined?dValueAt[i]:''),false,dValueAt[i]!==undefined?4:0);
    out.push('<row r="'+(ri+1)+'">'+cA+cB+cC+cD+'</row>');
  });
  out.push('</sheetData>');
  // Conditional formatting so the colours/bold follow the CELL TEXT, not fixed positions: any row the
  // user adds later in Excel formats itself. Column A: category → font colour (green/turquoise/black);
  // columns C:D: bold whenever that row's wording (A or B) is "Unallocated". dxfIds map into <dxfs>.
  out.push('<conditionalFormatting sqref="A2:A200">'
    +'<cfRule type="expression" dxfId="0" priority="1"><formula>$A2="By project type"</formula></cfRule>'
    +'<cfRule type="expression" dxfId="1" priority="2"><formula>$A2="By ecosystem"</formula></cfRule>'
    +'<cfRule type="expression" dxfId="2" priority="3"><formula>$A2="Consumed by"</formula></cfRule>'
    +'</conditionalFormatting>');
  out.push('<conditionalFormatting sqref="C2:D200">'
    +'<cfRule type="expression" dxfId="3" priority="4"><formula>OR($A2="Unallocated",$B2="Unallocated")</formula></cfRule>'
    +'</conditionalFormatting>');
  out.push('</worksheet>'); return out.join('');
}
/* Minimal styles.xml — cell-style (s="…") indices used across the exported workbook:
     0 = default font
     1 = red bold      (FFD32F2F) — flags role names so a rename is visibly the same field everywhere
     2 = green bold     (FF2E7D32) — "By project type" rows in the spend sheet
     3 = turquoise bold (FF007E88) — "By ecosystem" rows in the spend sheet
     4 = black bold     (FF000000) — "Consumed by" rows, the header, and the Unallocated value/total cells */
const _XLSX_STYLES_XML='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
  +'<fonts count="5">'
  +'<font><sz val="11"/><color rgb="FF000000"/><name val="Calibri"/><family val="2"/></font>'
  +'<font><b/><color rgb="FFD32F2F"/><sz val="11"/><name val="Calibri"/><family val="2"/></font>'
  +'<font><b/><color rgb="FF2E7D32"/><sz val="11"/><name val="Calibri"/><family val="2"/></font>'
  +'<font><b/><color rgb="FF007E88"/><sz val="11"/><name val="Calibri"/><family val="2"/></font>'
  +'<font><b/><color rgb="FF000000"/><sz val="11"/><name val="Calibri"/><family val="2"/></font>'
  +'</fonts>'
  +'<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
  +'<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
  +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
  +'<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
  +'<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
  +'<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
  +'<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
  +'<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>'
  +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
  // Differential formats for the spend-sheet conditional formatting (formula-driven, so newly typed
  // rows colour/bold themselves in Excel): 0=green bold, 1=turquoise bold, 2=black bold, 3=bold only.
  +'<dxfs count="4">'
  +'<dxf><font><b/><color rgb="FF2E7D32"/></font></dxf>'

function _xlsxPackageMulti(sheets){
  const enc=new TextEncoder();

    let n=(String(s.name||('Sheet'+(i+1))).replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,31))||('Sheet'+(i+1));
    let base=n, k=2; while(used[n.toLowerCase()]){ n=(base.slice(0,27)+' '+k).slice(0,31); k++; } used[n.toLowerCase()]=1; return n;
  });

    {name:'_rels/.rels', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>')},
    // docProps make the package look like a real Excel file. app.xml's AppVersion MUST be in Excel's
    // "<major>.<minor>" numeric format (e.g. 16.0300) — a malformed AppVersion alone trips repair.
    {name:'docProps/core.xml', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:creator>R&amp;D Portfolio Cockpit</dc:creator><cp:lastModifiedBy>R&amp;D Portfolio Cockpit</cp:lastModifiedBy><dcterms:created xsi:type="dcterms:W3CDTF">2026-01-01T00:00:00Z</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">2026-01-01T00:00:00Z</dcterms:modified></cp:coreProperties>')},
    {name:'docProps/app.xml', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Microsoft Excel</Application><AppVersion>16.0300</AppVersion></Properties>')},
    // Workbook: fileVersion + workbookPr + bookViews + sheets + calcPr — the child order CT_Workbook

    {name:'xl/workbook.xml', data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><fileVersion appName="xl" lastEdited="7" lowestEdited="7" rupBuild="10000"/><workbookPr/><bookViews><workbookView xWindow="0" yWindow="0" windowWidth="25600" windowHeight="16000" activeTab="0"/></bookViews><sheets>'+sheetTags+'</sheets><calcPr calcId="191029"/></workbook>')},
