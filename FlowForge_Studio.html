<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowForge Studio</title>
<style>
:root{
  --bg:#0f1419; --panel:#151b23; --panel2:#1b232d; --border:#28323f; --border2:#37455a;
  --text:#dbe4ee; --muted:#8a97a8; --faint:#5b6879;
  --accent:#4c8dff; --accent2:#2f6fe0;
  --run:#3ecf8e; --blocked:#f5a623; --failed:#ff5c5c; --idle:#6b7787; --starved:#4c8dff; --maint:#b06bff; --setup:#e0c04c; --off:#3a4553;
  --grid:#1a222c;
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
html[data-theme="light"]{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f4f6f9; --border:#d5dbe3; --border2:#c0c8d4;
  --text:#1c2530; --muted:#5c6875; --faint:#94a0ad;
  --accent:#2f6fe0; --accent2:#2f6fe0; --grid:#e2e7ee;
  --shadow:0 6px 24px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Inter",Roboto,Helvetica,Arial,sans-serif;font-size:13px;background:var(--bg);color:var(--text)}
button{font-family:inherit;font-size:12px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
button:hover{border-color:var(--border2);background:var(--panel)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.primary:hover{background:var(--accent)}
button.icon{padding:5px 7px}
input,select,textarea{font-family:inherit;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px 7px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{width:auto}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.field{margin-bottom:9px}
.row{display:flex;gap:8px}
.row>.field{flex:1}
hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100vh}
/* Header */
header{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto}
.logo{width:22px;height:22px;flex:none}
.brand{font-weight:600;font-size:14px;white-space:nowrap;letter-spacing:.2px}
.model-name{background:transparent;border:1px solid transparent;width:170px;font-weight:500}
.model-name:hover{border-color:var(--border)}
.save-status{font-size:11px;color:var(--muted);white-space:nowrap;min-width:64px}
.spacer{flex:1}
.speedsel{width:auto}

/* Body */
.body{flex:1;display:flex;min-height:0}
/* Left library */
.library{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.lib-search{padding:8px}
.lib-scroll{overflow-y:auto;flex:1;padding:0 8px 12px}
.cat{margin-bottom:6px}
.cat-h{display:flex;align-items:center;gap:6px;cursor:pointer;padding:5px 4px;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;user-select:none}
.cat-h .chev{transition:transform .12s}
.cat.collapsed .chev{transform:rotate(-90deg)}
.cat.collapsed .cat-items{display:none}
.pal{display:flex;align-items:center;gap:8px;padding:6px 7px;margin:3px 0;border:1px solid var(--border);border-radius:6px;background:var(--panel2);cursor:grab;user-select:none}
.pal:hover{border-color:var(--accent)}
.pal .ic{width:16px;height:16px;flex:none;color:var(--accent)}
.pal .nm{font-size:12px}
.pal .beta{font-size:9px;color:var(--faint);margin-left:auto;border:1px solid var(--border);border-radius:3px;padding:0 3px}

/* Canvas */
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);min-width:0}
#canvas{position:absolute;inset:0;cursor:grab}
#canvas.connecting{cursor:crosshair}
#gridbg{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#annoLayer{position:absolute;left:0;top:0;transform-origin:0 0}
.anno{position:absolute;border-radius:6px;box-sizing:border-box;cursor:move;user-select:none;display:flex;align-items:flex-start;justify-content:flex-start}
.anno-blue{background:rgba(76,141,255,.12);border:2px solid rgba(76,141,255,.55)}
.anno-grey{background:rgba(150,160,175,.14);border:2px dashed rgba(150,160,175,.7)}
.anno .anno-txt{font-size:12px;font-weight:600;padding:5px 8px;color:var(--text);pointer-events:none;white-space:pre-wrap;line-height:1.25;max-width:100%}
.anno-blue .anno-txt{color:#3f74d6}
.anno.sel{outline:2px solid var(--accent);outline-offset:1px}
.anno.type-label{background:transparent;border:1px dashed transparent}
.anno.type-label .anno-txt{font-size:14px;font-weight:700}
.anno.type-label.sel{border-color:var(--accent)}
.anno-resize{position:absolute;right:-6px;bottom:-6px;width:13px;height:13px;background:var(--accent);border:2px solid var(--panel);border-radius:3px;cursor:nwse-resize;z-index:2}
.edge-path{fill:none;stroke:var(--border2);stroke-width:2;pointer-events:stroke;cursor:pointer}
.edge-path.sel{stroke:var(--accent)}
.edge-path.invalid{stroke:var(--failed);stroke-dasharray:5 4}
.edge-path.transport{stroke:var(--accent2);stroke-width:3;stroke-dasharray:2 6;stroke-linecap:round;animation:beltflow 1.1s linear infinite}
.edge-path.transport.sel{stroke:var(--accent)}
@keyframes beltflow{to{stroke-dashoffset:-16}}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.node{position:absolute;background:var(--panel2);border:1.5px solid var(--border2);border-radius:8px;min-width:120px;user-select:none;cursor:move;box-shadow:var(--shadow)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(76,141,255,.3)}
.node.disabled{opacity:.5}
.node-h{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border)}
.node-h .ic{width:15px;height:15px;flex:none}
.node-h .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-b{padding:6px 8px;font-size:10.5px;color:var(--muted);min-height:14px}
.node-stat{display:flex;justify-content:space-between;font-size:10px}
.statedot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--faint);cursor:crosshair;z-index:2}
.port:hover{border-color:var(--accent);background:var(--accent)}
.port.in{left:-7px;top:50%;transform:translateY(-50%)}
.port.out{right:-7px;top:50%;transform:translateY(-50%)}
.node-badge{position:absolute;top:-9px;right:-9px;background:var(--accent2);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}
.token{position:absolute;width:16px;height:16px;pointer-events:none;z-index:5;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.token svg{width:100%;height:100%;display:block}
.token.tok-part{color:var(--run)}
.token.tok-product{color:var(--accent2);width:17px;height:17px}
.tbl-ic{display:inline-flex;vertical-align:middle;margin-right:6px}
.ic-tbl{width:15px;height:15px;color:var(--accent);opacity:.9}

/* Canvas toolbar */
.ctools{position:absolute;left:10px;bottom:10px;display:flex;gap:5px;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:5px;z-index:10}
#minimap{position:absolute;right:10px;bottom:10px;width:180px;height:120px;background:var(--panel);border:1px solid var(--border);border-radius:7px;z-index:10}
.simclock{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:5px 12px;z-index:10;font-variant-numeric:tabular-nums;font-size:12px;display:none;gap:14px}
.simclock b{color:var(--accent)}
.selbox{position:absolute;border:1px solid var(--accent);background:rgba(76,141,255,.1);pointer-events:none;z-index:4}

/* Right props */
.props{width:280px;flex:none;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.props-h{padding:9px 12px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;gap:7px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border)}
.tab{font-size:10.5px;padding:3px 7px;border-radius:4px;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--accent2);color:#fff}
.props-body{flex:1;overflow-y:auto;padding:12px}
.empty{color:var(--faint);text-align:center;padding:30px 10px;font-size:12px}
.help{font-size:10.5px;color:var(--faint);margin-top:-4px;margin-bottom:8px}

/* Bottom */
.bottom{flex:none;background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column}
.bhandle{height:5px;cursor:ns-resize;background:transparent}
.bhandle:hover{background:var(--accent)}
.btabs{display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid var(--border);align-items:center}
.btab{font-size:11px;padding:4px 10px;border-radius:5px;cursor:pointer;color:var(--muted)}
.btab.active{background:var(--panel2);color:var(--text)}
.bbody{flex:1;overflow:auto;padding:10px 12px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:9px 11px}
.kpi .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:10.5px;color:var(--muted);margin-top:2px}
.kpi .u{font-size:11px;color:var(--faint)}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.evlog{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;line-height:1.5}
.evlog .t{color:var(--faint)}
.evlog .ty{color:var(--accent)}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chartbox{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:8px}
.chartbox h4{margin:0 0 6px;font-size:11px;color:var(--muted);font-weight:600}
.chartbox canvas{width:100%;height:150px;display:block}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600}
.b-err{background:rgba(255,92,92,.15);color:var(--failed)}
.b-warn{background:rgba(245,166,35,.15);color:var(--blocked)}
.b-ok{background:rgba(62,207,142,.15);color:var(--run)}
.vmsg{display:flex;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;align-items:flex-start}
.vmsg:hover{border-color:var(--accent)}
.vmsg .desc{font-size:11px}
.vmsg .fix{font-size:10.5px;color:var(--muted);margin-top:2px}
.pos{color:var(--run)}.neg{color:var(--failed)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow);width:520px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column}
.modal-h{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center}
.modal-b{padding:16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.close{margin-left:auto;background:none;border:none;font-size:18px;color:var(--muted);padding:0 4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:10px 16px;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.mini-hist{width:100%;height:70px;background:var(--bg);border:1px solid var(--border);border-radius:5px;margin-top:6px}
.diststat{display:flex;gap:14px;font-size:10.5px;color:var(--muted);margin-top:5px}
.kbd{font-family:monospace;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:0 4px;font-size:11px}
.ex-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer}
.ex-card:hover{border-color:var(--accent)}
.ex-card h4{margin:0 0 4px}
.ex-card p{margin:0;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <div class="body">
    <aside class="library">
      <div class="lib-search"><input id="libSearch" placeholder="Search components..." /></div>
      <div class="lib-scroll" id="libScroll"></div>
    </aside>
    <div class="canvas-wrap" id="canvasWrap">
      <div id="canvas">
        <div id="gridbg"></div>
        <div id="annoLayer"></div>
        <svg id="edgeSvg"></svg>
        <div id="world"></div>
      </div>
      <div class="simclock" id="simClock"></div>
      <div class="ctools">
        <button class="icon" id="zoomIn" title="Zoom in — make everything bigger (or scroll up)">+</button>
        <button class="icon" id="zoomOut" title="Zoom out — make everything smaller (or scroll down)">&minus;</button>
        <button class="icon" id="zoomFit" title="Fit — show the whole model on screen (shortcut: F)">Fit view</button>
        <button class="icon" id="autoLayout" title="Auto-arrange — line up all blocks neatly from left to right">Auto-arrange</button>
        <span class="sep"></span>
        <button class="icon" id="toggleSnap" title="Snap to grid — blocks jump to grid lines so they line up. Click to turn off.">Snap: on</button>
      </div>
      <canvas id="minimap"></canvas>
    </div>
    <aside class="props" id="props"></aside>
  </div>
  <div class="bottom" id="bottom">
    <div class="bhandle" id="bhandle"></div>
    <div class="btabs" id="btabs"></div>
    <div class="bbody" id="bbody"></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none" />

<script>
/* FlowForge Studio — single-file MVP. Engine + UI, dependency-free. */
"use strict";
/* ===================== RNG + DISTRIBUTIONS ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const DISTS={
  constant:{label:"Constant",params:["value"]},
  uniform:{label:"Uniform",params:["min","max"]},
  exponential:{label:"Exponential",params:["mean"]},
  normal:{label:"Normal",params:["mean","std"]},
  lognormal:{label:"Lognormal",params:["mean","std"]},
  triangular:{label:"Triangular",params:["min","mode","max"]},
  weibull:{label:"Weibull",params:["scale","shape"]},
  gamma:{label:"Gamma",params:["shape","scale"]},
  erlang:{label:"Erlang",params:["k","mean"]},
  poisson:{label:"Poisson",params:["mean"]},
  empirical:{label:"Empirical",params:["values"]},
};
function sampleDist(d,rng){
  const p=d.params||{}; let v=0;
  const r=()=>rng();
  switch(d.type){
    case "constant": v=+p.value; break;
    case "uniform": v=(+p.min)+((+p.max)-(+p.min))*r(); break;
    case "exponential": v=-(+p.mean)*Math.log(1-r()); break;
    case "normal":{const u1=Math.max(1e-12,r()),u2=r();const z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);v=(+p.mean)+(+p.std)*z;break;}
    case "lognormal":{const u1=Math.max(1e-12,r()),u2=r();const z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);const m=+p.mean,s=+p.std;const mu=Math.log(m*m/Math.sqrt(s*s+m*m));const sig=Math.sqrt(Math.log(1+(s*s)/(m*m)));v=Math.exp(mu+sig*z);break;}
    case "triangular":{const a=+p.min,c=+p.mode,b=+p.max,u=r();const fc=(c-a)/(b-a);v=u<fc?a+Math.sqrt(u*(b-a)*(c-a)):b-Math.sqrt((1-u)*(b-a)*(b-c));break;}
    case "weibull": v=(+p.scale)*Math.pow(-Math.log(1-r()),1/(+p.shape)); break;
    case "gamma":{const k=Math.max(1,Math.round(+p.shape));let s=0;for(let i=0;i<k;i++)s+=-Math.log(1-r());v=s*(+p.scale);break;}
    case "erlang":{const k=Math.max(1,Math.round(+p.k));let s=0;for(let i=0;i<k;i++)s+=-Math.log(1-r());v=s*((+p.mean)/k);break;}
    case "poisson":{const L=Math.exp(-(+p.mean));let kk=0,pp=1;do{kk++;pp*=r();}while(pp>L);v=kk-1;break;}
    case "empirical":{const arr=(""+p.values).split(",").map(x=>+x.trim()).filter(x=>!isNaN(x));v=arr.length?arr[Math.floor(r()*arr.length)]:0;break;}
    default:v=0;
  }
  return v<0?0:v; // negative time values truncated to 0 (documented rule)
}
function distMean(d){
  const p=d.params||{};const n=x=>+x||0;
  switch(d.type){
    case "constant":return n(p.value);
    case "uniform":return (n(p.min)+n(p.max))/2;
    case "exponential":return n(p.mean);
    case "normal":case "lognormal":return n(p.mean);
    case "triangular":return (n(p.min)+n(p.mode)+n(p.max))/3;
    case "weibull":return n(p.scale); // approx
    case "gamma":return n(p.shape)*n(p.scale);
    case "erlang":return n(p.mean);
    case "poisson":return n(p.mean);
    default:return 0;
  }
}
function distStats(d,seed){ // empirical mean/std via sampling
  const rng=mulberry32((seed||1)>>>0);let s=0,s2=0,n=4000;
  for(let i=0;i<n;i++){const v=sampleDist(d,rng);s+=v;s2+=v*v;}
  const m=s/n;return {mean:m,std:Math.sqrt(Math.max(0,s2/n-m*m))};
}

/* ===================== EVENT QUEUE (binary heap) ===================== */
class EventQueue{
  constructor(){this.a=[];this.seq=0;}
  push(time,fn){this.a.push({time,seq:this.seq++,fn});this._up(this.a.length-1);}
  _less(i,j){const A=this.a[i],B=this.a[j];return A.time<B.time||(A.time===B.time&&A.seq<B.seq);}
  _up(i){while(i>0){const p=(i-1)>>1;if(this._less(i,p)){[this.a[i],this.a[p]]=[this.a[p],this.a[i]];i=p;}else break;}}
  _down(i){const n=this.a.length;while(true){let l=2*i+1,r=2*i+2,s=i;if(l<n&&this._less(l,s))s=l;if(r<n&&this._less(r,s))s=r;if(s===i)break;[this.a[i],this.a[s]]=[this.a[s],this.a[i]];i=s;}}
  pop(){if(!this.a.length)return null;const top=this.a[0],last=this.a.pop();if(this.a.length){this.a[0]=last;this._down(0);}return top;}
  get size(){return this.a.length;}
}

/* ===================== SIMULATION ENGINE ===================== */
/* Runs the full discrete-event simulation to completion, producing:
   - eventLog (typed events, timestamped)
   - transferLog (entity moves along edges, for animation replay)
   - stateLog (node state changes over sim time, for replay coloring)
   - kpis (computed from time-weighted state integrals + entity records)
   Animation is a pure replay; results never depend on browser frame rate. */
class Simulation{
  constructor(model,settings){
    this.model=model;
    this.s=Object.assign({runLength:480,warmup:0,seed:42,maxEntities:100000,maxEvents:1000000,baseUnit:"min",stopCondition:"time",targetQty:0,eventLogLevel:"normal",replications:1},settings||{});
    this.rng=mulberry32((this.s.seed>>>0)||1);
    this.eq=new EventQueue();
    this.time=0;
    this.eventLog=[];this.transferLog=[];this.stateLog=[];
    this.entities=new Map();this.entitySeq=0;this.eventCount=0;
    this.completed=[];this.scrapped=[];
    this.wipInt=0;this.wipLast=0;this.wipTime=0; // time-weighted WIP
    this.done=false;this.stopReason="";
    this._build();
  }
  _build(){
    this.rt=new Map(); // node id -> runtime
    for(const n of this.model.nodes){
      this.rt.set(n.id,this._makeRuntime(n));
    }
    // outgoing edges per node
    this.outEdges=new Map();
    for(const n of this.model.nodes)this.outEdges.set(n.id,[]);
    for(const e of this.model.edges){
      if(e.enabled===false)continue;
      if(this.outEdges.has(e.source))this.outEdges.get(e.source).push(e);
    }
  }
  _p(n,k,d){const v=n.props?n.props[k]:undefined;return v===undefined||v===""||v===null?d:v;}
  _makeRuntime(n){
    const p=n.props||{};
    const rt={node:n,type:n.type,buffer:[],busy:0,blockedOut:[],state:"idle",
      stateStart:0,stateAcc:{},processedCount:0,setupAcc:0,rr:0,
      pending:null,arrivalPending:false,created:0,qLenInt:0,qLast:0,qTime:0,
      busyInt:0,busyLast:0,busyTime:0,
      procN:0,procInt:0,procLast:0,procTime:0,
      procTimeSum:0};
    if(n.type==="source"){
      rt.arrivalDist=p.interarrivalDistribution||{type:"constant",params:{value:5}};
      rt.limit=this._p(n,"quantityLimit",Infinity);
      rt.startTime=+this._p(n,"startTime",0);
      rt.stopTime=+this._p(n,"stopTime",Infinity);
    }
    if(n.type==="queue"||n.type==="buffer"){
      rt.capacity=+this._p(n,"capacity",n.type==="buffer"?50:Infinity);
      rt.discipline=this._p(n,"queueDiscipline","FIFO");
    }
    if(n.type==="workstation"){
      rt.servers=+this._p(n,"parallelServers",1);
      rt.procDist=p.processingTimeDistribution||{type:"constant",params:{value:4}};
      rt.setupTime=+this._p(n,"setupTime",0);
      rt.scrapRate=+this._p(n,"scrapRate",0);
      rt.costPerHour=+this._p(n,"costPerHour",0);
      rt.inCap=+this._p(n,"inputBufferCapacity",Infinity);
    }
    if(n.type==="qualitycheck"){
      rt.servers=+this._p(n,"parallelServers",1);
      rt.procDist=p.inspectionTime||{type:"constant",params:{value:1}};
      rt.passProb=+this._p(n,"passProbability",0.9);
    }
    if(n.type==="delay"){
      rt.procDist=p.delayDistribution||{type:"constant",params:{value:1}};
      rt.servers=Infinity;
    }
    if(n.type==="router"){rt.rule=this._p(n,"routingRule","percentage");rt.capacity=1;}
    if(n.type==="merge"){rt.capacity=Infinity;}
    if(n.type==="conveyor"){
      rt.servers=+this._p(n,"capacity",Infinity); // items carried simultaneously
      const tt=+this._p(n,"transportTime",0);
      rt.procDist={type:"constant",params:{value:isFinite(tt)?tt:0}};
    }
    if(n.type==="assembly"){
      rt.servers=+this._p(n,"parallelServers",1);
      rt.procDist=p.processingTimeDistribution||{type:"constant",params:{value:4}};
    }
    // Machine family (forming / cutting / surface treatment / assembly robot / manual person station)
    // all behave as workstation-equivalents so they run through the same processing logic.
    if(n.type==="forming"||n.type==="cutting"||n.type==="surface"||n.type==="robot"||n.type==="person"){
      rt.type="workstation";
      rt.servers=+this._p(n,"parallelServers",1);
      rt.procDist=p.processingTimeDistribution||{type:"constant",params:{value:4}};
      rt.setupTime=+this._p(n,"setupTime",0);
      rt.scrapRate=+this._p(n,"scrapRate",0);
      rt.costPerHour=+this._p(n,"costPerHour",0);
      rt.inCap=+this._p(n,"inputBufferCapacity",Infinity);
    }
    // Warehouse & logistics family — reuse the source / buffer / conveyor engines.
    if(n.type==="materials"){ // a pile of raw material feeding the line = a Source
      rt.type="source";
      rt.arrivalDist=p.interarrivalDistribution||{type:"constant",params:{value:2}};
      rt.limit=this._p(n,"quantityLimit",Infinity);
      rt.startTime=+this._p(n,"startTime",0);
      rt.stopTime=+this._p(n,"stopTime",Infinity);
    }
    if(n.type==="shelf"){ // warehouse shelf / rack = a storage Buffer
      rt.type="buffer";
      rt.capacity=+this._p(n,"capacity",100);
      rt.discipline=this._p(n,"queueDiscipline","FIFO");
    }
    if(n.type==="truck"||n.type==="forklift"){ // moving vehicle = a Conveyor with travel time
      rt.type="conveyor";
      rt.servers=+this._p(n,"capacity",Infinity);
      const tt=+this._p(n,"transportTime",0);
      rt.procDist={type:"constant",params:{value:isFinite(tt)?tt:0}};
    }
    if(n.type==="sink"){}
    return rt;
  }
  log(type,extra){
    this.eventCount++;
    if(this.s.eventLogLevel==="off")return;
    if(this.eventLog.length<20000) this.eventLog.push(Object.assign({t:this.time,type},extra||{}));
  }
  setState(rt,st){
    if(rt.state===st)return;
    const dt=this.time-rt.stateStart;
    if(this.time>=this.s.warmup){
      const from=Math.max(rt.stateStart,this.s.warmup);
      const d=this.time-from; if(d>0)rt.stateAcc[rt.state]=(rt.stateAcc[rt.state]||0)+d;
    }
    rt.stateStart=this.time;
    rt.state=st;
    this.stateLog.push({t:this.time,node:rt.node.id,state:st});
    this.log("node_state_changed",{nodeId:rt.node.id,state:st});
  }
  accQ(rt){ // time-weighted queue length integral (after warmup)
    if(this.time>=this.s.warmup){const from=Math.max(rt.qTime,this.s.warmup);const d=this.time-from;if(d>0)rt.qLenInt+=rt.qLast*d;}
    rt.qTime=this.time;rt.qLast=rt.buffer.length;
  }
  accWip(){if(this.time>=this.s.warmup){const from=Math.max(this.wipTime,this.s.warmup);const d=this.time-from;if(d>0)this.wipInt+=this.wipLast*d;}this.wipTime=this.time;this.wipLast=this.entities.size;}
  accBusy(rt){ // time-weighted occupancy integral (servers holding an entity: processing OR blocked), after warmup
    if(this.time>=this.s.warmup){const from=Math.max(rt.busyTime,this.s.warmup);const d=this.time-from;if(d>0)rt.busyInt+=rt.busyLast*d;}
    rt.busyTime=this.time;rt.busyLast=rt.busy;}
  accProc(rt){ // time-weighted integral of servers ACTIVELY PROCESSING (excludes blocked-holding), after warmup
    if(this.time>=this.s.warmup){const from=Math.max(rt.procTime,this.s.warmup);const d=this.time-from;if(d>0)rt.procInt+=rt.procLast*d;}
    rt.procTime=this.time;rt.procLast=rt.procN;}

  run(){
    // seed source arrivals
    for(const rt of this.rt.values()){
      if(rt.type==="source"){
        const t0=Math.max(0,rt.startTime);
        this.eq.push(t0,()=>this._sourceArrival(rt));
      }
    }
    let guard=0;
    while(this.eq.size){
      if(this.eventCount>this.s.maxEvents){this.stopReason="max events";break;}
      if(this.completed.length>=this.s.maxEntities){this.stopReason="max entities";break;}
      const ev=this.eq.pop();
      if(ev.time>this.s.runLength && this.s.stopCondition==="time"){this.time=this.s.runLength;break;}
      this.time=ev.time;
      ev.fn();
      this.pump();
      if(this.s.stopCondition==="targetQty"&&this.completed.length>=this.s.targetQty){this.stopReason="target quantity reached";break;}
      if(++guard>5000000){this.stopReason="guard limit";break;}
    }
    if(this.time<this.s.runLength && this.s.stopCondition==="time"&&!this.stopReason){
      // let clock advance to runLength for correct time-weighting
    }
    this.time=Math.max(this.time,this.s.stopCondition==="time"?this.s.runLength:this.time);
    // finalize integrals
    for(const rt of this.rt.values()){this.setState(rt,rt.state==="processing"?"processing":rt.state);this.accQ(rt);this.accBusy(rt);this.accProc(rt);
      const dt=this.time-Math.max(rt.stateStart,this.s.warmup);if(dt>0)rt.stateAcc[rt.state]=(rt.stateAcc[rt.state]||0)+dt;}
    this.accWip();
    this.done=true;
    return this.computeKPIs();
  }

  _sourceArrival(rt){
    if(rt.created>=rt.limit||this.time>rt.stopTime)return;
    if(rt.pending){rt.arrivalPending=true;return;} // blocked: no accumulation
    const ent={id:"e"+(this.entitySeq++),productTypeId:this._p(rt.node,"productType",null),
      createdAt:this.time,state:"created",node:rt.node.id,enterQ:null,queueWait:0,cost:0,route:[rt.node.id]};
    this.entities.set(ent.id,ent);
    rt.pending=ent;rt.created++;
    this.accWip();
    this.log("entity_created",{entityId:ent.id,nodeId:rt.node.id});
    this.setState(rt,"processing");
    // schedule next arrival
    const ia=sampleDist(rt.arrivalDist,this.rng);
    if(rt.created<rt.limit&&this.time+ia<=rt.stopTime){
      this.eq.push(this.time+ia,()=>this._sourceArrival(rt));
    }
  }

  // pump: move entities across zero-delay transfers until stable
  pump(){
    let moved=true,guard=0;
    while(moved){
      moved=false;
      if(++guard>100000)break;
      for(const n of this.model.nodes){
        const rt=this.rt.get(n.id);
        const out=this._peekOutput(rt);
        if(out===null||out===undefined)continue;
        const tgtEdge=this._chooseTarget(rt,out);
        if(!tgtEdge)continue;
        const tRt=this.rt.get(tgtEdge.target);
        if(!tRt)continue;
        if(!this._canAccept(tRt))continue;
        // transfer
        this._popOutput(rt);
        const tt=+(tgtEdge.props&&tgtEdge.props.transportTime||0);
        if(tt>0){ this._transportThenReceive(rt,tRt,tgtEdge,out,tt); }
        else { this._receive(tRt,out,tgtEdge); }
        moved=true;
      }
    }
  }
  _transportThenReceive(rt,tRt,edge,ent,tt){
    ent.state="transporting";this.log("transport_started",{entityId:ent.id,edgeId:edge.id});
    this.transferLog.push({t:this.time,edge:edge.id,from:rt.node.id,to:tRt.node.id,entityId:ent.id,dur:tt});
    this.eq.push(this.time+tt,()=>{this.log("transport_completed",{entityId:ent.id,edgeId:edge.id});this._receive(tRt,ent,edge,true);this.pump();});
  }
  _peekOutput(rt){
    switch(rt.type){
      case "source":return rt.pending?rt.pending:null;
      case "queue":case "buffer":return rt.buffer.length?this._selectQueueHead(rt):null;
      case "merge":case "router":return rt.buffer.length?rt.buffer[0]:null;
      case "workstation":case "qualitycheck":case "delay":case "conveyor":case "assembly":return rt.blockedOut.length?rt.blockedOut[0]:null;
      default:return null;
    }
  }
  _selectQueueHead(rt){
    const b=rt.buffer;if(!b.length)return null;
    switch(rt.discipline){
      case "LIFO":return b[b.length-1];
      case "priority":return b.reduce((a,c)=>(c.priority||0)>(a.priority||0)?c:a);
      case "EDD":return b.reduce((a,c)=>((c.dueDate||Infinity)<(a.dueDate||Infinity)?c:a));
      case "SPT":return b[0];
      default:return b[0]; // FIFO
    }
  }
  _popOutput(rt){
    switch(rt.type){
      case "source":{const e=rt.pending;rt.pending=null;if(rt.arrivalPending){rt.arrivalPending=false;this.eq.push(this.time,()=>this._sourceArrival(rt));}if(!rt.pending)this.setState(rt,"idle");return e;}
      case "queue":case "buffer":{this.accQ(rt);const head=this._selectQueueHead(rt);const i=rt.buffer.indexOf(head);rt.buffer.splice(i,1);this.accQ(rt);this.log("queue_left",{entityId:head.id,nodeId:rt.node.id});if(!rt.buffer.length)this.setState(rt,"idle");return head;}
      case "merge":case "router":{return rt.buffer.shift();}
      case "workstation":case "qualitycheck":case "delay":case "conveyor":case "assembly":{const e=rt.blockedOut.shift();rt.busy--;this.accBusy(rt);this.log("entity_unblocked",{entityId:e.id,nodeId:rt.node.id});this._afterServerFree(rt);return e;}
      default:return null;
    }
  }
  _afterServerFree(rt){
    if(rt.busy<rt.servers){ if(rt.busy===0&&!rt.blockedOut.length)this.setState(rt,"starved"); }
  }
  _canAccept(rt){
    switch(rt.type){
      case "sink":return true;
      case "queue":case "buffer":return rt.buffer.length<rt.capacity;
      case "merge":return true;
      case "router":return rt.buffer.length<rt.capacity;
      case "workstation":case "qualitycheck":case "assembly":return rt.busy<rt.servers;
      case "conveyor":return rt.busy<rt.servers;
      case "delay":return true;
      default:return false;
    }
  }
  _receive(rt,ent,edge){
    ent.node=rt.node.id;ent.route.push(rt.node.id);
    if(edge)this.log("queue_entered",{entityId:ent.id,nodeId:rt.node.id,edgeId:edge.id});
    switch(rt.type){
      case "sink":this._complete(rt,ent);break;
      case "queue":case "buffer":{this.accQ(rt);ent.state="waiting";ent.enterQ=this.time;rt.buffer.push(ent);this.accQ(rt);this.setState(rt,"processing");break;}
      case "merge":rt.buffer.push(ent);break;
      case "router":rt.buffer.push(ent);break;
      case "workstation":case "assembly":this._startProcess(rt,ent);break;
      case "qualitycheck":this._startProcess(rt,ent,true);break;
      case "delay":case "conveyor":this._startProcess(rt,ent);break;
    }
  }
  _startProcess(rt,ent,isQC){
    if(ent.enterQ!=null){ent.queueWait+=this.time-ent.enterQ;ent.enterQ=null;}
    rt.busy++;this.accBusy(rt);rt.procN++;this.accProc(rt);ent.state="processing";
    this.setState(rt,"processing");
    this.log("processing_started",{entityId:ent.id,nodeId:rt.node.id});
    let pt=rt.type==="delay"?sampleDist(rt.procDist,this.rng):sampleDist(rt.procDist,this.rng);
    if(rt.setupTime){pt+=rt.setupTime;}
    rt.procTimeSum+=pt;
    this.eq.push(this.time+pt,()=>this._finishProcess(rt,ent,isQC));
  }
  _finishProcess(rt,ent,isQC){
    this.log("processing_completed",{entityId:ent.id,nodeId:rt.node.id});
    rt.processedCount++;
    rt.procN--;this.accProc(rt); // processing finished; server now either freed or blocked-holding
    if(rt.costPerHour){ent.cost+=rt.costPerHour*(0);}
    // scrap for workstation
    if(rt.type==="workstation"&&rt.scrapRate>0&&this.rng()<rt.scrapRate){this._scrap(rt,ent);rt.busy--;this.accBusy(rt);this._afterServerFree(rt);this.pump();return;}
    if(isQC){
      ent._qc=this.rng()<rt.passProb?"pass":"scrap";
      this.log(ent._qc==="pass"?"entity_unblocked":"entity_scrapped",{entityId:ent.id,nodeId:rt.node.id});
    }
    rt.blockedOut.push(ent);
    if(rt.busy>=rt.servers||true){ /* keep server busy until pushed */ }
    ent.state="blocked";
    this.log("entity_blocked",{entityId:ent.id,nodeId:rt.node.id});
    this.pump();
  }
  _complete(rt,ent){
    ent.state="completed";ent.completedAt=this.time;ent.leadTime=this.time-ent.createdAt;
    this.entities.delete(ent.id);this.accWip();
    if(this.time>=this.s.warmup)this.completed.push(ent);
    this.log("entity_completed",{entityId:ent.id,nodeId:rt.node.id});
  }
  _scrap(rt,ent){ent.state="scrapped";this.entities.delete(ent.id);this.accWip();if(this.time>=this.s.warmup)this.scrapped.push(ent);this.log("entity_scrapped",{entityId:ent.id,nodeId:rt.node.id});}

  _chooseTarget(rt,ent){
    const edges=this.outEdges.get(rt.node.id)||[];
    if(!edges.length)return null;
    // Quality check routing by role
    if(rt.type==="qualitycheck"&&ent._qc){
      const role=ent._qc==="pass"?"pass":"scrap";
      let e=edges.find(x=>(x.props&&x.props.route)===role);
      if(!e)e=edges.find(x=>!(x.props&&x.props.route)); // fallback
      return e||edges[0];
    }
    if(rt.type==="router"){
      const rule=rt.rule;
      const accepting=edges.filter(e=>{const t=this.rt.get(e.target);return t&&this._canAccept(t);});
      if(rule==="shortestQueue"){
        if(!accepting.length)return null;
        return accepting.reduce((a,c)=>{const la=this._qlen(a.target),lc=this._qlen(c.target);return lc<la?c:a;});
      }
      if(rule==="roundRobin"){
        for(let i=0;i<edges.length;i++){const e=edges[(rt.rr+i)%edges.length];const t=this.rt.get(e.target);if(t&&this._canAccept(t)){rt.rr=(edges.indexOf(e)+1)%edges.length;return e;}}
        return null;
      }
      if(rule==="leastUtilized"){
        if(!accepting.length)return null;
        return accepting.reduce((a,c)=>this._util(c.target)<this._util(a.target)?c:a);
      }
      // percentage (default)
      const total=edges.reduce((s,e)=>s+(+(e.props&&e.props.percent||0)),0)||100;
      let r=this.rng()*total,acc=0,chosen=null;
      for(const e of edges){acc+=(+(e.props&&e.props.percent)|| (100/edges.length));if(r<=acc){chosen=e;break;}}
      if(!chosen)chosen=edges[edges.length-1];
      const t=this.rt.get(chosen.target);
      return (t&&this._canAccept(t))?chosen:null;
    }
    // default: first edge whose target can accept (else first, causing block)
    const ok=edges.find(e=>{const t=this.rt.get(e.target);return t&&this._canAccept(t);});
    return ok||edges[0];
  }
  _qlen(id){const rt=this.rt.get(id);if(!rt)return Infinity;if(rt.type==="queue"||rt.type==="buffer")return rt.buffer.length;if(rt.type==="workstation"||rt.type==="qualitycheck"||rt.type==="conveyor"||rt.type==="assembly")return rt.busy;return 0;}
  _util(id){const rt=this.rt.get(id);if(!rt||!rt.servers)return 0;return rt.busy/rt.servers;}

  computeKPIs(){
    const horizon=Math.max(1e-9,this.time-this.s.warmup);
    const hours=horizon/(60); // base unit assumed minutes
    const comp=this.completed;
    const leads=comp.map(e=>e.leadTime).sort((a,b)=>a-b);
    const mean=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
    const median=arr=>arr.length?(arr.length%2?arr[(arr.length-1)/2]:(arr[arr.length/2-1]+arr[arr.length/2])/2):0;
    const waits=comp.map(e=>e.queueWait);
    const system={
      throughput:comp.length,
      throughputRate:hours>0?comp.length/hours:0,
      wip:this.wipInt/horizon,
      leadTimeAvg:mean(leads),leadTimeMed:median(leads),
      waitAvg:mean(waits),
      scrap:this.scrapped.length,
      horizon:horizon
    };
    const stations=[];
    for(const rt of this.rt.values()){
      if(["workstation","qualitycheck","conveyor","assembly"].includes(rt.type)){
        const acc=rt.stateAcc;
        const avail=horizon*(isFinite(rt.servers)?rt.servers:1);
        const util=avail>0?rt.procInt/avail:0; // ACTIVE processing server-time / available server-time
        const blocked=avail>0?Math.max(0,(rt.busyInt-rt.procInt))/avail:0; // finished but can't hand off (backpressure)
        const idle=Math.max(0,1-(avail>0?rt.busyInt/avail:0)); // server free (starved / no work)
        stations.push({id:rt.node.id,name:rt.node.name,type:rt.type,
          util,processed:rt.processedCount,
          idle,blocked,
          starved:(acc.starved||0)/horizon,
          avgProc:rt.processedCount?rt.procTimeSum/rt.processedCount:0});
      }
    }
    const queues=[];
    for(const rt of this.rt.values()){
      if(rt.type==="queue"||rt.type==="buffer"){
        queues.push({id:rt.node.id,name:rt.node.name,avgLen:rt.qLenInt/horizon,cur:rt.buffer.length});
      }
    }
    // bottleneck ranking
    const bn=stations.map(s=>{
      let score=s.util*0.6+s.blocked*0.25+ (1-Math.min(1,s.starved))*0.0;
      const reasons=[];
      if(s.util>0.85)reasons.push("very high utilization ("+(s.util*100).toFixed(0)+"%)");
      else if(s.util>0.7)reasons.push("high utilization ("+(s.util*100).toFixed(0)+"%)");
      if(s.blocked>0.1)reasons.push("blocked "+(s.blocked*100).toFixed(0)+"% of time (downstream constraint)");
      if(s.starved>0.3)reasons.push("starved "+(s.starved*100).toFixed(0)+"% (upstream constraint)");
      const conf=Math.min(0.99,Math.max(0.2,s.util));
      return {id:s.id,name:s.name,score,util:s.util,reasons,confidence:conf};
    }).sort((a,b)=>b.score-a.score);
    return {system,stations,queues,bottlenecks:bn,eventLog:this.eventLog,transferLog:this.transferLog,stateLog:this.stateLog,
      completedEntities:comp,settings:this.s,endTime:this.time,eventCount:this.eventCount};
  }
}

    const items=cat.items.filter(([t,l])=>!filter||l.toLowerCase().includes(filter)||t.includes(filter));

    html+='<div class="cat" data-cat="'+cat.name+'"><div class="cat-h"><span class="chev">&#9662;</span>'+cat.name+'</div><div class="cat-items">';

function updateNodeBody(n,el){
  el=el||world.querySelector('.node[data-id="'+n.id+'"]');if(!el)return;
  const b=el.querySelector("[data-body]");if(!b)return;
  let txt="";const bt=baseType(n.type);
  if(bt==="source")txt=distSummary(n.props.interarrivalDistribution)+(n.type==="materials"?" feed":" arr.");
  else if(bt==="workstation")txt=distSummary(n.props.processingTimeDistribution)+" ×"+n.props.parallelServers;
  else if(bt==="queue"||bt==="buffer")txt="cap "+(n.props.capacity||"∞")+" ("+n.props.queueDiscipline+")";
  else if(n.type==="qualitycheck")txt="pass "+Math.round((n.props.passProbability||0)*100)+"%";
  else if(n.type==="router")txt=n.props.routingRule;
  else if(n.type==="delay")txt=distSummary(n.props.delayDistribution);
  else if(bt==="conveyor")txt="t="+n.props.transportTime;
  else txt=LABELS[n.type]||n.type;
  b.innerHTML='<div class="node-stat"><span data-state-txt>'+txt+'</span><span class="statedot" data-dot></span></div>';
}
function distSummary(d){if(!d)return "?";const m=distMean(d);return DISTS[d.type].label[0]+"("+(+m.toFixed(1))+")";}

function portPos(n,side){const w=world.querySelector('.node[data-id="'+n.id+'"]');const h=w?w.offsetHeight:60;const width=w?w.offsetWidth:120;
  return side==="out"?{x:n.x+width,y:n.y+h/2}:{x:n.x,y:n.y+h/2};}
function layoutEdges(){
  let defs='<defs>'+
    '<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="var(--muted)" stroke-width="1.8"/></marker>'+
    '<marker id="arrowsel" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="var(--accent)" stroke-width="2"/></marker>'+
    '<marker id="arrowinv" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="var(--failed)" stroke-width="2"/></marker>'+
    '</defs>';
  let s="";
  for(const e of model.edges){
    const sn=nodeById(e.source),tn=nodeById(e.target);if(!sn||!tn)continue;
    const a=portPos(sn,"out"),b=portPos(tn,"in");
    const dx=Math.max(40,Math.abs(b.x-a.x)*0.5);
    const bx=b.x-9; // leave a small gap so the arrowhead sits just outside the input port
    const d="M"+a.x+","+a.y+" C"+(a.x+dx)+","+a.y+" "+(bx-dx)+","+b.y+" "+bx+","+b.y;
    const inv=e._invalid;const sel=ui.selEdge===e.id;
    const tt=+((e.props&&e.props.transportTime)||e.transportTime||0);
    const isTransport=tt>0;
    const mk=inv?"arrowinv":(sel?"arrowsel":"arrow");
    s+='<path class="edge-hit" d="'+d+'" data-edge="'+e.id+'"/>';
    s+='<path class="edge-path'+(sel?" sel":"")+(inv?" invalid":"")+(isTransport?" transport":"")+'" d="'+d+'" data-edge="'+e.id+'" marker-end="url(#'+mk+')"/>';
    const mx=(a.x+bx)/2,my=(a.y+b.y)/2;
    if(sn.type==="router"&&e.props&&e.props.percent!=null){s+='<text x="'+mx+'" y="'+(my-6)+'" fill="var(--muted)" font-size="10" text-anchor="middle">'+e.props.percent+'%</text>';}
    else if(sn.type==="qualitycheck"&&e.props&&e.props.route){s+='<text x="'+mx+'" y="'+(my-6)+'" fill="var(--muted)" font-size="10" text-anchor="middle">'+e.props.route+'</text>';}
    else if(isTransport){s+='<text x="'+mx+'" y="'+(my-6)+'" fill="var(--accent2)" font-size="10" text-anchor="middle" style="pointer-events:none">&#9201; '+(+tt.toFixed(2))+'</text>';}
  }

function startConnect(id,port,e){if(port!=="out")return;connect={from:id};canvas.classList.add("connecting");e.stopPropagation();}
function finishConnect(targetId){
  if(connect.from===targetId)return;
  if(model.edges.some(ed=>ed.source===connect.from&&ed.target===targetId))return;
  pushUndo();
  const e={id:uid("e"),source:connect.from,sourcePortId:"out",target:targetId,targetPortId:"in",
    routingRule:"default",priority:0,transportTime:0,capacity:"",enabled:true,props:{}};
  const sn=nodeById(connect.from);
  if(sn.type==="router")e.props.percent=0;

function drawTempEdge(fromId,pt){const sn=nodeById(fromId);const a=portPos(sn,"out");

canvasWrap.addEventListener("wheel",e=>{e.preventDefault();

  const old=ui.zoom;const factor=e.deltaY<0?1.1:1/1.1;ui.zoom=Math.min(2.5,Math.max(0.2,ui.zoom*factor));
  ui.panX=mx-(mx-ui.panX)*(ui.zoom/old);ui.panY=my-(my-ui.panY)*(ui.zoom/old);applyTransform();drawMinimap();

function fitView(){if(!model.nodes.length){ui.zoom=1;ui.panX=60;ui.panY=40;applyTransform();return;}
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;for(const n of model.nodes){minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x+140);maxy=Math.max(maxy,n.y+80);}
  const r=canvasWrap.getBoundingClientRect();const zw=(r.width-80)/(maxx-minx),zh=(r.height-80)/(maxy-miny);
  ui.zoom=Math.min(1.5,Math.max(0.25,Math.min(zw,zh)));ui.panX=40-minx*ui.zoom;ui.panY=40-miny*ui.zoom;applyTransform();drawMinimap();}
function autoLayout(){pushUndo();
  // simple layered layout by BFS from sources
  const indeg={};model.nodes.forEach(n=>indeg[n.id]=0);model.edges.forEach(e=>indeg[e.target]=(indeg[e.target]||0)+1);
  const layer={};let frontier=model.nodes.filter(n=>indeg[n.id]===0).map(n=>n.id);if(!frontier.length&&model.nodes.length)frontier=[model.nodes[0].id];
  const seen=new Set();let L=0;
  while(frontier.length){const next=[];for(const id of frontier){if(seen.has(id))continue;seen.add(id);layer[id]=L;model.edges.filter(e=>e.source===id).forEach(e=>{if(!seen.has(e.target))next.push(e.target);});}frontier=next;L++;}
  model.nodes.forEach(n=>{if(layer[n.id]==null)layer[n.id]=L;});
  const perLayer={};model.nodes.forEach(n=>{const l=layer[n.id];perLayer[l]=(perLayer[l]||0);n.x=80+l*220;n.y=60+perLayer[l]*110;perLayer[l]++;});
  markDirty();renderNodes();fitView();}

function snapshot(){return JSON.stringify({nodes:model.nodes,edges:model.edges,annotations:model.annotations||[],productTypes:model.productTypes,name:model.name});}
function pushUndo(){ui.undoStack.push(snapshot());if(ui.undoStack.length>60)ui.undoStack.shift();ui.redoStack=[];}
function restore(s){const o=JSON.parse(s);model.nodes=o.nodes;model.edges=o.edges;model.annotations=o.annotations||[];model.productTypes=o.productTypes;model.name=o.name;renderHeader();renderNodes();renderProps();}
function undo(){if(!ui.undoStack.length)return;ui.redoStack.push(snapshot());restore(ui.undoStack.pop());markDirty();}
function redo(){if(!ui.redoStack.length)return;ui.undoStack.push(snapshot());restore(ui.redoStack.pop());markDirty();}
function markDirty(){ui.dirty=true;updateSaveStatus();updateNodeBodies();}
function updateNodeBodies(){model.nodes.forEach(n=>updateNodeBody(n));}

function deleteSelection(){
  if(!ui.selection.size&&!ui.selEdge&&!ui.selAnno)return;pushUndo();
  if(ui.selAnno){model.annotations=(model.annotations||[]).filter(a=>a.id!==ui.selAnno);ui.selAnno=null;}
  if(ui.selEdge){model.edges=model.edges.filter(e=>e.id!==ui.selEdge);ui.selEdge=null;}
  if(ui.selection.size){const ids=ui.selection;model.nodes=model.nodes.filter(n=>!ids.has(n.id));model.edges=model.edges.filter(e=>!ids.has(e.source)&&!ids.has(e.target));ui.selection.clear();}
  markDirty();renderNodes();renderProps();
}
function duplicateSelection(){if(!ui.selection.size)return;pushUndo();const map={};const news=[];
  for(const id of ui.selection){const n=nodeById(id);const c=JSON.parse(JSON.stringify(n));c.id=uid("n");c.name=uniqueName(n.name);c.x+=30;c.y+=30;map[id]=c.id;model.nodes.push(c);news.push(c.id);}
  for(const e of [...model.edges]){if(ui.selection.has(e.source)&&ui.selection.has(e.target)){const c=JSON.parse(JSON.stringify(e));c.id=uid("e");c.source=map[e.source];c.target=map[e.target];model.edges.push(c);}}
  ui.selection=new Set(news);markDirty();renderNodes();renderProps();}
let clipboard=null;
function copySel(){if(!ui.selection.size)return;clipboard=[...ui.selection].map(id=>JSON.parse(JSON.stringify(nodeById(id))));}

const TABS=["General","Timing","Capacity","Routing","Failures","Resources","Schedule","Costs","Visualization","Advanced"];

    p.innerHTML='<div class="props-h">Properties</div><div class="empty">'+(ui.selection.size>1?ui.selection.size+" objects selected":"Select an object to edit its properties.")+'</div>';

  p.innerHTML='<div class="props-h">'+svg(IC[n.type]||IC.workstation,"ic","")+esc(n.name)+'</div>'+
    '<div class="tabs" id="propTabs"></div><div class="props-body" id="propBody"></div>';
  const avail=TABS.filter(t=>tabApplies(n.type,t));

  $("propTabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ui.propTab=t.dataset.tab;renderProps();});

function tabApplies(type,tab){
  type=baseType(type); // machine / warehouse / logistics families reuse their base type's tabs
  if(tab==="General"||tab==="Visualization"||tab==="Advanced")return true;
  if(tab==="Timing")return ["source","workstation","qualitycheck","delay","conveyor","assembly"].includes(type);
  if(tab==="Capacity")return ["queue","buffer","workstation","conveyor","router","qualitycheck"].includes(type);
  if(tab==="Routing")return ["router","qualitycheck","queue","buffer"].includes(type);
  if(tab==="Failures")return ["workstation","conveyor","qualitycheck"].includes(type);
  if(tab==="Resources")return ["workstation","assembly","qualitycheck"].includes(type);
  if(tab==="Schedule")return ["workstation","source","qualitycheck"].includes(type);
  if(tab==="Costs")return ["workstation","qualitycheck","conveyor"].includes(type);
  return false;
}
function F(label,inner,help){return '<div class="field"><label>'+label+'</label>'+inner+(help?'<div class="help">'+help+'</div>':'')+'</div>';}
function txt(k,v,attr){return '<input data-k="'+k+'" value="'+esc(v==null?"":v)+'" '+(attr||"")+'/>';}
function num(k,v,attr){return '<input type="number" data-k="'+k+'" value="'+(v==null||v===""?"":v)+'" '+(attr||"")+'/>';}

// Short explanation, shown on every block's General tab, of whether/how it changes the results.
function impactRole(n){
  const bt=baseType(n.type);
  if(n.type==="materials")return "Feeds material into the line (a Source). Its feed interval drives how much work enters.";
  if(n.type==="shelf")return "Storage buffer — items wait here; when full it blocks the step before it.";
  if(n.type==="truck")return "Transport step — items spend its travel time in transit; its capacity can throttle flow.";
  if(n.type==="forklift")return "Internal transport step — adds travel time and a load limit between steps.";
  if(WORKSTATIONLIKE.has(n.type))return "Processing step — its cycle time and number of parallel units drive capacity and can be a bottleneck.";
  if(bt==="source")return "Entry point — its arrival pattern sets how much work enters the system.";
  if(bt==="workstation")return "Processing step — cycle time and parallel servers drive capacity.";
  if(bt==="queue"||bt==="buffer")return "Waiting line / storage — its capacity can block upstream steps when full.";
  if(bt==="conveyor")return "Transport step — adds travel time (and capacity) between steps.";
  if(n.type==="qualitycheck")return "Inspects items and splits them to pass / fail paths — affects scrap and rework.";
  if(n.type==="router")return "Splits flow across paths — changes where the load goes.";
  if(n.type==="delay")return "Holds items for a time without using a machine — adds to lead time.";
  if(n.type==="sink")return "Exit point — where finished items leave and throughput is counted.";
  return "Part of the flow.";
}
function impactBanner(n){
  if(!IMPLEMENTED.has(n.type)){
    return '<div class="help" style="border-left:3px solid var(--blocked);padding:6px 8px;background:rgba(150,160,175,.08);border-radius:4px;margin:2px 0 6px">'+
      '<b style="color:var(--blocked)">Not simulated</b> — this block can be placed and connected, but the engine skips it in this MVP.</div>';
  }
  return '<div class="help" style="border-left:3px solid var(--run);padding:6px 8px;background:rgba(80,200,120,.07);border-radius:4px;margin:2px 0 6px">'+
    '<b style="color:var(--run)">Affects the simulation.</b> '+impactRole(n)+'</div>';
}

    if(n.type==="qualitycheck")h+=F("Pass probability",num("passProbability",P.passProbability,'step="0.01" min="0" max="1"'),"Failed items follow the 'scrap' connection.");
    if(bt==="queue"||bt==="buffer")h+=F("Overflow behavior",sel("overflowBehavior",P.overflowBehavior,[["block","Block upstream"],["discard","Discard entity"]]));
  }

function defaultDistParam(t,p){const m={value:2,min:1,max:5,mean:5,std:1,mode:3,scale:2,shape:2,k:2,values:"1,2,3"};return m[p]!=null?m[p]:1;}
function setDeep(o,key,val){if(key.includes(".")){const[a,b]=key.split(".");o[a]=o[a]||{};o[a][b]=val;}else o[key]=val;}

function drawHist(n){
  $("propBody").querySelectorAll("[data-hist]").forEach(cv=>{
    const key=cv.dataset.hist;const d=getDeep(n.props,key);if(!d)return;
    const rng=mulberry32(1234);const N=3000;const samples=[];let mn=1e9,mx=-1e9;
    for(let i=0;i<N;i++){const v=sampleDist(d,rng);samples.push(v);mn=Math.min(mn,v);mx=Math.max(mx,v);}
    if(mx<=mn)mx=mn+1;const bins=20,counts=new Array(bins).fill(0);
    samples.forEach(v=>{let b=Math.floor((v-mn)/(mx-mn)*bins);if(b>=bins)b=bins-1;if(b<0)b=0;counts[b]++;});
    const W=cv.clientWidth||240,H=cv.clientHeight||70;cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
    ctx.clearRect(0,0,W,H);const cmax=Math.max(...counts);const bw=W/bins;
    ctx.fillStyle=cssVar("--accent");
    counts.forEach((c,i)=>{const bh=(c/cmax)*(H-6);ctx.fillRect(i*bw+1,H-bh,bw-2,bh);});
  });
}

/* ===================== VALIDATION ===================== */
function validateModel(){
  const errors=[],warnings=[];
  const add=(arr,code,nodeId,path,desc,fix)=>arr.push({severity:arr===errors?"error":"warning",code,nodeId,propertyPath:path,description:desc,fix});
  const out=id=>model.edges.filter(e=>e.source===id&&e.enabled!==false);
  const inc=id=>model.edges.filter(e=>e.target===id&&e.enabled!==false);
  for(const n of model.nodes){
    if(n.enabled===false)continue;
    const bt=baseType(n.type);
    if(!IMPLEMENTED.has(n.type)){add(warnings,"UNSUPPORTED_NODE",n.id,"type",n.name+" ("+LABELS[n.type]+") is a stub and will be skipped by the engine.","Replace with an implemented node or remove it.");}
    if(bt==="source"&&out(n.id).length===0)add(errors,"SOURCE_NO_OUT",n.id,"edges","'"+n.name+"' has no outgoing connection.","Connect it to a downstream node.");
    if(bt!=="source"&&n.type!=="sink"&&inc(n.id).length===0&&out(n.id).length===0)add(warnings,"DISCONNECTED",n.id,"edges","Node '"+n.name+"' is disconnected.","Connect it or delete it.");
    if(["workstation","queue","buffer","qualitycheck","router","delay","merge","conveyor"].includes(bt)&&out(n.id).length===0&&inc(n.id).length>0)add(errors,"NO_SUCCESSOR",n.id,"edges","'"+n.name+"' receives items but has no successor route (items would have nowhere to go).","Connect it to a downstream node or a Sink.");
    if(bt==="workstation"){const d=n.props.processingTimeDistribution;if(!d)add(errors,"NO_PROC",n.id,"processingTimeDistribution","'"+n.name+"' has no processing time.","Set a processing time distribution.");if((+n.props.parallelServers||0)<1)add(errors,"BAD_SERVERS",n.id,"parallelServers","'"+n.name+"' must have at least 1 server.","Set parallel servers ≥ 1.");if(distMean(d||{type:"constant",params:{value:0}})<0)add(errors,"NEG_TIME",n.id,"processingTimeDistribution","Negative processing time.","Use non-negative parameters.");}
    if(bt==="queue"||bt==="buffer"){const c=n.props.capacity;if(c!==""&&c!=null&&(+c<=0))add(errors,"BAD_CAP",n.id,"capacity","'"+n.name+"' has invalid capacity.","Use a positive capacity or leave blank for unlimited.");if((c===""||c==null)&&n.type!=="shelf")add(warnings,"UNLIMITED_Q",n.id,"capacity","'"+n.name+"' is an unlimited queue — WIP can grow without bound.","Set a finite capacity if the real system is bounded.");}
    if(n.type==="qualitycheck"){const pp=+n.props.passProbability;if(pp<0||pp>1||isNaN(pp))add(errors,"BAD_PROB",n.id,"passProbability","'"+n.name+"' pass probability must be 0–1.","Enter a value between 0 and 1.");const roles=out(n.id).map(e=>e.props.route);if(!roles.includes("pass"))add(warnings,"QC_NO_PASS",n.id,"edges","'"+n.name+"' has no 'pass' route.","Mark one outgoing connection as 'pass'.");}
    if(n.type==="router"&&n.props.routingRule==="percentage"){const es=out(n.id);const sum=es.reduce((s,e)=>s+(+(e.props.percent)||0),0);if(es.length&&Math.abs(sum-100)>0.01)add(errors,"PCT_SUM",n.id,"edges","Router '"+n.name+"' percentages sum to "+sum+"%, not 100%.","Adjust connection percentages to total 100%.");}
    if(bt==="source"){const d=n.props.interarrivalDistribution;if(!d)add(errors,"NO_ARR",n.id,"interarrivalDistribution","'"+n.name+"' has no arrival distribution.","Set an interarrival distribution.");}
  }
  const sinks=model.nodes.filter(n=>n.type==="sink");
  if(model.nodes.some(n=>baseType(n.type)==="source")&&sinks.length===0)add(warnings,"NO_SINK",null,null,"Model has a Source but no Sink — completed entities are never recorded.","Add a Sink node.");
  if(model.simulationSettings.warmup===0&&model.nodes.some(n=>baseType(n.type)==="source"))add(warnings,"NO_WARMUP",null,null,"No warm-up period set.","Consider a warm-up to exclude transient startup effects.");
  if(model.simulationSettings.replications<2)add(warnings,"ONE_REP",null,null,"Only one replication for a stochastic model.","Increase replications for confidence intervals (planned).");
  return {errors,warnings};
}
function validateSilently(){const v=validateModel();model.edges.forEach(e=>e._invalid=false);
  v.errors.filter(x=>x.code==="PCT_SUM").forEach(x=>{model.edges.filter(e=>e.source===x.nodeId).forEach(e=>e._invalid=true);});
  layoutEdges();if(ui.bottomTab==="validation")renderBottom();}

function setupCanvas(cv){const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;const ctx=cv.getContext("2d");ctx.scale(devicePixelRatio,devicePixelRatio);return {ctx,W,H};}

function drawCharts(R){
  const horizon=R.endTime;const warm=R.settings.warmup;
  // build time series from transferLog completions & wip via stateLog approximate
  const b=$("bbody");
  // Throughput cumulative from completedEntities
  const comps=R.completedEntities.map(e=>e.completedAt).sort((a,b)=>a-b);
  drawLine(b.querySelector('[data-c="throughput"]'),comps.map((t,i)=>[t,i+1]),horizon,"completions","var(--run)");
  // WIP over time: reconstruct from entity_created / entity_completed in eventLog
  const wipSeries=[];let wip=0;for(const e of R.eventLog){if(e.type==="entity_created")wip++;else if(e.type==="entity_completed"||e.type==="entity_scrapped")wip--;if(e.type==="entity_created"||e.type==="entity_completed"||e.type==="entity_scrapped")wipSeries.push([e.t,wip]);}
  drawStep(b.querySelector('[data-c="wip"]'),wipSeries,horizon,"WIP","var(--accent)");
  // Utilization bar
  drawBars(b.querySelector('[data-c="util"]'),R.stations.map(s=>[s.name,s.util*100]),"%");

function drawLine(cv,pts,xmax,unit,color){if(!cv)return;const {ctx,W,H}=setupCanvas(cv);ctx.clearRect(0,0,W,H);axis(ctx,W,H);if(!pts.length){return;}
  const ymax=Math.max(1,pts[pts.length-1][1]);const X=t=>34+(t/(xmax||1))*(W-42);const Y=v=>H-18-(v/ymax)*(H-26);
  ctx.strokeStyle=cssVar(color.replace("var(","").replace(")",""))||color;ctx.strokeStyle=resolveColor(color);ctx.lineWidth=1.8;ctx.beginPath();
  pts.forEach((p,i)=>{const x=X(p[0]),y=Y(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  labelAxes(ctx,W,H,ymax,xmax);}
function drawStep(cv,pts,xmax,unit,color){if(!cv)return;const {ctx,W,H}=setupCanvas(cv);ctx.clearRect(0,0,W,H);axis(ctx,W,H);if(!pts.length)return;
  const ymax=Math.max(1,Math.max(...pts.map(p=>p[1])));const X=t=>34+(t/(xmax||1))*(W-42);const Y=v=>H-18-(v/ymax)*(H-26);
  ctx.strokeStyle=resolveColor(color);ctx.lineWidth=1.6;ctx.beginPath();let py=Y(0);
  pts.forEach((p,i)=>{const x=X(p[0]);if(i)ctx.lineTo(x,py);const y=Y(p[1]);ctx.lineTo(x,y);py=y;});ctx.stroke();labelAxes(ctx,W,H,ymax,xmax);}
function drawBars(cv,data,unit){if(!cv)return;const {ctx,W,H}=setupCanvas(cv);ctx.clearRect(0,0,W,H);axis(ctx,W,H);if(!data.length)return;
  const ymax=Math.max(1,Math.max(...data.map(d=>d[1])));const bw=(W-44)/data.length;
  data.forEach((d,i)=>{const bh=(d[1]/ymax)*(H-26);const x=38+i*bw;ctx.fillStyle=d[1]>85?resolveColor("var(--blocked)"):resolveColor("var(--accent)");ctx.fillRect(x,H-18-bh,bw-6,bh);
    ctx.fillStyle=cssVar("--muted");ctx.font="9px sans-serif";ctx.save();ctx.translate(x+bw/2-3,H-16);ctx.rotate(0.5);ctx.fillText(d[0].slice(0,8),0,0);ctx.restore();});
  labelAxes(ctx,W,H,ymax,null);}
function drawHistogram(cv,vals){if(!cv)return;const {ctx,W,H}=setupCanvas(cv);ctx.clearRect(0,0,W,H);axis(ctx,W,H);if(!vals.length)return;
  const mn=Math.min(...vals),mx=Math.max(...vals)||mn+1;const bins=15,counts=new Array(bins).fill(0);
  vals.forEach(v=>{let bIdx=Math.floor((v-mn)/((mx-mn)||1)*bins);if(bIdx>=bins)bIdx=bins-1;if(bIdx<0)bIdx=0;counts[bIdx]++;});
  const ymax=Math.max(...counts);const bw=(W-44)/bins;ctx.fillStyle=resolveColor("var(--accent)");
  counts.forEach((c,i)=>{const bh=(c/ymax)*(H-26);ctx.fillRect(38+i*bw,H-18-bh,bw-2,bh);});labelAxes(ctx,W,H,ymax,mx);}
function labelAxes(ctx,W,H,ymax,xmax){ctx.fillStyle=cssVar("--faint");ctx.font="9px sans-serif";ctx.fillText((+ymax.toFixed(1)),2,12);ctx.fillText("0",22,H-16);if(xmax!=null)ctx.fillText((+xmax.toFixed(0)),W-24,H-6);}
function resolveColor(c){if(c&&c.startsWith("var("))return cssVar(c.slice(4,-1));return c;}

function drawMinimap(){const cv=$("minimap");if(!cv)return;const W=cv.width=cv.clientWidth,H=cv.height=cv.clientHeight;const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,W,H);if(!model.nodes.length)return;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;for(const n of model.nodes){minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x+120);maxy=Math.max(maxy,n.y+60);}
  const pad=20;const sc=Math.min((W-pad)/(maxx-minx||1),(H-pad)/(maxy-miny||1));
  ctx.strokeStyle=cssVar("--border2");ctx.lineWidth=0.5;
  model.edges.forEach(e=>{const s=nodeById(e.source),t=nodeById(e.target);if(!s||!t)return;ctx.beginPath();ctx.moveTo((s.x+60-minx)*sc+10,(s.y+30-miny)*sc+10);ctx.lineTo((t.x-minx)*sc+10,(t.y+30-miny)*sc+10);ctx.stroke();});
  ctx.fillStyle=cssVar("--accent");model.nodes.forEach(n=>{ctx.fillRect((n.x-minx)*sc+10,(n.y-miny)*sc+10,Math.max(3,120*sc),Math.max(2,60*sc));});}

/* ===================== SIMULATION RUN + ANIMATION ===================== */
const STATE_COLORS={idle:"--idle",processing:"--run",blocked:"--blocked",starved:"--starved",failed:"--failed",maintenance:"--maint",setup:"--setup","off-shift":"--off"};
function startSimulation(){
  const v=validateModel();
  if(v.errors.length){ui.bottomTab="validation";renderBottomTabs();renderBottom();setBottomHeight(Math.max(bottomH,240));toast(v.errors.length+" error(s) — fix before simulating");return;}
  clog("Simulation started (seed="+model.simulationSettings.seed+").");
  const sim=new Simulation(model,model.simulationSettings);
  let R;try{R=sim.run();}catch(err){toast("Simulation error: "+err.message);clog("ERROR: "+err.message);console.error(err);return;}
  ui.lastResults=R;
  clog("Completed: "+R.system.throughput+" entities, "+R.eventCount+" events, horizon "+fmt(R.system.horizon)+" "+model.simulationSettings.baseUnit+".");
  renderBottomTabs();
  // animation replay
  startAnimation(R);
}
function startAnimation(R){
  stopAnimTimers();
  ui.running=true;ui.paused=false;
  $("btnRun").disabled=true;$("btnPause").disabled=false;$("btnStop").disabled=false;$("btnPause").textContent="Pause";
  $("simClock").style.display="flex";
  const realtime=model.simulationSettings.realtime;
  const transfers=R.transferLog;const states=R.stateLog;const events=R.eventLog;
  // reset node visuals
  model.nodes.forEach(n=>setNodeVisual(n.id,"idle",0));
  const anim={simTime:0,ti:0,si:0,ei:0,endTime:R.endTime,tokens:[],lastReal:performance.now(),R};
  ui.anim=anim;
  if(ui.speed>=1e6||!realtime){ // jump to end instantly
    applyAllStates(states,R.endTime);updateSimClock(R.endTime,R);finishAnimation();return;}
  function frame(now){
    if(!ui.running){return;}
    if(ui.paused){anim.lastReal=now;anim._raf=requestAnimationFrame(frame);return;}
    const dtReal=(now-anim.lastReal)/1000;anim.lastReal=now;
    // sim-minutes per real-second: 1x => 20 sim-min/sec baseline
    const simPerSec=20*ui.speed;
    anim.simTime=Math.min(anim.endTime,anim.simTime+dtReal*simPerSec);
    // apply state changes up to simTime
    while(anim.si<states.length&&states[anim.si].t<=anim.simTime){const s=states[anim.si++];setNodeVisual(s.node,s.state,liveBadge(s.node,anim.simTime,R));}
    // spawn tokens for transfers in window
    while(anim.ti<transfers.length&&transfers[anim.ti].t<=anim.simTime){const tr=transfers[anim.ti++];if(ui.speed<=10)spawnToken(tr);}
    updateTokens(anim.simTime);
    updateBadges(anim.simTime,R);
    updateSimClock(anim.simTime,R);
    if(anim.simTime>=anim.endTime){finishAnimation();return;}
    anim._raf=requestAnimationFrame(frame);
  }
  anim._raf=requestAnimationFrame(frame);
}
function liveBadge(){return 0;}
// Moving items are drawn as screws (raw parts) until they leave an assembly step,
// after which they become diamonds (finished products).
const TOK_SCREW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M12 3v4"/><path d="M8 7h8l-1.5 3H9.5z"/><path d="M11 10l1.6 9L14 10"/></svg>';
const TOK_DIAMOND='<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M5 9h14l-7 11zM5 9l3-4h8l3 4M9 9l3-4M15 9l-3-4"/></svg>';
function spawnToken(tr){
  const s=nodeById(tr.from),t=nodeById(tr.to);if(!s||!t)return;
  const a=portPos(s,"out"),b=portPos(t,"in");
  const isProduct=["assembly","robot"].includes(s.type); // just came off an assembly step
  const el=document.createElement("div");el.className="token "+(isProduct?"tok-product":"tok-part");
  el.innerHTML=isProduct?TOK_DIAMOND:TOK_SCREW;
  world.appendChild(el);
  ui.anim.tokens.push({el,a,b,start:tr.t,dur:Math.max(0.4,tr.dur||(6/(ui.speed))),born:performance.now()});
}
function updateTokens(simTime){
  const toks=ui.anim.tokens;const now=performance.now();
  for(let i=toks.length-1;i>=0;i--){const tk=toks[i];const life=(now-tk.born)/1000*(20*ui.speed);const prog=Math.min(1,life/ (tk.dur||3));
    const x=tk.a.x+(tk.b.x-tk.a.x)*prog,y=tk.a.y+(tk.b.y-tk.a.y)*prog;
    tk.el.style.left=x+"px";tk.el.style.top=y+"px";
    if(prog>=1){tk.el.remove();toks.splice(i,1);}
  }
}
function updateBadges(simTime,R){
  // reconstruct queue lengths / server load from events up to simTime
  if(!ui.anim._badgeTick||performance.now()-ui.anim._badgeTick>120){ui.anim._badgeTick=performance.now();}else return;
  const counts={};
  for(const e of R.eventLog){if(e.t>simTime)break;
    if(e.type==="queue_entered")counts[e.nodeId]=(counts[e.nodeId]||0)+1;
    if(e.type==="queue_left")counts[e.nodeId]=(counts[e.nodeId]||0)-1;
    if(e.type==="processing_started")counts[e.nodeId]=(counts[e.nodeId]||0)+1;
    if(e.type==="processing_completed"||e.type==="entity_completed"){/* leaves via transfer */}
  }
  model.nodes.forEach(n=>{const el=world.querySelector('.node[data-id="'+n.id+'"] [data-badge]');if(!el)return;const c=counts[n.id];if(c&&c>0){el.style.display="flex";el.textContent=c;}else el.style.display="none";});
}
function setNodeVisual(id,state,badge){const el=world.querySelector('.node[data-id="'+id+'"]');if(!el)return;const dot=el.querySelector("[data-dot]");if(dot)dot.style.background=cssVar(STATE_COLORS[state]||"--idle");}
function applyAllStates(states,upto){const last={};states.forEach(s=>{if(s.t<=upto)last[s.node]=s.state;});Object.keys(last).forEach(id=>setNodeVisual(id,last[id]));}
function updateSimClock(t,R){const s=R.system;$("simClock").innerHTML='<span>t = <b>'+fmt(t)+'</b> '+model.simulationSettings.baseUnit+'</span><span>done <b>'+countCompleted(R,t)+'</b></span><span>WIP <b>'+countWip(R,t)+'</b></span>';
  if(ui.bottomTab==="kpis"&&ui.anim&&t>=R.endTime)renderBottom();}
function countCompleted(R,t){let c=0;for(const e of R.eventLog){if(e.t>t)break;if(e.type==="entity_completed")c++;}return c;}
function countWip(R,t){let c=0;for(const e of R.eventLog){if(e.t>t)break;if(e.type==="entity_created")c++;else if(e.type==="entity_completed"||e.type==="entity_scrapped")c--;}return c;}
function finishAnimation(){
  ui.running=false;ui.paused=false;
  $("btnRun").disabled=false;$("btnPause").disabled=true;$("btnStop").disabled=true;
  if(ui.anim){ui.anim.tokens.forEach(t=>t.el.remove());}
  renderBottom();toast("Simulation finished — "+ui.lastResults.system.throughput+" completed");clog("Animation finished.");
}
function togglePause(){if(!ui.running)return;ui.paused=!ui.paused;$("btnPause").textContent=ui.paused?"Resume":"Pause";}
function stopSimulation(){if(!ui.running)return;stopAnimTimers();finishAnimation();}
function stopAnimTimers(){if(ui.anim&&ui.anim._raf)cancelAnimationFrame(ui.anim._raf);}

function openScenarios(){
  const list=model.scenarios||[];
  let h='<div class="help">A scenario is a full snapshot you can tweak and compare against the current model. Run each, then Compare.</div>';
  h+='<div style="margin-bottom:10px"><button id="scAdd">+ Snapshot current model as scenario</button></div>';

    list.forEach((sc,i)=>{h+='<tr><td>'+esc(sc.name)+'</td><td class="num">'+(sc.results?sc.results.system.throughput:"—")+'</td><td class="num">'+(sc.results?fmt(sc.results.system.leadTimeAvg):"—")+'</td><td class="num">'+(sc.results?fmt(sc.results.system.wip):"—")+'</td>'+
      '<td><button data-run="'+i+'">Run</button> <button data-load="'+i+'">Load</button> <button data-del="'+i+'">✕</button></td></tr>';});
    h+='</tbody></table><div style="margin-top:10px"><button id="scCompare" class="primary">Compare all</button></div>';}
  openModal("Scenarios",h,[["Close",closeModal,""]]);
  $("scAdd").onclick=()=>{const name=prompt("Scenario name:","Scenario "+(list.length+1));if(!name)return;
    model.scenarios.push({id:uid("sc"),name,snapshot:JSON.stringify({nodes:model.nodes,edges:model.edges,settings:model.simulationSettings}),results:null});markDirty();openScenarios();};
  document.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>{runScenario(list[+b.dataset.run]);openScenarios();});
  document.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{const sc=list[+b.dataset.load];const o=JSON.parse(sc.snapshot);pushUndo();model.nodes=o.nodes;model.edges=o.edges;model.simulationSettings=o.settings;markDirty();renderNodes();closeModal();toast("Loaded "+sc.name);});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{model.scenarios.splice(+b.dataset.del,1);markDirty();openScenarios();});
  const cmp=$("scCompare");if(cmp)cmp.onclick=compareScenarios;
}
function runScenario(sc){const o=JSON.parse(sc.snapshot);const m={nodes:o.nodes,edges:o.edges,productTypes:model.productTypes};const sim=new Simulation(m,o.settings);sc.results=sim.run();toast("Ran "+sc.name);}
function compareScenarios(){
  const list=model.scenarios.filter(s=>{if(!s.results)runScenario(s);return true;});
  const base=list[0];
  const rows=[["Throughput","throughput",0],["Avg lead time","leadTimeAvg",1],["Avg WIP","wip",1],["Throughput rate","throughputRate",1],["Scrap","scrap",0]];
  let h='<table><thead><tr><th>KPI</th>'+list.map(s=>'<th class="num">'+esc(s.name)+'</th>').join("")+'</tr></thead><tbody>';
  rows.forEach(([label,key])=>{h+='<tr><td>'+label+'</td>'+list.map((s,i)=>{const v=s.results.system[key];const bv=base.results.system[key];let delta="";if(i>0&&bv){const pct=((v-bv)/bv*100);delta=' <span class="'+(pct>=0?"pos":"neg")+'">('+(pct>=0?"+":"")+pct.toFixed(1)+'%)</span>';}return '<td class="num">'+fmt(v)+delta+'</td>';}).join("")+'</tr>';});
  h+='</tbody></table><div class="help" style="margin-top:8px">Percentage change vs. the first scenario (baseline).</div>';

/* ===================== EXPERIMENTS (parameter sweep) ===================== */
function renderExperiments(){
  const b=$("bbody");
  const stations=model.nodes.filter(n=>WORKSTATIONLIKE.has(n.type));
  const queues=model.nodes.filter(n=>n.type==="queue"||n.type==="buffer");
  let opts=[];stations.forEach(n=>opts.push(["srv|"+n.id,n.name+" · parallel servers"]));queues.forEach(n=>opts.push(["cap|"+n.id,n.name+" · capacity"]));
  b.innerHTML='<div class="row" style="align-items:flex-end"><div class="field"><label>Parameter</label><select id="ex_param">'+(opts.length?opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join(""):'<option>No sweepable parameters</option>')+'</select></div>'+
    '<div class="field"><label>Values (comma sep.)</label><input id="ex_vals" value="1,2,3"/></div>'+
    '<div class="field" style="flex:0"><button class="primary" id="ex_run">Run sweep</button></div></div>'+
    '<div id="ex_out"></div>';
  const rb=$("ex_run");if(rb)rb.onclick=runSweep;
}
function runSweep(){
  const param=$("ex_param").value;const vals=$("ex_vals").value.split(",").map(x=>+x.trim()).filter(x=>!isNaN(x));
  if(!param||!vals.length)return;const [kind,id]=param.split("|");
  const results=[];
  for(const v of vals){
    const clone=JSON.parse(JSON.stringify({nodes:model.nodes,edges:model.edges}));
    const n=clone.nodes.find(x=>x.id===id);if(!n)continue;
    if(kind==="srv")n.props.parallelServers=v;if(kind==="cap")n.props.capacity=v;
    const sim=new Simulation({nodes:clone.nodes,edges:clone.edges,productTypes:model.productTypes},model.simulationSettings);
    const R=sim.run();results.push({v,tp:R.system.throughput,lt:R.system.leadTimeAvg,wip:R.system.wip});
  }
  const best=results.reduce((a,c)=>c.tp>a.tp?c:a,results[0]);
  let h='<table style="margin-top:10px"><thead><tr><th>Value</th><th class="num">Throughput</th><th class="num">Avg lead time</th><th class="num">Avg WIP</th></tr></thead><tbody>'+
    results.map(r=>'<tr'+(r===best?' style="background:rgba(62,207,142,.08)"':'')+'><td>'+r.v+(r===best?' ★':'')+'</td><td class="num">'+r.tp+'</td><td class="num">'+fmt(r.lt)+'</td><td class="num">'+fmt(r.wip)+'</td></tr>').join("")+'</tbody></table>'+
    '<div class="help" style="margin-top:6px">★ best configuration by throughput: value = '+best.v+'. (Optimization hooks: replace the ranking with a search algorithm later.)</div>';
  $("ex_out").innerHTML=h;
}

function exportJSON(){
  const out={schemaVersion:"1.0",metadata:{name:model.name,description:model.description,exportedAt:new Date().toISOString()},
    simulationSettings:model.simulationSettings,productTypes:model.productTypes,resources:model.resources,calendars:model.calendars,
    nodes:model.nodes.map(stripRuntime),edges:model.edges.map(e=>{const c=Object.assign({},e);delete c._invalid;return c;}),scenarios:model.scenarios};
  download(model.name.replace(/\s+/g,"_")+".flowforge.json",JSON.stringify(out,null,2));toast("Model exported");

function stripRuntime(n){const c=JSON.parse(JSON.stringify(n));return c;}
function download(name,content){const blob=new Blob([content],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$("fileInput").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;if(f.size>5e6){toast("File too large (>5MB)");return;}
  const rd=new FileReader();rd.onload=()=>{try{importModel(JSON.parse(rd.result));}catch(err){toast("Import failed: "+err.message);}};rd.readAsText(f);e.target.value="";});
function importModel(data){
  if(!data||typeof data!=="object")throw new Error("invalid JSON");
  if(data.schemaVersion&&data.schemaVersion!=="1.0")clog("Schema version "+data.schemaVersion+" — attempting import.");
  pushUndo();
  model.name=(data.metadata&&data.metadata.name)||"Imported model";
  model.simulationSettings=Object.assign(blankModel().simulationSettings,data.simulationSettings||{});
  model.productTypes=data.productTypes&&data.productTypes.length?data.productTypes:blankModel().productTypes;
  model.resources=data.resources||[];model.calendars=data.calendars||[];model.scenarios=data.scenarios||[];
  model.nodes=(data.nodes||[]).map(n=>{n.id=n.id||uid("n");n.props=n.props||defaultProps(n.type);n.enabled=n.enabled!==false;n.tags=n.tags||[];return n;});
  const ids=new Set(model.nodes.map(n=>n.id));
  model.edges=(data.edges||[]).filter(e=>ids.has(e.source)&&ids.has(e.target)).map(e=>{e.id=e.id||uid("e");e.props=e.props||{};return e;});
  model.annotations=(data.annotations||[]).map(a=>{a.id=a.id||uid("a");return a;});
  ui.selection.clear();ui.selEdge=null;ui.selAnno=null;markDirty();renderHeader();renderNodes();renderProps();fitView();toast("Imported: "+model.name);clog("Imported model with "+model.nodes.length+" nodes.");
}
function exportCSV(R){
  let rows=[["metric","value","unit"]];
  const s=R.system;rows.push(["throughput",s.throughput,"entities"],["throughput_rate",s.throughputRate.toFixed(4),"per_hour"],["avg_wip",s.wip.toFixed(4),"entities"],["avg_lead_time",s.leadTimeAvg.toFixed(4),model.simulationSettings.baseUnit],["median_lead_time",s.leadTimeMed.toFixed(4),model.simulationSettings.baseUnit],["scrap",s.scrap,"entities"]);
  rows.push([]);rows.push(["station","utilization","blocked","starved","processed"]);
  R.stations.forEach(st=>rows.push([st.name,st.util.toFixed(4),st.blocked.toFixed(4),st.starved.toFixed(4),st.processed]));
  download(model.name.replace(/\s+/g,"_")+"_kpis.csv",rows.map(r=>r.join(",")).join("\n"));toast("KPIs exported to CSV");
}

  '<li><b>Warm-up period</b> — an initial stretch that is <b>excluded</b> from the results, so the empty-startup phase does not distort the averages.</li>'+
  '<li><b>Random seed</b> — the starting point for the random numbers. Same seed = exactly the same result every time (repeatable). Change it to see a different "day".</li>'+

  '<li><b>Event log level</b> — how much detail to record (off / normal / full). "Full" is slower but shows every event.</li>'+
  '<li><b>Stop condition</b> — end when the clock reaches the run length (<b>Fixed sim time</b>), or when a <b>Target quantity</b> of items is finished.</li>'+

  '<ul style="margin:0;padding-left:18px">'+
  '<li><b>General</b> — the block name and free-text notes.</li>'+
