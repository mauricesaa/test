  '<li><b>Resources</b> — shared workers/tools/machine slots. <i>Note: placeholder — today the number of servers is the capacity limit (planned for a later version).</i></li>'+
  '<li><b>Schedule</b> — shift calendars / working hours to pause a step outside its shift. <i>Note: placeholder — it is part of the model but does not yet gate the run (planned).</i></li>'+
  '<li><b>Costs</b> — cost per hour and energy per hour for a step.</li>'+
  '<li><b>Visualization</b> — the live count badge and status colour shown on the block while running.</li>'+
  '<li><b>Advanced</b> — the internal block ID and free-text tags.</li>'+
  '</ul>'+

  '<h4 style="margin:14px 0 4px;color:var(--accent)">Results panel — the tabs at the bottom</h4>'+
  '<ul style="margin:0;padding-left:18px">'+
  '<li><b>Live Events</b> — a running log of what happened (item arrived, started, finished, blocked).</li>'+
  '<li><b>KPIs</b> — the headline numbers: throughput (items finished), cycle / lead time (how long one item takes end-to-end), and work-in-progress (items inside the system).</li>'+
  '<li><b>Charts</b> — the numbers over time; can be exported to CSV.</li>'+
  '<li><b>Bottlenecks</b> — ranks the slowest / busiest steps that hold everything up, with the reason (very busy, blocked, or starved).</li>'+
  '<li><b>Resources</b> — per-station and per-queue detail (utilisation, items done, average waiting-line length).</li>'+
  '<li><b>Experiment Results</b> — automatically try a range of values for one setting and see which gives the best result.</li>'+
  '<li><b>Validation</b> — the mistake list from the <b>Check</b> button (errors in red, warnings in amber).</li>'+
  '<li><b>Console</b> — technical run messages (seed used, stop reason, timings).</li>'+
  '</ul>'+

  '<h4 style="margin:14px 0 4px;color:var(--accent)">Compare, save and share</h4>'+
  '<ul style="margin:0;padding-left:18px">'+
  '<li><b>Scenarios</b> — save versions (e.g. "add a 2nd oven") and compare their results side by side.</li>'+
  '<li><b>Experiment Results</b> tab — try a range of values automatically and see which is best.</li>'+
  '<li><b>Save</b> keeps it in your browser; <b>Export</b>/<b>Import</b> move it as a file; charts export to CSV.</li>'+
  '</ul>'+

  '<h4 style="margin:14px 0 4px;color:var(--accent)">Keyboard shortcuts</h4>'+
  '<ul style="margin:0;padding-left:18px">'+
  '<li><span class="kbd">Ctrl/Cmd+S</span> Save · <span class="kbd">Ctrl/Cmd+Z</span> Undo · <span class="kbd">Ctrl/Cmd+Shift+Z</span> Redo</li>'+
  '<li><span class="kbd">Ctrl/Cmd+C/V/D</span> Copy / Paste / Duplicate · <span class="kbd">Delete</span> remove · <span class="kbd">F</span> fit · <span class="kbd">Ctrl/Cmd+Enter</span> Run · <span class="kbd">Esc</span> close</li>'+
  '</ul>'+
  '</div>';
  openModal("&#9432; What can FlowForge Studio do?",h,[["Got it",closeModal,"primary"]]);
}

/* ===================== EXAMPLES ===================== */
function openExamples(){
  const ex=EXAMPLES();
  let h=ex.map((e,i)=>'<div class="ex-card" data-ex="'+i+'"><h4>'+e.name+'</h4><p>'+e.desc+'</p></div>').join("");
  openModal("Example Models",h,[["Close",closeModal,""]]);
  document.querySelectorAll("[data-ex]").forEach(c=>c.onclick=()=>{loadExample(ex[+c.dataset.ex]);closeModal();});
}
function loadExample(ex){pushUndo();model=blankModel();model.name=ex.name;model.nodes=ex.nodes;model.edges=ex.edges;model.annotations=ex.annotations||[];if(ex.settings)Object.assign(model.simulationSettings,ex.settings);
  ui.selection.clear();ui.selEdge=null;ui.selAnno=null;ui.lastResults=null;renderHeader();renderNodes();renderProps();fitView();markDirty();toast("Loaded: "+ex.name);}
function mkNode(type,name,x,y,props){return {id:uid("n"),type,name,x,y,width:120,height:60,enabled:true,tags:[],notes:"",props:Object.assign(defaultProps(type),props||{}),visualSettings:{}};}
function mkEdge(s,t,props){return {id:uid("e"),source:s.id,target:t.id,sourcePortId:"out",targetPortId:"in",routingRule:"default",priority:0,transportTime:0,enabled:true,props:props||{}};}
function EXAMPLES(){
  // 1 Simple line
  const ex1=(()=>{const src=mkNode("source","Source",80,120,{interarrivalDistribution:{type:"constant",params:{value:5}}});
    const q=mkNode("queue","Queue",300,120,{});const ws=mkNode("workstation","Workstation",520,120,{processingTimeDistribution:{type:"constant",params:{value:4}}});
    const sink=mkNode("sink","Sink",740,120);return {name:"1 · Simple Production Line",desc:"Source → Queue → Workstation → Sink. Constant 5-min arrivals, 4-min processing.",nodes:[src,q,ws,sink],edges:[mkEdge(src,q),mkEdge(q,ws),mkEdge(ws,sink)],settings:{runLength:480}};})();
  // 2 Parallel machines
  const ex2=(()=>{const src=mkNode("source","Source",60,160,{interarrivalDistribution:{type:"exponential",params:{mean:3}}});
    const r=mkNode("router","Router",260,160,{routingRule:"shortestQueue"});
    const qa=mkNode("queue","Queue A",440,80),qb=mkNode("queue","Queue B",440,260);
    const wa=mkNode("workstation","Machine A",640,80,{processingTimeDistribution:{type:"normal",params:{mean:6,std:1}}});
    const wb=mkNode("workstation","Machine B",640,260,{processingTimeDistribution:{type:"normal",params:{mean:6,std:1}}});
    const m=mkNode("merge","Merge",840,160);const sink=mkNode("sink","Sink",1020,160);
    return {name:"2 · Parallel Machines",desc:"Router splits to two machines by shortest queue, then Merge → Sink.",nodes:[src,r,qa,qb,wa,wb,m,sink],edges:[mkEdge(src,r),mkEdge(r,qa),mkEdge(r,qb),mkEdge(qa,wa),mkEdge(qb,wb),mkEdge(wa,m),mkEdge(wb,m),mkEdge(m,sink)],settings:{runLength:480}};})();
  // 3 Quality + rework
  const ex3=(()=>{const src=mkNode("source","Source",60,160,{interarrivalDistribution:{type:"constant",params:{value:5}}});
    const q=mkNode("queue","Queue",240,160);const prod=mkNode("workstation","Production",420,160,{processingTimeDistribution:{type:"triangular",params:{min:3,mode:4,max:6}}});
    const qc=mkNode("qualitycheck","Quality Check",620,160,{passProbability:0.8});
    const sink=mkNode("sink","Sink",840,80);const scrap=mkNode("sink","Scrap Sink",840,280);
    return {name:"3 · Quality Inspection & Rework",desc:"Production → Quality Check; 80% pass → Sink, 20% fail → Scrap Sink.",nodes:[src,q,prod,qc,sink,scrap],edges:[mkEdge(src,q),mkEdge(q,prod),mkEdge(prod,qc),mkEdge(qc,sink,{route:"pass"}),mkEdge(qc,scrap,{route:"scrap"})],settings:{runLength:480}};})();
  // 4 Assembly
  const ex4=(()=>{const a=mkNode("source","Component A",60,80,{interarrivalDistribution:{type:"constant",params:{value:5}}});
    const bsrc=mkNode("source","Component B",60,260,{interarrivalDistribution:{type:"constant",params:{value:5}}});
    const qa=mkNode("queue","Queue A",260,80),qb=mkNode("queue","Queue B",260,260);
    const asm=mkNode("workstation","Assembly",480,170,{processingTimeDistribution:{type:"constant",params:{value:6}}});
    const test=mkNode("workstation","Final Test",680,170,{processingTimeDistribution:{type:"normal",params:{mean:3,std:0.5}}});
    const sink=mkNode("sink","Sink",880,170);
    return {name:"4 · Assembly",desc:"Two component sources feed an assembly station, then Final Test → Sink. (MVP models assembly as a merge+process.)",nodes:[a,bsrc,qa,qb,asm,test,sink],edges:[mkEdge(a,qa),mkEdge(bsrc,qb),mkEdge(qa,asm),mkEdge(qb,asm),mkEdge(asm,test),mkEdge(test,sink)],settings:{runLength:480}};})();
  // 5 Restaurant (service industry)
  const ex5=(()=>{
    const guests=mkNode("source","Guests arrive",60,200,{interarrivalDistribution:{type:"exponential",params:{mean:4}}});
    const wait=mkNode("queue","Wait for a table",240,200,{capacity:20,queueDiscipline:"FIFO"});
    const order=mkNode("workstation","Waiter takes order",420,200,{processingTimeDistribution:{type:"triangular",params:{min:2,mode:3,max:5}},parallelServers:2});
    const kq=mkNode("queue","Order sent to kitchen",600,200,{});
    const kitchen=mkNode("workstation","Kitchen (chefs cook)",780,200,{processingTimeDistribution:{type:"triangular",params:{min:6,mode:9,max:14}},parallelServers:3});
    const dine=mkNode("delay","Guests eat (dining time)",960,200,{delayDistribution:{type:"normal",params:{mean:35,std:8}}});
    const pay=mkNode("workstation","Pay the bill",1140,200,{processingTimeDistribution:{type:"exponential",params:{mean:3}},parallelServers:1});
    const leave=mkNode("sink","Guests leave",1320,200);
    return {name:"5 · Restaurant service",desc:"Guests arrive → wait for a table → waiter takes the order → kitchen cooks → dining time → pay → leave. Shows queues, staff as parallel servers, and a machine-free wait (dining).",
      nodes:[guests,wait,order,kq,kitchen,dine,pay,leave],
      edges:[mkEdge(guests,wait),mkEdge(wait,order),mkEdge(order,kq),mkEdge(kq,kitchen),mkEdge(kitchen,dine),mkEdge(dine,pay),mkEdge(pay,leave)],
      settings:{runLength:600,warmup:60}};
  })();
  // 6 Bicycle assembly line — intake to delivery (manufacturing + warehousing + supply + quality + transport)
  const ex6=(()=>{
    const order=mkNode("source","Order intake",40,220,{interarrivalDistribution:{type:"constant",params:{value:6}}});
    const wh=mkNode("buffer","Parts warehouse (supply)",220,220,{capacity:60,queueDiscipline:"FIFO"});
    const frame=mkNode("workstation","Frame build",410,220,{processingTimeDistribution:{type:"normal",params:{mean:8,std:1}},parallelServers:2});
    const q1=mkNode("queue","Buffer",590,220,{capacity:10});
    const wheels=mkNode("workstation","Wheel building",720,220,{processingTimeDistribution:{type:"normal",params:{mean:6,std:1}},parallelServers:2});
    const q2=mkNode("queue","Buffer 2",900,220,{capacity:10});
    const drive=mkNode("workstation","Drivetrain & brakes",1030,220,{processingTimeDistribution:{type:"triangular",params:{min:5,mode:7,max:10}},parallelServers:2});
    const qc=mkNode("qualitycheck","Final inspection",1220,220,{passProbability:0.9,parallelServers:1});
    const pack=mkNode("conveyor","Packaging line",1410,140,{transportTime:4,capacity:20});
    const dispatch=mkNode("sink","Dispatch / delivery",1600,140);
    const reject=mkNode("sink","Rejected (scrap)",1410,320);
    return {name:"6 · Bicycle assembly line (intake → delivery)",desc:"Order intake → parts warehouse → frame → wheels → drivetrain & brakes → final inspection → packaging conveyor → delivery. Failed bikes are scrapped. Covers material supply, warehousing, cycle time, quality and transport.",
      nodes:[order,wh,frame,q1,wheels,q2,drive,qc,pack,dispatch,reject],
      edges:[mkEdge(order,wh),mkEdge(wh,frame),mkEdge(frame,q1),mkEdge(q1,wheels),mkEdge(wheels,q2),mkEdge(q2,drive),mkEdge(drive,qc),mkEdge(qc,pack,{route:"pass"}),mkEdge(pack,dispatch),mkEdge(qc,reject,{route:"scrap"})],
      settings:{runLength:600,warmup:60}};
  })();
  return [ex1,ex2,ex3,ex4,ex5,ex6];
}

/* ===================== MODAL / TOAST ===================== */
function openModal(title,body,buttons){
  $("modal").innerHTML='<div class="modal-h">'+title+'<button class="close" onclick="closeModal()">×</button></div><div class="modal-b">'+body+'</div>'+
    '<div class="modal-f" id="modalF"></div>';
  const f=$("modalF");(buttons||[]).forEach(([lb,fn,cls])=>{const btn=document.createElement("button");btn.textContent=lb;if(cls)btn.className=cls;btn.onclick=fn;f.appendChild(btn);});
  $("modalBg").classList.add("show");
}
function closeModal(){$("modalBg").classList.remove("show");}
$("modalBg").addEventListener("mousedown",e=>{if(e.target===$("modalBg"))closeModal();});
let toastTimer;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200);}

/* ===================== THEME ===================== */
function toggleTheme(){const el=document.documentElement;el.dataset.theme=el.dataset.theme==="dark"?"light":"dark";localStorage.setItem("flowforge:theme",el.dataset.theme);renderNodes();if(ui.lastResults&&ui.bottomTab==="charts")renderBottom();}

/* ===================== BOTTOM RESIZE ===================== */
function setBottomHeight(h){bottomH=Math.max(80,Math.min(window.innerHeight-260,h));$("bbody").style.height=(bottomH-32)+"px";}
(function(){let dragging=false;$("bhandle").addEventListener("mousedown",()=>{dragging=true;document.body.style.userSelect="none";});
  window.addEventListener("mousemove",e=>{if(!dragging)return;const r=$("bottom").getBoundingClientRect();setBottomHeight(r.bottom-e.clientY);});
  window.addEventListener("mouseup",()=>{dragging=false;document.body.style.userSelect="";});})();

/* ===================== KEYBOARD ===================== */
window.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!isTyping(e)){spaceDown=true;canvas.style.cursor="grab";}
  if(isTyping(e))return;
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();saveLocal();toast("Saved");}
  else if(mod&&e.shiftKey&&e.key.toLowerCase()==="z"){e.preventDefault();redo();}
  else if(mod&&e.key.toLowerCase()==="z"){e.preventDefault();undo();}
  else if(mod&&e.key.toLowerCase()==="c"){copySel();}
  else if(mod&&e.key.toLowerCase()==="v"){pasteSel();}
  else if(mod&&e.key.toLowerCase()==="d"){e.preventDefault();duplicateSelection();}
  else if(mod&&e.key==="Enter"){e.preventDefault();startSimulation();}
  else if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();deleteSelection();}
  else if(e.key.toLowerCase()==="f"){fitView();}
  else if(e.key==="Escape"){if($("modalBg").classList.contains("show"))closeModal();else clearSel();}
});
window.addEventListener("keyup",e=>{if(e.code==="Space"){spaceDown=false;canvas.style.cursor="";}});
function isTyping(e){const t=e.target;return t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT");}
window.addEventListener("beforeunload",e=>{if(ui.dirty){e.preventDefault();e.returnValue="";}});

/* ===================== INIT ===================== */
function init(){
  const savedTheme=localStorage.getItem("flowforge:theme");if(savedTheme)document.documentElement.dataset.theme=savedTheme;
  renderHeader();renderLibrary();renderBottomTabs();applyTransform();
  $("libSearch").addEventListener("input",e=>renderLibrary(e.target.value));
  setBottomHeight(200);
  // load last or example 1
  const last=localStorage.getItem("flowforge:last");let loaded=false;
  if(last){try{const m=JSON.parse(localStorage.getItem("flowforge:"+last));if(m&&m.nodes){model=m;model.scenarios=model.scenarios||[];model.annotations=model.annotations||[];loaded=true;}}catch(e){}}
  if(!loaded){loadExample(EXAMPLES()[0]);ui.dirty=false;updateSaveStatus();}
  else{renderNodes();renderProps();fitView();}
  ui.bottomTab="kpis";renderBottom();
  clog("Loaded "+model.name+" ("+model.nodes.length+" nodes).");
}
init();




</script>
