<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quick projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#F4FAF6; --bg2:#E8F8F5; --bg3:#D2F3EF; --bg4:#AEECE5; --bg5:#8DDFD8; --bg6:#73D2CF;
  --ink:#102829; --body:#1B3336; --accent:#007E88; --accent2:#008C99; --muted2:#5D6D6F; --meta:#899799;
  --label:#405052;
  --card:rgba(255,255,255,0.90); --cardSolid:#FFFFFF;
  --cardBorder:rgba(255,255,255,0.68);
  --pill:rgba(255,255,255,0.72); --pillBorder:rgba(255,255,255,0.75);
  --btn:#73E6D3; --btn2:#7CEBD8;
  --track:#E5EEEE;
  --inputBorder:#D9E8E8; --focus:#6FDCCD;
  --green:#2FA98C; --greenBg:#DCF3EC;
  --yellow:#C98A2E; --yellowBg:#FBEED6;
  --red:#C4574F; --redBg:#F8E0DD;
  --shadow:0 24px 70px rgba(20,65,70,0.08);
  --pillShadow:0 10px 28px rgba(20,65,70,0.07);
  --btnShadow:0 14px 34px rgba(73,205,190,0.28);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter','Helvetica Neue',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans); color:var(--body);
  background:
    radial-gradient(1200px 800px at 8% -5%, #F6FCF8 0%, rgba(246,252,248,0) 55%),
    radial-gradient(1100px 900px at 95% 0%, #E3F7F3 0%, rgba(227,247,243,0) 50%),
    radial-gradient(1400px 1100px at 60% 30%, #D8F4F0 0%, rgba(216,244,240,0) 55%),
    radial-gradient(1300px 1200px at 20% 90%, #C6EFEA 0%, rgba(198,239,234,0) 55%),
    radial-gradient(1500px 1300px at 90% 95%, #AEE9E4 0%, rgba(174,233,228,0) 60%),
    linear-gradient(160deg, #F4FAF6 0%, #E8F8F5 30%, #D9F4EF 60%, #C8EEEA 100%);
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.5;
}
h1,h2,h3,h4{margin:0;color:var(--ink);}
button{font-family:var(--sans);cursor:pointer;}
a{color:var(--accent);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(115,210,207,0.4);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Scroll UX: progress bar · section nav · reveal-on-scroll ---------- */
#scrollProgress{position:fixed;top:0;left:0;height:3px;width:0;z-index:45;pointer-events:none;
  background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 1px 6px rgba(0,126,136,0.35);}
#sectionNav{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:45;
  display:flex;flex-direction:column;gap:9px;padding:11px 9px;max-height:82vh;overflow:auto;
  background:rgba(255,255,255,0.55);border:1px solid var(--cardBorder);border-radius:16px;
  backdrop-filter:blur(6px);box-shadow:var(--pillShadow);}
#sectionNav::-webkit-scrollbar{width:0;height:0;}
#sectionNav a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted2);
  font-size:11px;font-weight:600;white-space:nowrap;line-height:1;}
#sectionNav a .dot{width:9px;height:9px;border-radius:50%;background:var(--track);
  border:1px solid rgba(0,126,136,0.35);flex:0 0 auto;transition:background .2s ease,transform .2s ease;}
#sectionNav a .lbl{max-width:0;overflow:hidden;opacity:0;transition:max-width .25s ease,opacity .25s ease;}
#sectionNav:hover a .lbl{max-width:180px;opacity:1;}
#sectionNav a:hover{color:var(--accent2);}
#sectionNav a:hover .dot{background:var(--accent2);}
#sectionNav a.active{color:var(--accent);}
#sectionNav a.active .dot{background:var(--accent);transform:scale(1.35);box-shadow:0 0 0 3px rgba(0,126,136,0.15);}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease;}
.reveal.in{opacity:1;transform:none;}
@media (max-width:1250px){ #sectionNav{display:none!important;} }
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1!important;transform:none!important;transition:none!important;}
}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--cardBorder);border-radius:32px;box-shadow:var(--shadow);padding:26px 28px;backdrop-filter:blur(6px);}
.card.tight{padding:20px 22px;border-radius:26px;}
.card h3.card-title{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-0.01em;}
.card .card-sub{font-size:12.5px;color:var(--muted2);margin-top:5px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.grid{display:grid;gap:18px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g5{grid-template-columns:repeat(5,1fr);}
.mb{margin-bottom:18px;}
.mt{margin-top:18px;}
@media(max-width:1200px){.g4,.g5{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:820px){.g2,.g3,.g4,.g5{grid-template-columns:1fr;}}

/* ---------- KPI ---------- */
.kpi{background:var(--card);border:1px solid var(--cardBorder);border-radius:26px;padding:20px 22px;box-shadow:var(--shadow);}
.kpi .k-label{font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--label);}
.kpi .k-value{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink);margin-top:8px;letter-spacing:-0.01em;line-height:1;}
.kpi .k-sub{font-size:12px;color:var(--muted2);margin-top:9px;}
.kpi .k-value.sm{font-size:24px;}

/* ---------- Pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--pill);border:1px solid var(--pillBorder);border-radius:20px;padding:8px 13px;box-shadow:var(--pillShadow);backdrop-filter:blur(4px);}
.pill .p-main{font-size:13px;font-weight:700;color:var(--ink);}
.pill .p-sec{font-size:9.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--meta);}
.pill.col{flex-direction:column;align-items:flex-start;gap:2px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:0.02em;padding:3px 10px;border-radius:12px;white-space:nowrap;}
.badge.green{background:var(--greenBg);color:var(--green);}
.badge.yellow{background:var(--yellowBg);color:var(--yellow);}
.badge.red{background:var(--redBg);color:var(--red);}
.badge.neutral{background:rgba(0,126,136,0.10);color:var(--accent);}
.badge.soft{background:rgba(16,40,41,0.06);color:var(--body);}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.dot.green{background:var(--green);}.dot.yellow{background:var(--yellow);}.dot.red{background:var(--red);}

/* ---------- Tables ---------- */
.tablewrap{overflow-x:auto;border-radius:20px;}
/* Freeze-pane header: the table scrolls sideways in its own box (overflow-x) but the page keeps a
   single vertical scrollbar. A JS-managed clone of the header row (.frozen-hdr) is pinned to the top
   of the window while the table is in view, and kept aligned with the columns / horizontal scroll. */
.tablewrap.sticky-head{overflow-x:auto;overflow-y:visible;}
.frozen-hdr{position:fixed;overflow:hidden;z-index:40;pointer-events:none;box-shadow:0 4px 10px rgba(16,40,41,0.10);}
.frozen-hdr table{border-collapse:collapse;}
.frozen-hdr th{background:var(--cardSolid);box-shadow:inset 0 -1.5px 0 rgba(16,40,41,0.12);}
table{border-collapse:collapse;width:100%;font-size:13px;}
th{font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--label);text-align:left;padding:11px 12px;border-bottom:1.5px solid rgba(16,40,41,0.08);white-space:nowrap;cursor:default;}
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--accent);}
td{padding:11px 12px;border-bottom:1px solid rgba(16,40,41,0.055);vertical-align:middle;color:var(--body);}
tr.clickable{cursor:pointer;transition:background .12s;}
tr.clickable:hover{background:rgba(255,255,255,0.6);}
tr.clickable.expanded{background:rgba(0,126,136,0.06);}
.caret{display:inline-block;width:11px;color:#008C99;font-size:10px;}
tr.product-detail>td{background:rgba(0,140,153,0.04);border-bottom:1.5px solid rgba(0,126,136,0.14);}
tr.product-detail table{margin-top:2px;}
tr.product-detail td{padding:6px 10px;}
tr.superhead th{background:transparent;border:none;border-bottom:none;padding:0 3px 3px;}
tr.superhead th.costbar{text-align:center;background:linear-gradient(180deg,#008C99,#00707A);color:#fff;font-weight:800;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border-radius:6px 6px 0 0;padding:5px 8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,0.12);}
td.costcol,th.costcol{background:rgba(0,140,153,0.05);}
th.costcol{border-top:2px solid rgba(0,140,153,0.35);}
td.costcol .t-sub{font-size:10px;}
tr.superhead th.actbar{text-align:center;background:linear-gradient(180deg,#0E5A63,#0B3B45);color:#fff;font-weight:800;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border-radius:6px 6px 0 0;padding:5px 8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,0.12);}
td.actcol,th.actcol{text-align:center;background:rgba(14,90,99,0.06);white-space:nowrap;}
th.actcol{border-top:2px solid rgba(14,90,99,0.35);font-size:10px;}
td.actcol input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#0E5A63;margin:0;}
.note-area{width:100%;min-height:64px;resize:vertical;font-family:inherit;font-size:13px;line-height:1.5;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
table.lhead th.num{text-align:left;}   /* candidate tables: keep every column header left-aligned (numbers in the cells stay right-aligned) */
.t-strong{font-weight:700;color:var(--ink);}
.t-name{font-weight:600;color:var(--ink);}
.t-sub{font-size:11px;color:var(--meta);}

/* ---------- Inputs ---------- */
input[type=text],input[type=number],select,textarea{
  width:100%;background:#fff;border:1px solid var(--inputBorder);border-radius:15px;
  padding:11px 14px;font-size:14px;font-family:var(--sans);color:var(--body);outline:none;transition:all .15s;
}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23007E88' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px;}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 4px rgba(111,220,205,0.18);}
input::placeholder,textarea::placeholder{color:var(--meta);}
label.field-label{display:block;font-size:12px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--label);margin-bottom:7px;}
.field{margin-bottom:14px;}

/* ---------- Buttons ---------- */
.btn{background:var(--btn);color:var(--ink);border:none;border-radius:22px;padding:12px 22px;font-size:12.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;box-shadow:var(--btnShadow);transition:transform .12s,box-shadow .12s;display:inline-block;}
.btn:hover{transform:translateY(-1px);box-shadow:0 18px 40px rgba(73,205,190,0.36);}
.btn:active{transform:translateY(0);}
.btn.ghost{background:var(--pill);color:var(--accent);border:1px solid var(--pillBorder);box-shadow:var(--pillShadow);}
.btn.ghost:hover{box-shadow:var(--pillShadow);background:#fff;}
.btn.sm{padding:8px 15px;font-size:11px;border-radius:16px;}
.btn.dark{background:var(--ink);color:#EAFBF7;box-shadow:0 14px 34px rgba(16,40,41,0.22);}

/* filter row */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
.filters .fg{display:flex;flex-direction:column;gap:6px;min-width:150px;}
.filters .fg label{font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--label);}
.filters select,.filters input{padding:9px 12px;border-radius:13px;font-size:13px;}

/* progress */
.prog{height:9px;background:var(--track);border-radius:99px;overflow:hidden;}
.prog>span{display:block;height:100%;border-radius:99px;background:var(--btn);}
.prog.green>span{background:var(--green);}
.prog.yellow>span{background:var(--yellow);}
.prog.red>span{background:var(--red);}

/* stacked bar */
.stack{display:flex;height:26px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.6);}
.stack.tall{height:34px;}
.stack>span{display:flex;align-items:center;justify-content:center;height:100%;overflow:hidden;}
.bar-val{font-size:9.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;text-shadow:0 1px 1px rgba(0,0,0,0.18);}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
.legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted2);}
.legend .sw{width:11px;height:11px;border-radius:4px;}
.seg-click,.legend .li.seg-click{cursor:pointer;}
/* Column (vertical-bar) charts for the "Where the spend goes" breakdowns. All three share one y-axis
   scale so the single tallest value across the three charts reaches the top. X-axis names sit below,
   rotated -45° (diagonal) so long labels fit without overlapping. */
.colchart{width:100%;padding:0 10px 0 18px;box-sizing:border-box;}
.cc-plot{display:flex;align-items:stretch;gap:6px;padding:0 6px;height:150px;border-bottom:1.5px solid var(--cardBorder);}
.cc-col{flex:1 1 0;min-width:0;display:flex;align-items:flex-end;justify-content:center;}
.cc-bar{width:100%;max-width:26px;min-height:2px;border-radius:4px 4px 0 0;cursor:pointer;transition:filter .15s ease;}
.cc-bar:hover{filter:saturate(1.25) brightness(1.05);}
.cc-labs{display:flex;gap:6px;padding:0 6px;margin-top:2px;height:82px;overflow:visible;}
.cc-lab{flex:1 1 0;min-width:0;position:relative;}
.cc-l{position:absolute;top:3px;left:50%;transform-origin:top right;transform:translateX(-100%) rotate(-45deg);white-space:nowrap;font-size:8.5px;line-height:1.1;color:var(--muted2);cursor:pointer;}
.cc-l:hover{color:var(--accent);}
.spark{display:inline-block;vertical-align:middle;overflow:visible;}
.spark:hover{filter:saturate(1.3);}
.spend-reveal{position:fixed;z-index:9999;background:var(--ink);color:#fff;padding:6px 12px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(16,40,41,0.28);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s ease,transform .18s ease;white-space:nowrap;}
.spend-reveal.show{opacity:1;transform:translateY(0);}

/* insight card */
.insight{display:flex;gap:12px;padding:15px 16px;border-radius:18px;background:rgba(255,255,255,0.62);border:1px solid var(--pillBorder);box-shadow:var(--pillShadow);}
.insight .ic-badge{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
.insight .ic-badge svg{width:18px;height:18px;stroke-width:1.8;fill:none;}
.insight .it-title{font-weight:700;color:var(--ink);font-size:13px;}
.insight .it-body{font-size:12px;color:var(--muted2);margin-top:3px;line-height:1.45;}
.insight.warn .ic-badge{background:var(--yellowBg);}.insight.warn .ic-badge svg{stroke:var(--yellow);}
.insight.crit .ic-badge{background:var(--redBg);}.insight.crit .ic-badge svg{stroke:var(--red);}
.insight.ok .ic-badge{background:var(--greenBg);}.insight.ok .ic-badge svg{stroke:var(--green);}
.insight.info .ic-badge{background:rgba(0,126,136,0.10);}.insight.info .ic-badge svg{stroke:var(--accent);}

/* heatmap */
.heat td,.heat th{text-align:center;padding:0;}
.heat .cell{margin:3px;border-radius:11px;padding:11px 6px;font-weight:700;font-size:12.5px;color:var(--ink);cursor:pointer;transition:transform .1s;}
.heat .cell:hover{transform:scale(1.05);}
.heat .rowlabel{text-align:left;font-weight:600;color:var(--ink);font-size:12.5px;padding-right:12px;white-space:nowrap;}

/* side panel */
.overlay{position:fixed;inset:0;background:rgba(16,40,41,0.28);backdrop-filter:blur(3px);z-index:50;display:none;}
.overlay.show{display:block;}
.panel{position:fixed;top:0;right:0;height:100vh;width:min(640px,96vw);background:linear-gradient(160deg,#FBFEFD,#EFF9F7);box-shadow:-30px 0 80px rgba(20,65,70,0.18);z-index:60;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:30px 30px 60px;}
.panel.show{transform:translateX(0);}
.panel .close{position:absolute;top:22px;right:22px;width:38px;height:38px;border-radius:50%;background:var(--pill);border:1px solid var(--pillBorder);display:flex;align-items:center;justify-content:center;box-shadow:var(--pillShadow);cursor:pointer;}
.panel .close svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none;}

/* misc */
.metaline{font-size:11px;color:var(--meta);display:flex;gap:14px;flex-wrap:wrap;}
.metaline b{color:var(--label);font-weight:700;}
.divider{height:1px;background:rgba(16,40,41,0.08);margin:18px 0;}
.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:8px 14px;font-size:13px;}
.kv .k{color:var(--label);font-weight:600;font-size:11.5px;letter-spacing:0.03em;text-transform:uppercase;}
.kv .v{color:var(--body);}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;}
.checkline{display:flex;align-items:center;gap:9px;font-size:13px;padding:6px 0;}
.checkline input{width:auto;}
.scorebar{display:flex;align-items:center;gap:8px;}
.scorebar .track{flex:1;height:7px;background:var(--track);border-radius:99px;overflow:hidden;}
.scorebar .track>span{display:block;height:100%;background:var(--accent2);border-radius:99px;}
.scorebar .val{font-size:11px;font-weight:700;color:var(--ink);width:26px;text-align:right;}
.hint{font-size:11.5px;color:var(--meta);font-style:italic;}
.rec{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;}
.bubble-label{font-size:9px;fill:var(--muted2);font-family:var(--sans);}
.axis-label{font-size:11px;fill:var(--label);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;font-family:var(--sans);}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.tab{padding:9px 16px;border-radius:16px;font-size:12.5px;font-weight:600;background:var(--pill);border:1px solid var(--pillBorder);color:var(--muted2);box-shadow:var(--pillShadow);cursor:pointer;}
.tab.active{background:var(--ink);color:#EAFBF7;}
.empty{padding:40px;text-align:center;color:var(--meta);font-size:13px;}
.mini-kpi{display:flex;flex-direction:column;gap:3px;}
.mini-kpi .mv{font-size:19px;font-weight:700;color:var(--ink);font-family:var(--serif);}
.mini-kpi .ml{font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--label);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#EAFBF7;padding:13px 22px;border-radius:18px;font-size:13px;font-weight:600;box-shadow:0 18px 44px rgba(16,40,41,0.3);opacity:0;transition:all .3s;z-index:100;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ v2 additions ============ */
.appwrap{max-width:1680px;margin:0 auto;padding:0 30px 64px;}
.appheader{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:15px 22px;margin:0 -12px 4px;border-radius:0 0 26px 26px;
  background:rgba(255,255,255,0.78);backdrop-filter:blur(12px);border:1px solid var(--cardBorder);border-top:none;box-shadow:var(--pillShadow);}
.appheader .hbrand{display:flex;flex-direction:column;min-width:196px;margin-right:auto;}
.appheader .hbrand .eyebrow{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);}
.appheader .hbrand h1{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-0.01em;line-height:1.08;margin-top:3px;}
.appheader .hbrand .sub{font-size:10.5px;color:var(--muted2);margin-top:3px;}
.hctrl{display:flex;flex-direction:column;gap:4px;}
.hctrl label{font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--label);}
.hctrl select,.hctrl input{padding:8px 11px;border-radius:12px;font-size:12.5px;min-width:118px;}
.hctrl.search input{min-width:186px;}

<script>
/* ============================================================
   Quick projects — self-contained, offline single-file tool.
   Imports "Quick projects.xlsx" (3 sheets) and renders a 6-week
   capacity matrix, a project-candidate list + opportunity map,
   and a small-projects list, with quick name-based staffing.
   Illustrative / fictional data only.
   ============================================================ */
const LS_KEY='quickprojects_v1';
const WEEKS=6, DAYS_PER_WEEK=5, TOTAL_DAYS=WEEKS*DAYS_PER_WEEK;   // 30 working-day slots
const WD_MONTH=21.7;                                              // working days per month (rough)
const DAYLBL=['Mo','Tu','We','Th','Fr'];
const ROLE_COLS=['Project managers','Software developers','Aero engineers','Mech engineers','Electrical engineers','Systems engineers','Test & validation','Data scientists','Quality engineers','UX / design'];
const BLOCK_TOKENS=new Set(['','blocked','busy','x','-','—','n/a','na','no','none','false','0','off','unavailable']);

let state={ people:[], candidates:[], small:[], assignments:[], frozenCand:[], frozenSmall:[], candHeader:[], smallHeader:[], collapsed:{}, updated:null };

/* ---------- helpers ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(msg){ const t=document.getElementById('toast'); if(!t)return; t.textContent=msg; t.classList.add('show'); clearTimeout(state._tt); state._tt=setTimeout(()=>t.classList.remove('show'),2400); }
function uid(){ return 'a'+Math.random().toString(36).slice(2,9); }
function norm(s){ return String(s==null?'':s).trim().toLowerCase(); }
function cleanNum(v){ if(v===''||v==null) return NaN;
  let s=String(v).trim().replace(/[€$£%\s]/g,'').replace(/,/g,'');
  if(s==='') return NaN;
  const m=/^(-?\d*\.?\d+)(k|m|bn|b)$/i.exec(s);
  if(m){ const mult={k:1e3,m:1e6,b:1e9,bn:1e9}[m[2].toLowerCase()]; return (+m[1])*mult; }
  return +s; }
const IC={ upload:'<path d="M12 21V9M7 13l5-5 5 5"/><path d="M4 3h16"/>', reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>', capacity:'<path d="M4 20V10M9 20V4M14 20v-8M19 20V7"/>', candidate:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>', frame:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>', check:'<path d="M20 6L9 17l-5-5"/>', caret:'<path d="M9 6l6 6-6 6"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>' };
function icon(name,cls){ return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">'+(IC[name]||'')+'</svg>'; }
function fmtM(m){ const n=+m||0; const a=Math.abs(n); if(a>=1000) return '€'+(n/1000).toFixed(1)+'B'; return '€'+Math.round(n)+'M'; }
/* collapsible card: clicking the header toggles the body; caret rotates open/closed (state kept in state.collapsed) */
function section(key,title,badge,bodyHtml){
  const col=!!(state.collapsed&&state.collapsed[key]);
  return '<div class="card mb">'
    +'<div class="section-head sec-head" data-action="toggle-sec" data-sec="'+key+'">'
    +'<h3 class="card-title" style="display:flex;align-items:center;gap:10px"><span class="topic-caret'+(col?'':' open')+'">'+icon('caret')+'</span>'+esc(title)+'</h3>'
    +(badge||'')
    +'</div>'
    +'<div class="sec-body"'+(col?' style="display:none"':'')+'>'+bodyHtml+'</div>'
    +'</div>';
}

/* ---------- persistence ---------- */
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function hydrate(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const s=JSON.parse(raw);
  state.people=s.people||[]; state.candidates=s.candidates||[]; state.small=s.small||[];
  state.assignments=s.assignments||[]; state.updated=s.updated||null; state.collapsed=s.collapsed||{};
  state.frozenCand=s.frozenCand||[]; state.frozenSmall=s.frozenSmall||[];
  state.candHeader=s.candHeader||[]; state.smallHeader=s.smallHeader||[]; } }catch(e){} }

/* ============================================================
   Offline .xlsx reader (zip + worksheets → grids)
   ============================================================ */
function _readZipEntries(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder();
  let eocd=-1; for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('not a valid .xlsx (no zip directory)');
  const count=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true); const entries={};
  for(let n=0;n<count;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), commentLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=td.decode(u8.subarray(off+46,off+46+nameLen));
    entries[name]={method,compSize,localOff}; off+=46+nameLen+extraLen+commentLen;
  }
  return {dv,u8,entries};
}
async function _readEntryData(z,name){
  const e=z.entries[name]; if(!e) return null; const dv=z.dv, u8=z.u8, lo=e.localOff;
  if(dv.getUint32(lo,true)!==0x04034b50) throw new Error('corrupt .xlsx (bad local header)');
  const nameLen=dv.getUint16(lo+26,true), extraLen=dv.getUint16(lo+28,true), dataStart=lo+30+nameLen+extraLen;
  const comp=u8.subarray(dataStart,dataStart+e.compSize);
  if(e.method===0) return comp.slice();
  if(e.method===8){
    if(typeof DecompressionStream==='undefined') throw new Error('this browser can’t unzip .xlsx (no DecompressionStream) — please update it');
    const ds=new DecompressionStream('deflate-raw');
    const ab=await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(ab);
  }
  throw new Error('unsupported compression in .xlsx');
}
const _xlsxEls=(node,name)=>[...node.getElementsByTagNameNS('*',name)];
async function _readShared(z){
  if(!z.entries['xl/sharedStrings.xml']) return [];
  const doc=new DOMParser().parseFromString(new TextDecoder().decode(await _readEntryData(z,'xl/sharedStrings.xml')),'application/xml');
  return _xlsxEls(doc,'si').map(si=>_xlsxEls(si,'t').map(t=>t.textContent).join(''));
}
function _gridFromSheetDoc(doc, shared){
  const colIdx=ref=>{ const m=/^([A-Z]+)/.exec(ref||''); if(!m) return 0; let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64); return n-1; };
  const grid=[];
  _xlsxEls(doc,'row').forEach(row=>{ const arr=[];
    _xlsxEls(row,'c').forEach(c=>{ const idx=colIdx(c.getAttribute('r')); const t=c.getAttribute('t'); let val='';
      if(t==='inlineStr'){ val=_xlsxEls(c,'t').map(x=>x.textContent).join(''); }
      else if(t==='s'){ const v=_xlsxEls(c,'v')[0]; val=v?(shared[+v.textContent]||''):''; }
      else if(t==='str'){ const v=_xlsxEls(c,'v')[0]; val=v?v.textContent:''; }
      else { const v=_xlsxEls(c,'v')[0]; val=v?v.textContent:''; }
      arr[idx]=val; });
    grid.push(arr); });
  return grid;
}
async function xlsxAllSheets(buf){
  const z=_readZipEntries(buf), dec=new TextDecoder();
  const shared=await _readShared(z);
  const relMap={};
  if(z.entries['xl/_rels/workbook.xml.rels']){
    const rdoc=new DOMParser().parseFromString(dec.decode(await _readEntryData(z,'xl/_rels/workbook.xml.rels')),'application/xml');
    _xlsxEls(rdoc,'Relationship').forEach(r=>{ relMap[r.getAttribute('Id')]=r.getAttribute('Target'); });
  }
  const out=[];
  if(z.entries['xl/workbook.xml']){
    const wdoc=new DOMParser().parseFromString(dec.decode(await _readEntryData(z,'xl/workbook.xml')),'application/xml');
    for(const sh of _xlsxEls(wdoc,'sheet')){
      const name=sh.getAttribute('name')||'';
      const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||'';
      let target=relMap[rid]; if(!target) continue;
      target=target.replace(/^\//,''); if(!/^xl\//.test(target)) target='xl/'+target;
      if(!z.entries[target]) continue;
      const doc=new DOMParser().parseFromString(dec.decode(await _readEntryData(z,target)),'application/xml');
      out.push({name, grid:_gridFromSheetDoc(doc, shared)});
    }
  }
  if(!out.length){
    const sheetName=Object.keys(z.entries).filter(n=>/^xl\/worksheets\/.*\.xml$/.test(n)).sort()[0];
    if(sheetName){ const doc=new DOMParser().parseFromString(dec.decode(await _readEntryData(z,sheetName)),'application/xml'); out.push({name:'Sheet1', grid:_gridFromSheetDoc(doc,shared)}); }
  }
  return out;
}
function gridToRows(grid){

  const headers=(grid[0]||[]).map(h=>(h==null?'':String(h).trim()));

    headers.forEach((h,ci)=>{ if(!h) return; const cell=g[ci]; o[h]=(cell==null?'':String(cell)); if(o[h]!=='') any=true; });

/* ============================================================
   Import: parse the three sheets into state (authoritative)

function isFreeCell(v){ return !BLOCK_TOKENS.has(norm(v)); }
function parseCapacity(grid){
  const people=[];
  for(let i=1;i<grid.length;i++){ const g=grid[i]||[];
    const name=(g[0]==null?'':String(g[0])).trim(); if(!name) continue;
    const role=(g[1]==null?'':String(g[1])).trim();
    const free=[]; for(let d=0;d<TOTAL_DAYS;d++){ free.push(isFreeCell(g[2+d])); }
    people.push({name, role, free});

/* parse candidates → {header, list}. Each record keeps _row (raw cells aligned to header) so the
   workbook round-trips every column (incl. the business-canvas fields) on Output. */
function parseCandidates(grid){
  const header=(grid[0]||[]).map(h=>(h==null?'':String(h).trim()));
  const hidx={}; header.forEach((h,i)=>{ if(h && hidx[h]==null) hidx[h]=i; });
  const cell=(g,name)=>{ const i=hidx[name]; return (i==null||g[i]==null)?'':String(g[i]); };
  const list=[];
  for(let i=1;i<grid.length;i++){ const g=grid[i]||[];
    const id=String(cell(g,'ID')||cell(g,'id')||'').trim(); if(!id) continue;
    const roles={};
    ROLE_COLS.forEach(rc=>{ const v=cleanNum(cell(g,rc)); roles[rc]=isNaN(v)?0:v; });
    const durMonths=cleanNum(cell(g,'Rough duration'));
    const ttm=cleanNum(cell(g,'TTM & Cmplx'))||0;
    const fteScore=cleanNum(cell(g,'FTE × (TTM & Cmplx)'))||0;
    // Total FTE is DERIVED, never a stored/imported column: FTE × (TTM & Cmplx) ÷ (TTM & Cmplx).
    const fteTotal=ttm>0 ? fteScore/ttm : 0;
    list.push({
      id, name:cell(g,'Candidate'), ecosystem:cell(g,'Ecosystem'),
      npv:cleanNum(cell(g,'NPV'))||0, margin:cleanNum(cell(g,'Margin %'))||0,
      npvMargin:cleanNum(cell(g,'NPV × Margin'))||0,
      durMonths:isNaN(durMonths)?0:durMonths,
      ttm, investment:cleanNum(cell(g,'Investment'))||0,

}
function parseSmall(grid){
  const header=(grid[0]||[]).map(h=>(h==null?'':String(h).trim()));

  const cell=(g,name)=>{ const i=hidx[name]; return (i==null||g[i]==null)?'':String(g[i]); };
  const list=[];
  for(let i=1;i<grid.length;i++){ const g=grid[i]||[];
    const id=String(cell(g,'id')||cell(g,'ID')||'').trim(); if(!id) continue;

async function importFile(file){
  try{
    const buf=await file.arrayBuffer();
    const sheets=await xlsxAllSheets(buf);
    const byName={}; sheets.forEach(s=>{ byName[norm(s.name)]=s.grid; });
    const cap=byName['free capacity'], cand=byName['project candidates'], sm=byName['small projects'];
    const selCand=byName['selected project candidates'], selSmall=byName['selected small projects'];
    if(!cap && !cand && !sm && !selCand && !selSmall){ toast('No matching sheets found (need Free capacity / Project candidates / Small projects)'); return; }
    if(cap) parseCapacity(cap);
    if(cand){ const r=parseCandidates(cand); state.candHeader=r.header; state.candidates=r.list; }
    if(sm){ const r=parseSmall(sm); state.smallHeader=r.header; state.small=r.list; }
    // Selected sheets are AUTHORITATIVE: rebuild the frozen stores from exactly the rows present.
    // Deleting a row there and re-uploading unfreezes that project (it returns to the live table).
    applyFrozenSheet('cand', selCand, cand);
    applyFrozenSheet('small', selSmall, sm);
    // frozen projects never appear in the live tables
    const frC=new Set((state.frozenCand||[]).map(c=>c.id)); state.candidates=state.candidates.filter(c=>!frC.has(c.id));
    const frS=new Set((state.frozenSmall||[]).map(s=>s.id)); state.small=state.small.filter(s=>!frS.has(s.id));
    reconcileAssignments();
    state.updated=new Date().toISOString();
    persist(); render();
    toast('Imported · '+state.people.length+' people · '+state.candidates.length+' candidates · '+state.small.length+' small · '+((state.frozenCand||[]).length+(state.frozenSmall||[]).length)+' frozen');
  }catch(e){ toast('Import failed: '+e.message); console.error(e); }
}
/* Rebuild a frozen store from its Selected sheet. If the sheet is present, it wins outright
   (unfreeze = delete the row + re-upload). If the sheet is absent but the live sheet re-lists a
   frozen id, keep it frozen (the original 3-sheet file has no Selected tab). */
function applyFrozenSheet(kind, selGrid, liveGrid){
  const store = kind==='cand' ? 'frozenCand' : 'frozenSmall';
  if(selGrid){
    const r = kind==='cand' ? parseCandidates(selGrid) : parseSmall(selGrid);
    if(kind==='cand' && !state.candHeader.length && r.header.length) state.candHeader=r.header;
    if(kind==='small' && !state.smallHeader.length && r.header.length) state.smallHeader=r.header;
    const newIds=new Set(r.list.map(x=>x.id));
    // unfreeze: previously-frozen ids dropped from the sheet return to the live pool
    const live = kind==='cand' ? state.candidates : state.small;
    (state[store]||[]).forEach(fz=>{ if(!newIds.has(fz.id) && !live.some(x=>x.id===fz.id)) live.push(fz); });
    state[store]=r.list;
  }
  // no Selected sheet → keep the existing frozen store as-is (persisted).
}
function reconcileAssignments(){
  const candIds=new Set([...state.candidates.map(c=>c.id), ...(state.frozenCand||[]).map(c=>c.id)]);
  const smallIds=new Set([...state.small.map(s=>s.id), ...(state.frozenSmall||[]).map(s=>s.id)]);
  state.assignments=state.assignments.filter(a=>a.kind==='cand'?candIds.has(a.projId):smallIds.has(a.projId));
}

/* ============================================================
   Export: build a 5-sheet .xlsx (3 source sheets + 2 Selected tabs)
   Written with the STORE method (no compression) so no CompressionStream
   is needed; the reader above already handles method-0 entries.
   ============================================================ */
function _colLetter(i){ let s='', n=i+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function _crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++){ c^=u8[i]; for(let k=0;k<8;k++) c=(c>>>1)^(0xEDB88320 & -(c&1)); } return (c^0xFFFFFFFF)>>>0; }

function _sheetXml(rows){
  let out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row,r)=>{ out+='<row r="'+(r+1)+'">';
    (row||[]).forEach((cell,ci)=>{
      if(cell===''||cell==null) return;
      const ref=_colLetter(ci)+(r+1); const sv=String(cell);
      if(/^-?\d+(\.\d+)?$/.test(sv.trim()) && sv.trim()!==''){ out+='<c r="'+ref+'" t="n"><v>'+esc(sv.trim())+'</v></c>'; }
      else { out+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+esc(sv)+'</t></is></c>'; }
    });
    out+='</row>'; });
  return out+'</sheetData></worksheet>';
}
function _zipStore(files){
  const enc=new TextEncoder();
  const u16=n=>new Uint8Array([n&255,(n>>8)&255]);
  const u32=n=>new Uint8Array([n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255]);
  /* Valid MS-DOS date/time — Excel (esp. Excel for Mac) rejects archives whose
     date field is 0 (month 0 / day 0 is not a legal DOS date). Use 1980-01-01 00:00. */
  const dosTime=0, dosDate=(0<<9)|(1<<5)|1; // year 1980, month 1, day 1
  const locals=[], centrals=[]; let offset=0;
  files.forEach(f=>{ const name=enc.encode(f.name), data=f.data, crc=_crc32(data);
    const local=_concat([u32(0x04034b50),u16(20),u16(0),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);
    locals.push(local);
    centrals.push(_concat([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]));
    offset+=local.length; });
  const centralBuf=_concat(centrals);
  const end=_concat([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralBuf.length),u32(offset),u16(0)]);
  return new Blob([_concat(locals),centralBuf,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function capacitySheetRows(){
  const header=['name','role']; for(let w=0;w<WEEKS;w++) for(let d=0;d<DAYS_PER_WEEK;d++) header.push(DAYLBL[d]);
  const rows=[header];
  state.people.forEach(p=>{ const r=[p.name,p.role]; for(let d=0;d<TOTAL_DAYS;d++) r.push(p.free[d]?'free':'blocked'); rows.push(r); });

}
/* Canonical column spec per record type: [columnName, getter]. Column names match exactly what the
   importer looks for, so a synthesized row round-trips back into the same fields on re-upload. */
function _recordSpec(kind){
  if(kind==='cand'){
    const m=[['ID',c=>c.id],['Candidate',c=>c.name],['Ecosystem',c=>c.ecosystem],['NPV',c=>c.npv],
      ['Margin %',c=>c.margin],['NPV × Margin',c=>c.npvMargin],['Rough duration',c=>c.durMonths],
      ['TTM & Cmplx',c=>c.ttm],['Investment',c=>c.investment],['FTE × (TTM & Cmplx)',c=>c.fteScore]];
    ROLE_COLS.forEach(rc=> m.push([rc, c=>(c.roles&&c.roles[rc]!=null)?c.roles[rc]:'']));
    m.push(['Capability bricks needed',c=>c.bricks]);
    return m;
  }
  return [['id',s=>s.id],['name',s=>s.name],['category',s=>s.category],
    ['FTE total',s=>s.fteTotal],['Duration (days)',s=>s.durationDays]];
}
/* Build the rows for a record sheet. Prefer each record's raw _row (preserves every original column,
   incl. business-canvas fields). If _row is missing/blank — e.g. data loaded before _row existed, or
   built via a non-import path — synthesize the row from the record's live fields so the displayed
   projects always land in the file and re-import restores them. */
function recordsSheetRows(kind,header,list){
  const spec=_recordSpec(kind);
  const getter={}; spec.forEach(([n,g])=>{ getter[String(n).trim().toLowerCase()]=g; });
  const h=(header&&header.length)?header.slice():spec.map(x=>x[0]);
  const rows=[h.slice()];
  (list||[]).forEach(rec=>{
    const raw=rec._row;
    if(raw && raw.length && raw.some(v=>v!=='' && v!=null)){
      rows.push(h.map((_,i)=> raw[i]==null?'':raw[i]));
    } else {
      rows.push(h.map(name=>{ const g=getter[String(name).trim().toLowerCase()]; const v=g?g(rec):''; return v==null?'':v; }));
    }
  });

}
function buildWorkbookSheets(){

/* ============================================================
   Staffing engine
   ============================================================ */
function candDurDays(projId){ const c=state.candidates.find(x=>x.id===projId)||(state.frozenCand||[]).find(x=>x.id===projId); return c?Math.max(1,Math.round(c.durMonths*WD_MONTH)):0; }
function smallDurDays(projId){ const s=state.small.find(x=>x.id===projId)||(state.frozenSmall||[]).find(x=>x.id===projId); return s?Math.max(1,Math.round(s.durationDays)):0; }
function assignDurDays(a){ return a.kind==='cand'?candDurDays(a.projId):smallDurDays(a.projId); }
function personConsumed(personName){
  const used=new Array(TOTAL_DAYS).fill(false);
  state.assignments.forEach(a=>{ if(norm(a.person)!==norm(personName)) return;
    const dur=assignDurDays(a); const start=(a.startWeek-1)*DAYS_PER_WEEK;
    for(let k=0;k<dur;k++){ const di=start+k; if(di>=0&&di<TOTAL_DAYS) used[di]=true; }
  });
  return used;
}
function personByName(name){ return state.people.find(p=>norm(p.name)===norm(name)); }
function assignmentsFor(kind,projId){ return state.assignments.filter(a=>a.kind===kind&&a.projId===projId); }
function addAssignment(kind,projId,slot){
  const sfx=(slot==null?'':'-'+slot);
  const nameEl=document.getElementById('snm-'+kind+'-'+projId+sfx);
  const wkEl=document.getElementById('swk-'+kind+'-'+projId+sfx);
  if(!nameEl||!wkEl) return;
  const name=(nameEl.value||'').trim(); const wk=+wkEl.value||1;
  if(!name){ toast('Type a person name'); nameEl.focus(); return; }
  const match=personByName(name);
  state.assignments.push({id:uid(), kind, projId, person: match?match.name:name, startWeek:wk});
  persist(); render();
  if(!match) toast('Added — note: “'+name+'” is not in the capacity list, so it won’t show in the matrix');
}
function removeAssignment(id){ state.assignments=state.assignments.filter(a=>a.id!==id); persist(); render(); }
/* Freeze every fully-staffed project (all FTE slots filled) into the frozen stores. Frozen projects
   leave the live tables + opportunity map, but their staffing assignments are kept — so the people
   stay booked in the capacity matrix. Frozen items accumulate and surface only in the two Selected
   Excel tabs on Output; unfreeze by deleting the row there and re-importing. */
function freezeSelected(){
  state.frozenCand=state.frozenCand||[]; state.frozenSmall=state.frozenSmall||[];
  let addedC=0, addedS=0;
  const haveC=new Set(state.frozenCand.map(c=>c.id));
  state.candidates.slice().forEach(c=>{ if(isFullyStaffed('cand',c.id) && !haveC.has(c.id)){ state.frozenCand.push(c); haveC.add(c.id); addedC++; } });
  state.candidates=state.candidates.filter(c=>!haveC.has(c.id));
  const haveS=new Set(state.frozenSmall.map(s=>s.id));
  state.small.slice().forEach(s=>{ if(isFullyStaffed('small',s.id) && !haveS.has(s.id)){ state.frozenSmall.push(s); haveS.add(s.id); addedS++; } });
  state.small=state.small.filter(s=>!haveS.has(s.id));
  if(!addedC && !addedS){ toast('Nothing ready — fill every FTE slot on a project first'); return; }
  persist(); render();
  toast('Frozen — '+addedC+' candidate'+(addedC===1?'':'s')+' + '+addedS+' small project'+(addedS===1?'':'s')+' moved to the Selected tabs');
}
function resetAll(){ if(!confirm('Clear all imported data and staffing? This cannot be undone.')) return;
  state={people:[],candidates:[],small:[],assignments:[],frozenCand:[],frozenSmall:[],candHeader:[],smallHeader:[],collapsed:{},updated:null}; persist(); render(); toast('Cleared'); }

function kpiBand(){

  // free person-days available (originally free minus consumed)
  let avail=0, capacity=0;
  state.people.forEach(p=>{ const used=personConsumed(p.name);
    for(let d=0;d<TOTAL_DAYS;d++){ if(p.free[d]){ capacity++; if(!used[d]) avail++; } } });
  const staffed=capacity-avail;
  const cards=[
    ['People', state.people.length, 'in capacity view'],
    ['Free person-days', avail, 'of '+capacity+' free-capacity days left'],
    ['Booked person-days', staffed, 'consumed by staffing'],
    ['Projects', (state.candidates.length+state.small.length), state.candidates.length+' candidates · '+state.small.length+' small']
  ];
  return '<div class="grid g4 mb">'+cards.map(c=>'<div class="kpi"><div class="k-label">'+esc(c[0])+'</div><div class="k-value">'+c[1]+'</div><div class="k-sub">'+esc(c[2])+'</div></div>').join('')+'</div>';
}
function capacitySection(){
  if(!state.people.length) return '';
  let wkHdr='<tr><th></th>'; for(let w=0;w<WEEKS;w++){ wkHdr+='<th class="wkhdr'+(w>0?' wkstart':'')+'" colspan="'+DAYS_PER_WEEK+'">Week '+(w+1)+'</th>'; } wkHdr+='</tr>';
  let dHdr='<tr><th></th>'; for(let w=0;w<WEEKS;w++){ for(let d=0;d<DAYS_PER_WEEK;d++){ dHdr+='<th class="dhdr'+(d===0&&w>0?' wkstart':'')+'">'+DAYLBL[d]+'</th>'; } } dHdr+='</tr>';
  let body='';
  state.people.forEach(p=>{
    const used=personConsumed(p.name);
    let row='<tr><td class="pname"><div class="nm">'+esc(p.name)+'</div><div class="rl">'+esc(p.role)+'</div></td>';
    for(let d=0;d<TOTAL_DAYS;d++){
      const wkStart=(d%DAYS_PER_WEEK===0 && d>0)?' wkstart':'';
      // three states: free (jade) · staffed = originally free but booked onto a project (light blue) · blocked (transparent)
      let cls='blocked';
      if(p.free[d]) cls=used[d]?'staffed':'free';
      const why=cls==='staffed'?'booked onto a project':cls;
      row+='<td class="capcelltd'+wkStart+'"><div class="cap-cell '+cls+'" title="'+esc(p.name)+' · week '+(Math.floor(d/DAYS_PER_WEEK)+1)+' '+DAYLBL[d%DAYS_PER_WEEK]+' · '+why+'"></div></td>';
    }
    row+='</tr>'; body+=row;
  });
  const inner='<div class="capwrap"><table class="capgrid"><thead>'+wkHdr+dHdr+'</thead><tbody>'+body+'</tbody></table></div>'
    +'<div class="legend"><div class="li"><span class="sw free"></span>Free</div>'
    +'<div class="li"><span class="sw staffed"></span>Booked onto a project</div>'
    +'<div class="li"><span class="sw blocked"></span>Blocked / unavailable</div>'
    +'<div class="li" style="margin-left:auto;font-style:italic">Assign people in the lists below — their booked days appear here automatically.</div></div>';
  return section('capacity','Capacity — next six weeks','<span class="badge soft">'+state.people.length+' people · '+TOTAL_DAYS+' working days</span>',inner);
}
function nameDatalist(){
  return '<datalist id="peopleList">'+state.people.map(p=>'<option value="'+esc(p.name)+'"></option>').join('')+'</datalist>';
}
/* A project needs `need` (= its FTE total, rounded) people. Render exactly that many staffing slots
   (plus any extra over-bookings); the project is "ready to freeze" once every slot is filled. */
function fteNeed(kind,projId){
  const p = kind==='cand' ? (state.candidates.find(x=>x.id===projId)||(state.frozenCand||[]).find(x=>x.id===projId))
                          : (state.small.find(x=>x.id===projId)||(state.frozenSmall||[]).find(x=>x.id===projId));
  return p ? Math.max(0, Math.round(+p.fteTotal||0)) : 0;
}
function isFullyStaffed(kind,projId){ const need=fteNeed(kind,projId); return need>0 && assignmentsFor(kind,projId).length>=need; }
function staffCell(kind,projId){
  const asns=assignmentsFor(kind,projId);
  const need=fteNeed(kind,projId);
  const slots=Math.max(need, asns.length);
  let wkOpts=''; for(let w=1;w<=WEEKS;w++) wkOpts+='<option value="'+w+'">Wk '+w+'</option>';
  let html='<div class="staff-slots">';
  for(let i=0;i<slots;i++){
    const a=asns[i], extra=i>=need;
    html+='<div class="staff-slot'+(a?' filled':' empty')+(extra?' extra':'')+'">';
    if(a){ const miss=!personByName(a.person);
      html+='<div class="slot-top"><span class="slotnum">'+(i+1)+'</span>'
        +'<span class="slot-name'+(miss?' miss':'')+'" title="'+(miss?'Not in capacity list':'')+'">'+esc(a.person)+'</span></div>'
        +'<div class="slot-bot"><span class="slot-wk">Wk '+a.startWeek+'</span>'
        +'<button data-action="rm-asn" data-id="'+a.id+'" title="Remove">'+icon('close')+'</button></div>';
    } else {
      html+='<div class="slot-top"><span class="slotnum">'+(i+1)+'</span>'
        +'<input class="snm" list="peopleList" id="snm-'+kind+'-'+projId+'-'+i+'" placeholder="Person name" /></div>'
        +'<div class="slot-bot"><select class="swk" id="swk-'+kind+'-'+projId+'-'+i+'">'+wkOpts+'</select>'
        +'<button class="btn sm" data-action="add-asn" data-kind="'+kind+'" data-proj="'+esc(projId)+'" data-slot="'+i+'">Add</button></div>';
    }
    html+='</div>';
  }
  html+='</div>';
  const full=need>0 && asns.length>=need;
  html+='<div class="staff-status'+(full?' ready':'')+'">'+asns.length+' / '+need+' staffed'+(full?' · ready to freeze':(need>0?' · '+(need-asns.length)+' to go':' · no FTE set'))+'</div>';
  return '<div class="staff-cell">'+html+'</div>';
}
function candidatesSection(){
  if(!state.candidates.length) return '';
  let rows='';
  state.candidates.forEach(c=>{
    rows+='<tr>'
      +'<td class="t-strong">'+esc(c.id.toUpperCase())+'</td>'
      +'<td class="t-name">'+esc(c.name)+'</td>'
      +'<td class="t-sub">'+esc(c.ecosystem)+'</td>'
      +'<td class="num">'+fmtM(c.npv)+'</td>'
      +'<td class="num">'+(c.margin?c.margin+'%':'—')+'</td>'
      +'<td class="num">'+(c.durMonths?c.durMonths+' mo':'—')+'</td>'
      +'<td class="num t-sub">≈'+candDurDays(c.id)+' d</td>'
      +'<td class="num">'+(c.ttm||'—')+'</td>'
      +'<td class="num">'+fmtM(c.investment)+'</td>'
      +'<td class="staff-cell">'+staffCell('cand',c.id)+'</td>'
      +'</tr>';
  });
  const inner='<div class="tablewrap"><table class="lhead"><thead><tr>'
    +'<th>ID</th><th>Candidate</th><th>Ecosystem</th><th class="num">NPV</th><th class="num">Margin</th>'
    +'<th class="num">Duration</th><th class="num">≈ Days</th><th class="num">TTM &amp; Cmplx</th><th class="num">Investment</th>'
    +'<th>Staffing (name + start week)</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  return section('candidates','Project candidates','<span class="badge soft">'+state.candidates.length+' candidates · duration in months → working days</span>',inner);
}
function oppMatrix(){
  if(!state.candidates.length) return '';
  const W=680,H=396,pad={l:66,r:24,t:18,b:60};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const cands=[...state.candidates];
  const maxSpend=Math.max(...cands.map(c=>+c.investment||0),1);
  const maxScore=Math.max(...cands.map(c=>+c.fteScore||0),1);
  const maxVal=Math.max(...cands.map(c=>+c.npvMargin||0),1);
  const X=f=>pad.l+(Math.max(0,Math.min(100,f))/100)*iw;
  const Y=v=>pad.t+(1-Math.max(0,Math.min(1,(+v||0)/maxVal)))*ih;
  const invR=s=>7+Math.sqrt((+s||0)/maxSpend)*20;
  const resR=e=>5+Math.sqrt((+e||0)/maxScore)*20;
  const tick='style="font-size:10px;fill:var(--muted2);font-family:var(--sans)"';
  const vy1=pad.t+ih/3, vy2=pad.t+2*ih/3, vx1=X(100/3), vx2=X(200/3);
  const gridLines=
    '<line x1="'+vx1.toFixed(1)+'" y1="'+pad.t+'" x2="'+vx1.toFixed(1)+'" y2="'+(pad.t+ih)+'" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>'+
    '<line x1="'+vx2.toFixed(1)+'" y1="'+pad.t+'" x2="'+vx2.toFixed(1)+'" y2="'+(pad.t+ih)+'" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>'+
    '<line x1="'+pad.l+'" y1="'+vy1.toFixed(1)+'" x2="'+(pad.l+iw)+'" y2="'+vy1.toFixed(1)+'" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>'+
    '<line x1="'+pad.l+'" y1="'+vy2.toFixed(1)+'" x2="'+(pad.l+iw)+'" y2="'+vy2.toFixed(1)+'" stroke="var(--cardBorder)" stroke-dasharray="4 3"/>';
  const cellW=iw/3, cellH=ih/3;
  const quadFill=(col,row)=>{ const d=col+(2-row);
    return d>=4?'rgba(64,196,180,0.30)':d===3?'rgba(64,196,180,0.18)':d===2?'rgba(64,196,180,0.10)':d===1?'rgba(64,196,180,0.045)':'none'; };
  let quadRects='';
  for(let row=0;row<3;row++){ for(let col=0;col<3;col++){ const f=quadFill(col,row); if(f==='none')continue;
    quadRects+='<rect x="'+(pad.l+col*cellW).toFixed(1)+'" y="'+(pad.t+row*cellH).toFixed(1)+'" width="'+cellW.toFixed(1)+'" height="'+cellH.toFixed(1)+'" fill="'+f+'"/>'; } }
  const yTicks=[{v:maxVal,y:pad.t},{v:Math.round(maxVal*2/3),y:vy1},{v:Math.round(maxVal/3),y:vy2},{v:0,y:pad.t+ih}]
    .map(t=>'<text '+tick+' x="'+(pad.l-8).toFixed(1)+'" y="'+(t.y+3).toFixed(1)+'" text-anchor="end">'+esc(fmtM(t.v))+'</text>').join('');
  const xTicks=[{v:0,x:pad.l},{v:33,x:vx1},{v:66,x:vx2},{v:100,x:pad.l+iw}]
    .map(t=>'<text '+tick+' x="'+t.x.toFixed(1)+'" y="'+(pad.t+ih+16).toFixed(1)+'" text-anchor="middle">'+t.v+'</text>').join('');
  const bubbles=cands.sort((a,b)=>(+b.investment||0)-(+a.investment||0)).map(c=>{
    const x=X(+c.ttm||0), y=Y(+c.npvMargin||0);
    return '<g style="cursor:default">'
      +'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+invR(c.investment).toFixed(1)+'" fill="none" stroke="var(--accent)" stroke-width="1.6"/>'
      +'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+resR(c.fteScore).toFixed(1)+'" fill="none" stroke="var(--muted2)" stroke-width="1.4" stroke-dasharray="3 2"/>'
      +'<text class="bubble-label" x="'+x.toFixed(1)+'" y="'+(y+3).toFixed(1)+'" text-anchor="middle" style="font-weight:700">'+esc(c.id.toUpperCase())+'</text></g>';
  }).join('');
  const inner='<div style="max-width:820px;margin:0 auto"><svg class="matrix-svg" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'
    +quadRects+gridLines
    +'<line x1="'+pad.l+'" y1="'+(pad.t+ih)+'" x2="'+(pad.l+iw)+'" y2="'+(pad.t+ih)+'" stroke="var(--muted2)"/>'
    +'<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(pad.t+ih)+'" stroke="var(--muted2)"/>'
    +yTicks+xTicks
    +'<text class="axis-label" x="'+(pad.l+iw/2)+'" y="'+(H-26)+'" text-anchor="middle" style="text-transform:none;letter-spacing:normal">Feasibility</text>'
    +'<text '+tick+' x="'+(pad.l+iw).toFixed(1)+'" y="'+(H-8)+'" text-anchor="end">100 means highly feasible and fast</text>'
    +'<text class="axis-label" x="'+(-(pad.t+ih/2))+'" y="16" text-anchor="middle" transform="rotate(-90)" style="text-transform:none;letter-spacing:normal">NPV × Margin (€M)</text>'
    +bubbles
  +'</svg></div>'
  +'<div class="chip-row" style="margin-top:10px"><span class="badge soft"><span class="dot" style="background:var(--accent)"></span> Solid ring = investment needed</span><span class="badge soft"><span class="dot" style="background:var(--muted2)"></span> Dashed ring = resource needs (FTE × TTM &amp; Cmplx)</span></div>';
  return section('opportunity','Opportunity map','<span class="badge soft">'+cands.length+' candidates · 9 quadrants</span>',inner);
}
function smallSection(){
  if(!state.small.length) return '';
  let rows='';
  state.small.forEach(s=>{
    rows+='<tr>'
      +'<td class="t-strong">'+esc(s.id)+'</td>'
      +'<td class="t-name">'+esc(s.name)+'</td>'
      +'<td class="t-sub">'+esc(s.category)+'</td>'
      +'<td class="num">'+(s.fteTotal||0)+'</td>'
      +'<td class="num">'+(s.durationDays||0)+' d</td>'
      +'<td class="staff-cell">'+staffCell('small',s.id)+'</td>'
      +'</tr>';
  });
  const inner='<div class="tablewrap"><table class="lhead"><thead><tr>'
    +'<th>ID</th><th>Name</th><th>Category</th><th class="num">FTE total</th><th class="num">Duration</th>'
    +'<th>Staffing (name + start week)</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  return section('small','Small projects','<span class="badge soft">'+state.small.length+' items · duration in working days</span>',inner);
}
/* Bottom-of-page "Freeze and update" — commits every fully-staffed project into the two Selected
   stores, hides it from the live tables, and keeps its people booked in the matrix. */
function freezeBar(){
  const readyC=state.candidates.filter(c=>isFullyStaffed('cand',c.id)).length;
  const readyS=state.small.filter(s=>isFullyStaffed('small',s.id)).length;
  const ready=readyC+readyS;
  const frC=(state.frozenCand||[]).length, frS=(state.frozenSmall||[]).length;
  return '<div class="card mb" style="border:1px solid var(--cardBorder)">'
    +'<div class="section-head"><h3 class="card-title">Freeze &amp; update the selection</h3>'
    +'<div class="chip-row"><span class="badge soft">'+frC+' candidate'+(frC===1?'':'s')+' frozen</span>'
    +'<span class="badge soft">'+frS+' small project'+(frS===1?'':'s')+' frozen</span></div></div>'
    +'<p class="card-sub" style="margin:-6px 0 10px"><b>'+ready+'</b> project'+(ready===1?' is':'s are')+' fully staffed and ready to freeze. '
    +'<b>Freeze and update</b> moves every fully-staffed project into the <b>Selected Project Candidates</b> / <b>Selected Small Projects</b> tabs, removes it from the lists and opportunity map, and keeps its people booked in the capacity matrix. '
    +'Use <b>Output</b> (top right) to download the workbook with those two tabs. To unfreeze, delete the row from a Selected tab and re-import with <b>Input</b>.</p>'
    +'<button class="btn '+(ready?'primary':'ghost')+'" data-action="freeze-selected"'+(ready?'':' disabled')+'>'+icon('check','ic')+' Freeze and update'+(ready?' ('+ready+')':'')+'</button>'
    +'</div>';
}
function emptyState(){
  return '<div class="card"><div class="empty">'+icon('capacity','ic')+' <div style="margin-top:10px">No data yet — import <b>Quick projects.xlsx</b> above to see the capacity matrix, candidates, opportunity map and small projects.</div></div></div>';
}
function render(){
  const el=document.getElementById('app');
  const hasData=state.people.length||state.candidates.length||state.small.length;
  el.innerHTML=
    '<div class="pagelede"><div class="page-eyebrow">Six-week planner</div>'
    +'<div class="page-title">Quick projects &amp; capacity</div>'
    +'<div class="page-desc">Import the workbook to see who is free over the next six weeks, then staff project candidates and small projects by name and start week — bookings flow straight into the capacity matrix.</div></div>'
    + nameDatalist()
    + ioCard()
    + (hasData ? (kpiBand()+capacitySection()+candidatesSection()+oppMatrix()+smallSection()+freezeBar()) : emptyState());
  const hu=document.getElementById('hUpdated');
  if(hu) hu.textContent = state.updated ? new Date(state.updated).toLocaleString() : '—';
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-action]'); if(!a) return;
  const act=a.getAttribute('data-action');
  if(act==='pick-file'){ e.preventDefault(); document.getElementById('fileInput').click(); }
  else if(act==='reset'){ e.preventDefault(); resetAll(); }
  else if(act==='add-asn'){ e.preventDefault(); addAssignment(a.getAttribute('data-kind'), a.getAttribute('data-proj'), a.getAttribute('data-slot')); }
  else if(act==='rm-asn'){ e.preventDefault(); removeAssignment(a.getAttribute('data-id')); }
  else if(act==='toggle-sec'){ const k=a.getAttribute('data-sec'); state.collapsed[k]=!state.collapsed[k]; persist(); render(); }
  else if(act==='freeze-selected'){ e.preventDefault(); freezeSelected(); }
  else if(act==='export'){ e.preventDefault(); downloadWorkbook(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('snm')){
    const id=e.target.id||''; const m=/^snm-(cand|small)-(.+)-(\d+)$/.exec(id);
    if(m){ e.preventDefault(); addAssignment(m[1], m[2], m[3]); }
  }
});
document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) importFile(f); e.target.value=''; });
(function dnd(){
  document.addEventListener('dragover',e=>{ const dz=e.target.closest&&e.target.closest('#dropzone'); if(dz){ e.preventDefault(); dz.classList.add('drag'); } });
  document.addEventListener('dragleave',e=>{ const dz=e.target.closest&&e.target.closest('#dropzone'); if(dz) dz.classList.remove('drag'); });
  document.addEventListener('drop',e=>{ const dz=e.target.closest&&e.target.closest('#dropzone'); if(dz){ e.preventDefault(); dz.classList.remove('drag'); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) importFile(f); } });
})();
(function progress(){ const bar=document.getElementById('scrollProgress'); if(!bar)return;
  window.addEventListener('scroll',()=>{ const h=document.documentElement; const sc=h.scrollTop/((h.scrollHeight-h.clientHeight)||1); bar.style.width=(sc*100)+'%'; },{passive:true}); })();

/* ---------- boot ---------- */
hydrate(); render();
</script>
</body>
</html>
